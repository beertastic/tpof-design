project: The Price of Freedom
character: Baylan
asset_id: CHAR-BAYLAN
version: "1.0"
status: REVIEW
date: "2026-07-30"
footer_left: THE PRICE OF FREEDOM - PRODUCTION DESIGN BIBLE
governing_documents:
  - ../../01-production-design/Production-Design-Bible-v1.0.md
  - ../../04-factions/mercenaries/Faction.md
  - Character.md
