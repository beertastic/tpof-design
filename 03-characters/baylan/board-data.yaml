boards:
  production:
    label: BOARD 01
    title: CHARACTER PRODUCTION BOARD
    output_pdf: Production-Board.pdf
    output_png: Production-Board-A2-300dpi.png
    tagline: Hiding is the only thing he still does well.
    images:
      - {path: source/artwork/portrait.png, x: 0.45, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/forest.png, x: 5.80, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/industrial_a.png, x: 11.15, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/vision_robes.png, x: 16.50, y: 1.35, w: 6.40, h: 2.45}
    sections:
      - heading: FIRST IMPRESSION
        x: 16.50
        y: 4.00
        w: 6.40
        h: 3.00
        items: [A tired man doing manual labour, Oldest person in the camp, Nobody worth watching, Utterly still when everyone else moves]
      - heading: CHARACTER LOCK
        x: 16.50
        y: 7.20
        w: 6.40
        h: 3.85
        font_size: 11.5
        items: [Reads as mercenary never as Jedi, Fifty and thickened not athletic, One remnant undertunic beneath, Crystal in a pouch under the shirt, No hilt on his belt]
      - heading: STORY FUNCTION
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Order 66 survivor eighteen years hidden, Point of view character eleven scenes, Nobody in the crew knows, Hunting the girl who is dreaming of him]
      - heading: VISUAL PRINCIPLE
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [The disguise has become the clothes, Plainness is the characterisation, Invisible first viewing obvious second, He is nobody and worked hard at it]
      - heading: DESIGN DRIFT - DO NOT
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.5
        items: [Jedi in a hood or cowl, Wise serene mentor at peace, Ranking officer or squad leader, Distinguished silver haired warrior, Visible lightsaber on the belt]

  costume:
    label: BOARD 02
    title: COSTUME CONSTRUCTION BOARD
    output_pdf: Costume-Board.pdf
    output_png: Costume-Board-A2-300dpi.png
    tagline: Eighteen years is long enough that it stops being a disguise.
    images:
      - {path: source/artwork/forest.png, x: 0.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/industrial_c.png, x: 5.95, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/industrial_a.png, x: 11.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/materials.png, x: 16.95, y: 1.35, w: 5.95, h: 4.25}
    sections:
      - heading: LAYER SYSTEM
        x: 16.95
        y: 5.80
        w: 5.95
        h: 5.25
        font_size: 11.5
        items: [Patched Jedi undertunic innermost, Heavy work shirt over it, Re-shouldered padded jacket, Functional harness and holster, Heavy resoled boots]
      - heading: CONSTRUCTION RULES
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Buildable seams and fasteners, Must strip back to shirtsleeves, Repairs and replacements stay visible, Nothing tailored or fitted, Nothing factory fresh]
      - heading: THE REMNANT
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Original weave re-dyed dark, Patched until only panels survive, Cross-wrapped front wrong for salvage, Visible only at collar and cuff, Never remarked upon by anyone]
      - heading: FABRICATION NOTES
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.7
        items: [No ornament insignia or trophies, Undertunic finer than everything over it, Cord must sit under the shirt, Separate build required for Scene 12 robes, Weathering follows labour and repair]

  weapons:
    label: BOARD 03
    title: WEAPONS & EQUIPMENT BOARD
    output_pdf: Weapons-Board.pdf
    output_png: Weapons-Board-A2-300dpi.png
    tagline: He took it apart and made it into something else. So did she.
    images:
      - {path: source/artwork/blaster.png, x: 0.45, y: 1.35, w: 10.90, h: 3.70}
      - {path: source/artwork/crystal.png, x: 0.45, y: 5.25, w: 5.25, h: 5.50}
      - {path: source/artwork/utility.png, x: 5.90, y: 5.25, w: 5.45, h: 5.50}
      - {path: source/artwork/maintenance.png, x: 11.55, y: 1.35, w: 5.40, h: 9.40}
      - {path: source/artwork/industrial_b.png, x: 17.15, y: 1.35, w: 5.75, h: 9.40}
    sections:
      - heading: THE CONVERTED SABER
        x: 0.45
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Built from his own lightsaber, Emitter shroud became barrel shroud, Belt clip never removed, Crystal chamber now holds a power cell, Ugly and it does not group well]
      - heading: THE CRYSTAL
        x: 7.90
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Small jagged yellow and uncut, Sentinel marker and his one discipline, Worn pouch on a cord against the skin, Not yet what it later becomes, The only thing he owns from before]
      - heading: WORKING KIT
        x: 15.35
        y: 11.00
        w: 7.55
        h: 4.70
        font_size: 11.5
        items: [Heavy rifle is his actual weapon, Scanner handed to him by Jasu, Nothing decorated nothing personal, The kit says nothing about the man, That absence is the characterisation]

  performance:
    label: BOARD 04
    title: PERFORMANCE & MOVEMENT BOARD
    output_pdf: Performance-Board.pdf
    output_png: Performance-Board-A2-300dpi.png
    tagline: He has spent eighteen years practising being uninteresting.
    images:
      - {path: source/artwork/industrial_a.png, x: 0.45, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/industrial_b.png, x: 5.80, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/maintenance.png, x: 11.15, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/expression_strip.png, x: 16.50, y: 1.35, w: 6.40, h: 3.50}
    sections:
      - heading: MOVEMENT PRINCIPLES
        x: 16.50
        y: 5.05
        w: 6.40
        h: 5.50
        items: [Heavy slow and unremarkable, Still in a way nobody else is, Does not kneel, Watches rooms and exits constantly, Stops performing only when alone]
      - heading: ACTOR NOTES
        x: 0.45
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Give nothing away ever, Being ordinary is the effort, Take the teasing without complaint, Scene 14 is a visible change of gear, Fifty years old and feeling it]
      - heading: FACIAL LANGUAGE
        x: 7.90
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Manufactured dull neutrality, Waking in terror and hiding it, Private contained grief, Focused and dangerous underneath, Eyes older than the rest of him]
      - heading: ENVIRONMENTAL BEHAVIOUR
        x: 15.35
        y: 10.80
        w: 7.55
        h: 4.90
        font_size: 11.7
        items: [Meditates where nobody can see, Sleeps badly and slips out at night, Stands at the back of every group, Practices alone among the crates, The camp is cover not home]

  materials:
    label: BOARD 05
    title: MATERIALS & COLOUR BOARD
    output_pdf: Materials-Board.pdf
    output_png: Materials-Board-A2-300dpi.png
    tagline: Muted. Worn. Repaired. Anonymous.
    images:
      - {path: source/artwork/materials.png, x: 0.45, y: 1.35, w: 7.00, h: 5.60}
      - {path: source/artwork/detail_portrait.png, x: 7.65, y: 1.35, w: 6.20, h: 8.00}
      - {path: source/artwork/forest.png, x: 14.05, y: 1.35, w: 4.30, h: 8.00}
      - {path: source/artwork/industrial_c.png, x: 18.55, y: 1.35, w: 4.35, h: 8.00}
    sections:
      - heading: APPROVED PALETTE
        x: 0.45
        y: 7.20
        w: 7.00
        h: 4.15
        font_size: 11.5
        items: ["Charcoal #2B2A26", "Ash brown #3A352F", "Dust brown #544E42", "Leather #6B5A47", "Faded tan #7C6F5B", "Faded olive #4F563F", "Weathered black #2E2F33", "Natural bone #BDAF95"]
      - heading: SURFACE LANGUAGE
        x: 0.45
        y: 11.60
        w: 7.25
        h: 4.10
        items: [Coarse insulated work fabric, Worn reinforced synth-leather, Quilted padding at repaired seams, Weathered matte metal hardware, Finer older weave beneath everything]
      - heading: LIGHT & CONTRAST
        x: 7.90
        y: 11.60
        w: 7.25
        h: 4.10
        items: [Overcast forest and camp firelight, Glowrod warmth for the tent scenes, Bleached desaturated dune for the vision, Keep him dark but never crushed, No colour without story purpose]
      - heading: OVERALL LOOK
        x: 15.35
        y: 11.60
        w: 7.55
        h: 4.10
        font_size: 13
        items: [Muted, Worn, Repaired, Anonymous, Non-reflective, Deliberately forgettable]
