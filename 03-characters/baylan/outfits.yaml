      # create it.
      #
      # SHEEN IS THE MECHANISM AND NOTHING SAID SO. The reference reads at all in
      # near-black because the panels are a DIFFERENT MATERIAL from the base —
      # suede against matte cloth — not a different tone. "TONAL, DARK ON DARK"
      # was true and insufficient: it described what must not happen (colour
      # contrast) without naming what makes the shape visible at all.
      - check: APPLIED PANELS with piped edges — suede on matte, NOT quilting.
        text: >
          THE CHEVRONS ARE SEPARATE PANELS LAID ON THE GARMENT AND OVERLAPPING
          EACH OTHER like layered plates, each with a RAISED PIPED EDGE that
          casts a real shadow. NOT quilting, NOT stitched rows, NOT padding that
          domes between seams. The lower band overlaps the one below it.
      - check: SHEEN not colour — suede panels on matte cloth, all near-black.
        text: >
          THE PANELS ARE SOFT SUEDE OR WORN LEATHER ON MATTE CANVAS, so they READ
          BY SHEEN AND NOT BY COLOUR — catching the light differently while
          staying the SAME NEAR-BLACK. NEVER a colour contrast, NEVER a lighter
          tone, NEVER printed or painted, NEVER a badge or insignia.
      - >
        THE PANEL IS WORN AND GRUBBY. Rubbed bare along the piped edges where the
        panels stand proudest, the suede gone shiny at the high points and grimy
        in the angles, corners lifting where the stitching has let go. It is a
        work garment that has been slept in, not a made thing anyone is proud of.
      # ADDED 2026-08-04. The first generation put a wide buckled strap
      # horizontally across his sternum, which read as a belt worn on the chest.
      # Nothing forbade it: the spec said "harness" and left the form open.
      # TIGHTENED TWICE. The first generation put a wide buckled strap
      # HORIZONTALLY across the sternum. The rule forbade horizontal, so the
      # second came back with a DIAGONAL bandolier and a buckle mid-chest — the
      # rule was obeyed and the fault survived it. Naming one direction taught
      # the generator to use another, so this now refuses the whole class.
      - check: NOTHING crosses his chest — no diagonal, no bandolier, no buckle.
        text: >
          NO STRAP CROSSES HIS CHEST — not horizontal, not diagonal, not a
          bandolier, NO buckle or fitting on the sternum. The harness is TWO
          PLAIN STRAPS running from the shoulders straight down to the belt,
          carrying nothing. AS DARK AS THE CLOTH — NEVER mid-brown, NEVER tan,
          NEVER lighter than it.
      - >
        THE CHEVRON PANEL IS PLAINLY VISIBLE IN EVERY VIEW — never hidden, never
        under another garment. The two harness straps cross OVER it and break the
        run of the bands in places. That is correct: the bands read through and
        around them, and are never moved or shrunk to make room.
      # REWRITTEN 2026-08-05 by the Production Designer, after NINE generations in
      # which the green never appeared once.
      #
      # THE RULES WERE TELLING IT TO HIDE. "AT NORMAL DISTANCE IT MUST READ AS
      # DARK THREAD AND NOTHING ELSE" and "findable only in close-up" are
      # instructions to make the thread INVISIBLE in a full-length view, and a
      # turnaround is a full-length view. The generator obeyed, nine times. This
      # is the chevron finding again in a different costume: the rule was working
      # exactly as written and the writing was wrong.
      #
      # THE NOTE THAT FIXED IT: "I NEED the green stitching, but it must be
      # subtle — or missing in some places, like it was important but it's been
      # let go."
      #
      # That converts an instruction-to-hide into a DESCRIBABLE POSITIVE FEATURE,
      # which is prompt-library rule 2. "Subtle" is a quality the generator has to
      # calibrate and will get wrong; "some rows still green, some faded, some
      # resewn in plain thread" is a thing it can draw. And it is better
      # storytelling than the original — a thread half worn away IS the man who
      # stopped maintaining it, which is exactly what P5 asks the colour to mean.
      # CONFIRMED REAL 2026-08-05: the Production Designer has seen the green on
      # the screen costume — "it IS there, it is VERY subtle, and I had to be
      # told myself." So the target is FINDABLE WHEN LOOKED FOR, not absent and
      # not announced. The old rules said "findable only in close-up", which in a
      # full-length view is an instruction to be invisible, and it was obeyed
      # eleven times. Measured on the eleventh: peak green bias 4.5 against 15-40
      # for a real green thread. There was none at all.
      #
      # The panels being APPLIED rather than quilted makes this easier, not
      # harder: the green is now the thread SEWING THE PANELS DOWN, which is
      # exactly what P5 asks of it — "the thread holding the chevron panels".
      #
      # WITHDRAWN FROM must_show 2026-08-05, BY THE PRODUCTION DESIGNER: "stop
      # chasing green threading."
      #
      # TWELVE GENERATIONS, NEVER ONCE ANY GREEN. Measured on the twelfth: mean
      # green bias 1.21, peak 2.5, against 15-40 for a real green thread. Not
      # faint — absent.
      #
      # AND THE GEOMETRY REFERENCE CANNOT FIX IT. That was an error in the scope
      # line as first written, which claimed the image was authoritative for "the
      # GREEN OF THE THREAD". It is a photograph of a BLACK garment and there is
      # no green anywhere in it. There was nothing in the picture to teach.
      #
      # THE HONEST READING IS THAT IT IS NOT A FULL-LENGTH-PLATE DETAIL. The
      # Production Designer's own description is "very subtle, and I had to be
      # told myself" — on a near-black costume at full figure a faded thread
      # would be invisible in a real photograph too. Eleven of the twelve
      # failures were the plate being asked for something a plate cannot hold.
      #
      # IT IS NOT DROPPED FROM THE DESIGN. It stays in `description:` above,
      # which is what the build is made from, it stays in Planted-Elements P5,
      # and it is specified on the two slots where the camera is close enough for
      # it to exist — 05-detail_portrait and 12-materials, in Prompts.md. That is
      # where to check it.
      # TIGHTENED 2026-08-05. The tenth front grew the undertunic a HIGH STANDING
      # MANDARIN COLLAR, which is a great deal more than "a dark edge". The rule
      # said what the undertunic shows and never said what it must NOT become, so
      # the collar had room to grow — prompt-library rule 3, name the failure
      # condition. A stand collar also drifts him toward the tunic-and-collar
      # silhouette rule 1 exists to refuse.
      - >
        UNDER THE TOP LAYER, THE UNDERTUNIC, AND IT CARRIES NO CHEVRONS. It shows
        ONLY as a NARROW DARK EDGE at the collar and cuff — a slightly finer,
        older weave. NO standing collar, NO mandarin collar, NO band collar and
        NOTHING that rises up the neck. It lies FLAT against the throat.
      # MOVED OUT OF must_show 2026-08-04. What the undertunic looks like with
      # the top layer OFF is invisible in all seven turnaround views and in every
      # costume slot — it is a fact about one scene, his bunk aboard the ship at
      # night. It cost ~290 characters of a budget this outfit is genuinely bound
      # by, and it was being cut on every run anyway.
      #
      # IT IS NOT DELETED AND IT IS NOT OPTIONAL. must_show is per-outfit, not
      # per-slot, so the place for it is the shot text of the slot that shows it
      # — see the note in Character-Build-Recipe.md, "pin: does not reach a slot
      # that takes no rules". WRITE IT INTO THAT SLOT IN Prompts.md:
      #
      #   Re-dyed dark, PATCHED SO MANY TIMES THE ORIGINAL FABRIC SURVIVES ONLY
      #   IN PANELS, with a CROSS-WRAPPED FRONT, a STANDING COLLAR and a SHAPED
      #   SHOULDER that no industrial workwear would have.
      # THE SHOULDER PAD WAS TRIED AND DROPPED, both on 2026-08-04. It came back
      # a hard structured pauldron standing off the shoulder — which is what a
      # shoulder piece wants to be, and why Planted-Elements P5 rejected the idea
      # twice before. The third attempt failed the same way, so the rejection
      # stands rather than being argued with again.
      #
      # An homage to Captain Jasu's pads was considered and refused on 2026-08-04
      # for a different reason: Faction.md rejects "no uniform, no insignia, no
      # matching anything — if two members look like they were dressed by the
      # same person, it is wrong", and Crew-Roster stages Jasu and Baylan as the
      # two people who CANNOT be one of the crew, apart by rank and by secret.
      # A shared shoulder makes them a pair.
      #
      # The want behind it was "make him look bigger", and the quilted panel does
      # that instead — padding across the chest and shoulders, at no cost in
      # ornament or rank.
      # THE BUCKLE MOVED TO THE BACK, 2026-08-05, by the Production Designer.
      #
      # The twelfth front returned a BRIGHT POLISHED CHROME buckle sitting dead
      # centre — the brightest object on a man whose entire design is not being
      # looked at, and the same failure the gauntlets had when they came back
      # chrome. The finish clause sat third in this rule, exactly where the
      # gauntlet finish clause was when it kept losing.
      #
      # MOVING IT IS BETTER THAN SHOUTING AT IT. A buckle at the back cannot be
      # bright in a front view because it is not in the frame, and the front
      # becomes an unbroken band of worn leather — which is plainer than anything
      # a rule could have negotiated. It removes the object rather than
      # describing it away, and it is one less thing for every future generation
      # to get wrong.
      #
      # IT IS STILL VISIBLE IN THE BACK TURNAROUND, where the rule below governs
      # it, and the holster on his right hip is unaffected.
      - check: Belt front is UNBROKEN LEATHER — no buckle, it fastens at the back.
        text: >
          A WIDE, HEAVY BELT, AND IT IS DOING A JOB. Broad salvaged leather,
          thick, darkened and cracked from years of use. IT FASTENS AT THE BACK,
          so from the front it is an UNBROKEN BAND OF LEATHER — NO buckle, NO
          clasp, NO fitting and NOTHING bright anywhere on it. It is what the
          holster hangs from. If it reads as decorative or as armour, it is wrong.
      # ADDED 2026-08-04 by the Production Designer. A fauld — overlapping metal
      # plates at the hips, hung from the belt.
      #
      # THIS IS THE RISKIEST THING ON HIM AND THE RULES BELOW ARE WHY. It was
      # chosen over hanging strips and cloth panels knowing that of the four
      # shapes considered it is the one most likely to read as armour, and armour
      # reads as status, and status is what he has spent eighteen years hiding.
      # So it gets the same treatment the gauntlets got: it is given a job, and
      # it is filthy.
      #
      # IT IS NOT A PLANT. The 501st CRL for the later costume has shoulder bells
      # and gauntlets and no fauld, so nothing about this carries forward. It is
      # this film's own, and Planted-Elements P5 should not grow a row for it.
      # THE FAULD WAS TRIED AND SUPERSEDED, both on 2026-08-04. Overlapping metal
      # plates hung at the hips generated well and were still not the shape the
      # Production Designer was after. What he wants is a TUNIC SKIRT — the lower
      # half of the top layer continuing to the knee, split at the sides. The
      # reference given was a Jedi robe set, for its skirt only.
      #
      # THAT REFERENCE IS THE MOST DANGEROUS ONE THIS CHARACTER HAS BEEN GIVEN,
      # and the rules below are the whole reason it is safe. `do_not_retrieve`
      # rejects "ceremonial drape or layered tabards" by name and rule 1 says an
      # image that announces him as a Jedi has failed.
      #
      # BUT THE SKIRT SHAPE IS NOT WHAT MAKES THAT COSTUME READ AS JEDI. Five
      # other things do: the cream and sand palette, the hood, the wide monastic
      # sleeves, the crossed wrap front, and the obi sash. A knee-length split
      # tunic over trousers, in near-black, with fitted sleeves and a broad
      # salvaged belt, is Norse workwear and reads as nothing else. He already
      # fails all five Jedi signals, so the shape can be had safely — and the
      # next rule names them so it stays that way.
      - check: Skirt to just above the knee, SPLIT both sides. Same cloth, near-black.
        text: >
          THE TOP LAYER RUNS ON INTO A SKIRT TO JUST ABOVE THE KNEE. Below the
          belt it continues as a straight panel of the SAME CLOTH, front and
          back, SPLIT at both sides from hip to hem so his legs are clear and he
          can work in it. Heavy, plain, near-black, and hanging straight.
      - >
        THE SKIRT IS PART OF THE TOP LAYER, NOT A SEPARATE HANGING PIECE. It is
        one garment cut long, and the chevron panel on the chest stops well above
        the belt and never runs down into it. No overlapping plates, no leather
        strips, no fauld and no apron.
      - check: NO cream, NO hood, NO wide sleeves, NO wrap front, NO sash.
        text: >
          THE SKIRT MUST NOT TURN HIM INTO A JEDI, AND FIVE THINGS WOULD DO IT.
          NO cream, sand or pale brown — it is near-black like the rest of him.
          NO hood and NO cowl. NO wide or draped sleeves; his are fitted to the
          wrist. NO crossed or wrapped front; the chevron panel is his front. NO
          sash or obi; his belt is broad salvaged leather, fastened at the back.
      - >
        THE SKIRT NEVER BLOCKS THE DRAW. The holster on his RIGHT hip and the
        pouches on his LEFT hang OVER it through the side splits, clear and
        unobstructed. If the holster is buried in cloth or the grip is hard to
        reach, the image is wrong.
      # CHANGED 2026-08-04 by the Production Designer. These were leather wraps.
      # The gauntlets are already 3D PRINTED, and the later costume's are metal —
      # so the plant recorded in Planted-Elements P5 ("the bracers, a shape that
      # carries forward without meaning anything yet") is now carried by the real
      # object rather than by a leather ancestor of it.
      #
      # P5's rule still governs and is the whole difficulty: "nothing here may
      # look deliberate. Every one of these is a working object doing a job in
      # this film." A metal gauntlet reads as armour unless it is given a job, so
      # the next rule gives it one.
      # The finish clause sat third in this rule and was ignored: they came back
      # POLISHED CHROME, the brightest thing in the frame, on a man whose palette
      # rule is near-black. It now leads, because the shape was never the problem.
      - check: Gauntlets DULL and filthy — no shine, no chrome, no highlights.
        text: >
          THE GAUNTLETS ARE FILTHY AND DEAD DULL — NO shine, NO chrome, NO
          polish, NO bright highlights and NOTHING mirror-like. Scratched, dented
          and greasy, the finish worn off at every edge, darkened almost to the
          colour of the cloth. They are the oldest-looking thing he owns.
      # REWRITTEN TO MATCH THE BUILD, 2026-08-05. The printed pair arrived and
      # the repo rule applies: for anything physically built the photograph wins,
      # so the words move, not the object. See
      # reference/props/gauntlets-build-2026-08-05.jpg.
      #
      # WAS "a smooth clamshell shell closing with no visible fastening". The
      # build is neither smooth nor a clamshell — a one-piece open-backed cuff
      # that slips on, with four or five heavy stepped ribs around the lower
      # half. The ribs are an improvement on the spec, not a compromise: they
      # give a near-black object something to catch a highlight on, which is how
      # it stays readable against near-black cloth without being made shiny.
      - >
        METAL GAUNTLETS ON BOTH FOREARMS, A MATCHED PAIR — wrist to
        three-quarters up the forearm. A ONE-PIECE OPEN-BACKED CUFF that slips
        on, with NO strap, buckle or fastening. FOUR OR FIVE HEAVY STEPPED RIBS
        wrap the lower half.
      # THE SCREEN POSITION MOVED TO THE OUTER FOREARM, 2026-08-05, to match the
      # build. It was "the inside of each wrist".
      #
      # THE SCREEN STAYS SMALL, DARK AND DEAD, and that is NOT a contradiction of
      # the build. The bright near-white panel in the photograph is a FAKE — the
      # Production Designer's stand-in for a small digital display, unpainted at
      # the time of the photograph. The design has always been a dark dead
      # screen and still is. The reference carries a caveat saying so, because
      # attached without one it is an instruction to make it glow.
      #
      # OPEN, AND NOT A BAYLAN DECISION: the Production Designer is considering
      # PRACTICAL LIGHTS ON EVERY GAUNTLET IN THE CREW. That is a faction-wide
      # change — see 11-production-tracking/Open-Questions.md. If it happens,
      # "nothing lit on it" is what gives way, and it gives way for all of them
      # at once, which is the only version that does not single Baylan out.
      # The first draft of this rewrite put the dark-screen clause THIRD and the
      # regen dropped it on the spot — the rule that had just been written to
      # stop the screen glowing was losing the sentence that said so. Rule 5b of
      # the prompt library, demonstrated on itself within one minute. It leads
      # now.
      # AMBER REFUSED BY NAME, 2026-08-05. The thirteenth front returned a dim
      # WARM rectangle in the screen recess — not a glow, but not the dead dark
      # screen either. The rule refused white, pale and glowing and said nothing
      # about warm, so the one colour it did not name is the one that arrived.
      # Refuse the CATEGORY, not the instance — Baylan lesson 1, third outing.
      #
      # THIS IS A PLANT BEING SPENT EARLY, WHICH IS WHY IT IS WORTH A CLAUSE. The
      # later bracers carry a working AMBER readout; his is dead now and lit
      # then, and that is the same pattern as the green thread — the things he
      # lets die are the things he restores. An amber glimmer here gives away
      # eighteen years for nothing.
      - >
        THE GAUNTLETS ARE TOOLS, NOT ARMOUR, AND THEIR SCREEN IS DARK AND DEAD —
        the same near-black as the metal round it. NOTHING LIT and NO COLOUR IN
        IT: never white, never pale, NEVER amber, orange, warm or gold. A small
        screen and worn buttons sit on the OUTER FOREARM above the ribs. NOTHING
        about them is remarkable.
      - >
        A THIN CORD AROUND HIS NECK, disappearing under the shirt. A small worn
        leather pouch hangs on it against the skin, older and more repaired than
        anything else he owns, and it is not visible with the jacket on. No
        pendant, no charm, no jewellery of any kind at his throat.
      # REWRITTEN 2026-08-04. "Heavy through the chest and waist. He carries
      # weight." came back obese and short-looking. The words were an invitation
      # and there was no photograph to argue with them; there is now, so the rule
      # points at it instead of piling up adjectives.
      - check: Build MATCHES the full-body photo. Big and solid, NOT obese.
        text: >
          BUILD: MATCH THE FULL-BODY PHOTOGRAPH. Big, solid and thickened —
          broad through the chest and shoulders, softened at the waist. NOT
          obese, NOT a caricature, NOT muscular and NOT lean. HE IS 198 cm AND
          THE HEIGHT MUST READ: long in the leg and long in the arm, a tall man
          who has thickened, never a short wide one.
      - >
        LATE FORTIES — FORTY-EIGHT. NOTHING may suggest he could still fight —
        no fighter's stance, no coiled readiness, no combat posture.
      - >
        SHORT, BADLY SELF-CUT HAIR — uneven, no shape, cut by his own hand
        without a mirror. Full UNSHAPED beard, untrimmed. Deep lines from years
        of not sleeping. He is nobody and he looks it.
      # DARKENED 2026-08-04. Three generations came back mid-brown and dusty.
      # The range moves down; the separation rule stays, because it is the reason
      # "never black-on-black" was written in the first place.
      - check: DARK — near-black charcoal, soot brown. Not mid-brown, not dusty.
        text: >
          DARK, AND MUCH DARKER THAN DUSTY MID-BROWN. Near-black charcoal, soot
          brown, cold slate, the last of a faded olive. NEVER black-on-black
          though: he must still SEPARATE from a night forest and from camp
          firelight. Everything repaired, resoled, re-shouldered, previously
          owned.

    # THE PRINTED BLASTER, supplied by the Production Designer 2026-08-05, and
