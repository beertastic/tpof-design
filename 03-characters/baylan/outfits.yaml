    slot_references:
      blaster:
        - path: reference/props/blaster-build-2026-08-05.jpg
          what: >-
            THE BLASTER — SHAPE ONLY, NEVER ITS COLOUR OR FINISH.
            The printed build: 340 mm long and 105 mm tall, front-heavy and unbalanced, the
            saber emitter shroud still serving as the muzzle, the ribbed hilt
            body lying horizontal as the receiver, a second ribbed hilt section
            hung below as the magazine.
            NOT AN AUTHORITY ON FINISH OR COLOUR — it is UNPAINTED BARE GREY
            PLASTIC and the weapon is MATTE, DARK, SCRATCHED AND FILTHY, with
            eighteen years of handling on it. NOTHING on it is shiny, bright or
            clean. THE WRITTEN RULE WINS ON FINISH.
      utility:
        - path: reference/props/blaster-build-2026-08-05.jpg
          what: >-
            THE BLASTER — SHAPE ONLY, NEVER ITS COLOUR OR FINISH.
            The same object laid out with the rest of the kit: 340 mm long,
            and the largest thing in the layout.
            NOT AN AUTHORITY ON FINISH — unpainted bare grey print; the weapon
