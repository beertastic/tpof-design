  # HE HAS ONE COSTUME. THIS IS THAT COSTUME WITH ONE MORE GARMENT ON TOP.
  # Confirmed by the production designer 2026-08-04, and it is a correction:
  # this was modelled as a full second outfit and generated TEN turnarounds,
  # where the costume department builds one costume and one coat.
  #
  # Added 2026-08-01 for a real reason that still holds — the coat hides the
  # harness, the belt and the holster, so the base five have to record the
  # costume without it, and half the film is spent with it on. What was wrong
  # was the SIZE of the answer, not the answer.
  #
  # TWO VIEWS, NOT FIVE. `left`, `right` and `back` of the coat set would
  # re-photograph a costume the base five already record — three generations and
  # three more chances to drift, for a garment that is one item. `front` shows
  # the chevron plastron framed by the open coat, which is the point of the
  # view, and `natural` shows how it hangs and moves.
  #
  # IT IS NOT SEPARATELY APPROVED. The approved `working` front is the one
  # costume reference for this character — see the rule in APPROVAL.md that
  # there is never more than one. These views MATCH it and add a coat.
  #
  # FOR THE BUILD, THE COAT IS ONE COMPONENT in one `components:` list on the
  # `working` outfit, not a second costume to source.
  - id: working-coat
    name: Working dress with the long coat
    scenes: "Off duty, at the fire, in the bunk, on cold nights — 3, 5, 14, 19, 23, 25"
    views: [front, natural]
    # Overrides the file-level block, which tells the generator the coat is not
    # worn. Here it is the subject.
    do_not_retrieve_short: >
      You are thinking of the austere silver-haired Jedi in flowing black robes
      with a hood up and an orange lightsaber. THAT MAN IS EIGHTEEN YEARS IN HIS
      FUTURE — reject his BEARING and his SILHOUETTE: no hood up, no monastic
      sleeves, no ceremonial drape, no visible hilt, no gravitas, no silver mane.
      He IS wearing his long dark coat here, and it is a heavy old working coat.
    description: >
      Exactly the working dress recorded in the other five views, with his long
      coat on over it. The coat is weathered black or very near it, heavy, falling
      below the knee, and WORN OPEN — it hangs from the shoulders and frames the
      body rather than closing over it. Ordinary set-in sleeves, close to the arm.
      Repaired tears, scorching down one side only, and a burn that was never
      properly patched. Beneath it, in the gap between its front edges, the
      chevron plastron is plainly visible from throat to belt, and the belt,
      holster and harness stay readable. It is the oldest and most comfortable
      thing he owns and it reads as weather gear any freighter crew would have.
      Nothing about it is ceremonial, and nothing about it is new.
    must_show:
      - >
        HE READS AS A MERCENARY, NEVER AS A JEDI, AND THIS IS THE VIEW WHERE THAT
        IS HARDEST. The coat is the one garment that could betray him, so the
        silhouette is the whole test: NO HOOD UP — the hood is down or there is no
        hood at all. NO wide monastic sleeves. NO ceremonial drape, NO layered
        tabards, NO wrapped front, NO sash, NO cowl. NO visible lightsaber or
        hilt. He is a cold man in an old coat. If the silhouette reads as a Jedi,
        or as a robed figure of any kind, the image has FAILED.
      - >
        THE COAT IS WORN OPEN AND HANGS STRAIGHT. It is not fastened, not belted
        over, not wrapped across the body. It falls from the shoulders below the
        knee, and the working costume underneath stays visible down the whole
        centre front. Weathered black, heavy, battered. SCORCHING ALONG ONE SIDE
        ONLY — never symmetrical damage — plus repaired tears and one burn that
        was never patched.
      - >
        THE BROAD CHEST PLASTRON, AND THE OPEN COAT MUST NOT COVER IT — showing
        that panel is the point of this view and the coat only frames it. A LARGE
        PLAIN YOKE fills its top half and ends in one wide V; below it THREE TO
        FIVE broad chevron bands, EACH A "V" WITH ITS POINT LOW AT THE CENTRE AND
        ITS ENDS HIGH AT THE SIDES — never an upward peak — at a shallow angle of
        about 30° below horizontal, filling the panel to below the belt. The
        bands are SEPARATE PANELS LAID ON and overlapping like layered plates,
        each with a RAISED PIPED EDGE that casts a real shadow, sewn down in
        coarse greyed-off green thread. Suede against matte canvas: they read by
        SHEEN, not colour, and everything stays the same near-black. NOT
        quilting, NOT printed, NOT a badge.
      - >
        THE CHEVRON STITCHING IS A DARK GREYED-OFF GREEN that MUST read as dark
        thread at this distance and NOTHING else. It is the only colour on him,
        and nothing else on the costume or the coat is green — no panel, no
        cloth, no leather, no trim, no piping.
      # ADDED 2026-08-04. The base five gained a knee-length split skirt and metal
      # gauntlets and this outfit was never told. Its own description says
      # "exactly the working dress ... with his long coat on over it", which is
      # true and is exactly why the omission was invisible: the sentence is
      # correct and carries none of the detail.
      # THE COAT'S OWN RULE ALREADY ALLOWED THIS: "NO HOOD UP — the hood is down
      # or there is no hood at all." A hood worn DOWN was never forbidden, it was
      # simply never specified, so no generation ever drew one. It is the hood UP
      # that reads as monastic, and it is still refused.
      - check: Hood DOWN at the back of the neck. NEVER up, never over the head.
        text: >
          THE COAT HAS A HOOD AND IT IS ALWAYS DOWN — folded soft at the back of
          the neck, sitting over the collar and the tops of the shoulders,
          reading as a heap of worn cloth. NEVER up, NEVER over his head, NEVER
          drawn forward, and NEVER a cowl. Down it is weather gear; up it is the
          man he becomes in eighteen years, and this film is not that film.
      - check: Skirt to the knee below the coat. Metal gauntlets, dull and filthy.
        text: >
          UNDER THE COAT HE IS IN THE FULL WORKING DRESS. The top layer runs on
          into a SKIRT TO JUST ABOVE THE KNEE, split at both sides, same
          near-black cloth, hanging straight and visible below the coat's front
          edges. NO cream, NO wrap front, NO sash.
      - >
        METAL GAUNTLETS ON BOTH FOREARMS, wrist to three-quarters up the arm — a
        one-piece open-backed cuff, ribbed round the lower half, with a small
        DARK DEAD screen on the OUTER FOREARM. NOTHING LIT ON IT, never white or
        pale. FILTHY AND DEAD DULL — no shine, no chrome, no polish, nothing
        mirror-like. They are visible below the coat's sleeves.
      - >
        BLASTER ON HIS RIGHT HIP, STILL VISIBLE. He is RIGHT-HANDED. Nothing is
        hidden by the open coat. The belt, the holster and the harness must all
        stay readable — a costume supervisor checks them in this view too.
        The weapon is UGLY
        and HEAVILY MODIFIED, assembled from mismatched parts, the least elegant
        thing in the film. NEVER his left.
      - >
        ABSOLUTELY NO ORNAMENT, on the coat or under it. No trophies, no faction
        colours, no insignia, no patches, no badges, no beads, no jewellery, no
        clasp, no chain at the throat. THIS IS THE CHARACTERISATION: he works in a
        crew that decorates itself and his plainness is the only odd thing about
        him. Do not add a fastening or a flourish to make the coat more
        interesting — the absence IS the design.
      - check: Build MATCHES the full-body photo. Big and solid, NOT obese.
        text: >
          BUILD: MATCH THE FULL-BODY PHOTOGRAPH. Big, solid and thickened, broad
          through the chest and shoulders and softened at the waist. NOT obese,
          NOT a caricature, NOT muscular and NOT lean. HE IS 198 cm AND THE
          HEIGHT MUST READ. The coat must NOT give him stature, authority or
          command presence — it is a big man's old coat, not a mantle.
      - >
        LATE FORTIES — FORTY-EIGHT. NOTHING may suggest he could still fight.
        SHORT, BADLY SELF-CUT HAIR, uneven, cut by his own hand without a mirror.
        Full UNSHAPED beard, untrimmed. He is nobody and he looks it.
      - check: DARK — near-black. Coat still darker than the costume beneath.
        text: >
          DARK, AND MUCH DARKER THAN DUSTY MID-BROWN — near-black charcoal, soot
          brown, cold slate, the last of a faded olive. The coat is the darkest
          thing on him and the costume beneath must STILL separate from it, and
          he must still separate from a night forest and from camp firelight.
          NEVER black-on-black, and never sunk into the background.
