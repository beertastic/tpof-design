      maintenance:
        - path: reference/props/blaster-build-2026-08-05.jpg
          what: >-
            THE BLASTER — SHAPE ONLY, NEVER ITS COLOUR OR FINISH.
            Every part in this photograph must be findable in the
            reassembling hilt: the emitter
            shroud, the ribbed body, the magazine section, the machined
            cylindrical core. SAME OBJECT, DIFFERENT ARRANGEMENT.
            NOT AN AUTHORITY ON FINISH — unpainted bare grey print; the parts
