character: Baylan
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# 198 cm. The tallest human in the film — only Merc 1, the Wookiee, is bigger.
height: 198 cm (6 ft 6 in) — very tall, and broad and thickened with it. He fills a doorway and has to stoop under branches

# A two-sentence version of do_not_retrieve, for the short prompts. The long
# one does not survive being trimmed — it cuts mid-list and loses the clause
# that says the coat IS his.
do_not_retrieve_short: >
  You are thinking of the austere silver-haired Jedi in flowing black robes with
  a hood up and an orange lightsaber. THAT MAN IS EIGHTEEN YEARS IN HIS FUTURE —
  reject his BEARING and his SILHOUETTE: no hood up, no monastic sleeves, no
  ceremonial drape, no visible hilt, no gravitas, no silver mane.
  He DOES own a long dark coat and it is his, but it is not worn in these views.

# THE NAME RETRIEVES. Added 2026-08-01 after a generation returned him in black
# Jedi robes with a lightsaber, captioned "he now serves The Order, a mysterious
# organisation" — the other production's backstory, invented wholesale.
do_not_retrieve: >
  THE DISTINCTION HERE IS PRECISE, SO READ IT CAREFULLY. You are thinking of a
  tall, austere, silver-haired Jedi with a hood up, wide monastic sleeves, a
  ceremonial drape and an orange lightsaber, serving a mysterious order. THAT MAN
  IS EIGHTEEN YEARS IN HIS FUTURE. What you must not draw is his BEARING and his
  SILHOUETTE, not his wardrobe.

  REJECT ABSOLUTELY: the hood up. Wide monastic sleeves. Ceremonial drape or
  layered tabards. Any visible lightsaber or hilt. Authority, gravitas, command
  presence, a distinguished silver mane, a groomed beard. Anything that reads as
  a Knight of anything. He has spent eighteen years making himself boring on
  purpose and it must show in how he stands.

  DELIBERATELY KEPT, because this film is the origin of that costume: he owns a
  LONG DARK COAT and it is his. Worn OPEN, falling below the knee, weathered
  black, battered, repaired, scorched down one side. It reads as heavy weather
  gear of the sort any mercenary owns — and only in hindsight as the ancestor of
  the garment he wears later. That double read is the point. See the costume
  echoes in 02-story/Planted-Elements.md.

  He is not distinguished. He is not commanding. Nobody around him knows what he
  was. His hair is iron-grey, short and badly cut by his own hand without a
  mirror. If your image would pass as the later character rather than as the man
  he was BEFORE, it is wrong.

outfits:
  - id: working
    name: Working dress
    scenes: "All of them — 3, 5, 7, 9, 12, 13, 14, 15, 19, 20, 23, 25. His only costume"
    description: >
      Salvaged, repaired mercenary workwear that has genuinely worked. A heavy
      work shirt, layered technical cloth and worn synth-leather over it, and a
      padded jacket that has been re-shouldered at least once. A functional
      harness across the chest carrying ammunition pouches and field tools —
      no trophies, no personal marks, no decoration of any kind. At his waist a
      wide, heavy salvaged belt with a plain buckle, and hanging from it on his
      right hip a holster holding an ugly, heavily modified blaster pistol. Worn
      leather wraps on both forearms, wrist to below the elbow. Heavy boots,
      resoled. Everything muted: charcoal, ash brown, dust brown, faded olive.
      Down the centre front of the top layer, a panel narrower than his
      shoulders, running from the throat to under the belt: a plain rounded area
      at the top, then five broad nested chevrons, apex down, filling it to the
      waist — raised suede-like bands sitting proud of the weave, tonal and dark
      on dark, each edge stitched. The harness crosses over it. The undertunic beneath shows only as a dark
      edge at the collar and cuff. A thin cord runs around his neck and
      disappears under the shirt.
      Nothing about this costume is decorative, chosen for looks, or new.
    must_show:
      - >
        HE READS AS A MERCENARY, NEVER AS A JEDI. This is the core rule and
        everything else serves it. An audience must be able to watch him for half
        the film without suspecting. No hood, no cowl, no monastic sleeve, no
        ceremonial drape, NO LIGHTSABER HILT anywhere on his belt or body. If the
        image announces him as a Jedi, it has failed.
      - >
        ABSOLUTELY NO ORNAMENT. No trophies, no faction colours, no insignia, no
        patches, no badges, no beads, no jewellery, no personal marks of any kind.
        THIS IS THE CHARACTERISATION: he works in a crew that decorates itself and
        his plainness is the only odd thing about him. Every other mercenary is
        marked; he is not. Do not add a single decorative element to make the
        costume more interesting — the absence IS the design.
      - >
        BLASTER ON HIS RIGHT HIP. He is RIGHT-HANDED. The holster is on his right
        hip, belt-mounted, grip up and angled slightly forward for a right-hand
        draw. NEVER his left. The weapon in it is UGLY and HEAVILY MODIFIED — a
        scratch-built, unbalanced-looking pistol assembled from mismatched parts,
        not a clean factory sidearm. It is the least elegant thing in the film.
        WHEN THE HEAVY RIFLE IS CARRIED it is slung to fall to his RIGHT hand —
        muzzle down, strap over his left shoulder crossing to his right hip, so
        the sling never sits under his drawing arm. The rifle is battered,
        reliable and boring. Ammunition pouches and field tools sit on his LEFT,
        on the off side, where they cannot foul the draw.
      - >
        THE ROBE IS A SEPARATE REMOVABLE GARMENT AND IT IS A HEAVY OLD WORKING
        COAT, NOT JEDI DRESS. IT IS NOT WORN IN THESE FIVE VIEWS — they record
        the base costume, and a long coat over the top hides the harness, the
        belt and the holster. It has its own turnaround set, `working-coat`, and
        its own narrative plate at slot 13. He wears it off duty, at the fire and
        in the cold, and takes it off to work. It must be BUILT AS ITS OWN PIECE: long,
        weathered black or very near it, falling below the knee, worn OPEN.
        Repaired tears, SCORCHING ALONG ONE SIDE ONLY — never symmetrical damage
        — and a burn that was never properly patched. NO wide monastic sleeves —
        the sleeves are ordinary, set-in and close to the arm. NO ceremonial
        drape, NO layered tabards, NO wrapped front, NO sash, NO cowl. THE HOOD IS
        DOWN or there is no hood at all. It is weather gear worn by a cold man,
        the sort of coat any freighter crew would own. It is visibly the oldest
        and most comfortable thing he owns. If the silhouette reads as a Jedi, the
        image has failed.
      # Moved out to the top layer on 2026-08-01. These used to live on the
      # undertunic, seen only when the jacket came off in his bunk — which meant
      # the one shape he is remembered for later appeared in two night scenes and
      # nowhere else. It is his silhouette; it has to be on him.
      # The first sentence is the only one the short prompts are guaranteed to
      # keep, so the geometry lives there and nowhere else. The stitching is a
      # separate rule below for the same reason — sharing this one, it was
      # trimmed away entirely.
      - >
        FIVE BROAD NESTED CHEVRONS, APEX DOWN, THROAT TO BELT, ON A PANEL
        NARROWER THAN HIS SHOULDERS.
        NEVER a flat graphic across the chest, and NEVER shoulder to shoulder.
        GET THE GEOMETRY EXACTLY RIGHT; IT IS THE ONE SHAPE HE IS
        REMEMBERED FOR AND IT HAS BEEN DRAWN WRONG BEFORE.
        SHAPE AND EXTENT: a single panel down the CENTRE FRONT of the torso,
        covering chest and belly and running DOWN UNDER THE BELT. It is bounded
        by a stitched edge that starts at the base of the throat, curves out and
        down over each side of the chest, and continues to the waist. IT IS
        NARROWER THAN HIS SHOULDERS — it does NOT reach the shoulder seams, the
        armholes or the arms, and there is plain garment either side of it.
        AT THE TOP, above the first chevron, a PLAIN ROUNDED AREA rising to a
        blunt point just below the throat. No chevron crosses it.
        BELOW THAT, FIVE NESTED CHEVRONS, APEX DOWN, stacked one beneath the next
        and filling the panel from the top of the chest to the belt. Each is a
        BROAD BAND ROUGHLY A HAND'S WIDTH — not a thin stripe, not a painted
        line. The bands TOUCH: no cloth shows between them, because the panel is
        MADE of them. The angle is SHALLOW, about 30° below horizontal, so each V
        is wide and open, never steep.
        MATERIAL: mottled, distressed, waxed suede-like leather appliquéd onto
        the woven base and sitting PROUD of it, so every band throws a shadow
        edge. TONAL, DARK ON DARK: texture and relief, NEVER colour contrast,
        NEVER a stripe, NEVER a badge. If it reads as printed, painted or
        abraded onto the cloth rather than built from separate pieces, it is
        WRONG.
        IT MUST BE PLAINLY VISIBLE IN EVERY VIEW — never hidden, never under
        another garment. Worn open, the long coat frames it rather than covering
        it: the panel is exactly what shows in the gap between the coat's front
        edges.
        The chest harness crosses OVER it and breaks the run of the bands in
        places. That is correct — they read through and around it, and they are
        not moved or shrunk to make room for it.
      - >
        EVERY CHEVRON EDGE IS STITCHED, AND THE THREAD IS A DARK GREYED-OFF
        GREEN — coarse, hand-worked, standing proud of the leather. AT NORMAL
        DISTANCE IT MUST READ AS DARK THREAD AND NOTHING ELSE.
        It is the stitching that makes the panel legible at distance, and it must
        be drawn on every band edge. The green is the colour of old moss or
        weathered bronze. It is only findable
        in close-up, and it is the single point of colour on him. Nothing else on
        this costume is green: no panel, no cloth, no leather, no trim, no piping.
        It is CONSTRUCTION, NOT DECORATION. This does not contradict the no-ornament
        rule: the chevrons are how the garment is built, not something added to it,
        and he does not think about them.
      - >
        UNDER THE TOP LAYER, THE UNDERTUNIC. It shows ONLY as a dark edge at the
        collar and at the cuff — a slightly finer, older weave than the garment
        over it. WHEN THE TOP LAYER AND HARNESS COME OFF (his bunk aboard the
        ship, at night) it is clearly visible: re-dyed dark, PATCHED SO MANY TIMES
        THE ORIGINAL FABRIC SURVIVES ONLY IN PANELS, with a CROSS-WRAPPED FRONT, a
        STANDING COLLAR and a SHAPED SHOULDER that no industrial workwear would
        have. It carries no chevrons — those are on the layer above it.
      - >
        A WIDE, HEAVY BELT AND WORN FOREARM WRAPS. Both are working kit and must
        read as nothing else — this is the man with no ornament on him.
        THE BELT: broad salvaged leather, thick, a plain heavy buckle with no
        decoration on it, darkened and cracked from years of use. It is what the
        holster hangs from and it is doing a job.
        THE FOREARM WRAPS: worn leather, strapped or laced, covering the forearm
        from wrist to below the elbow. ON BOTH ARMS — unlike some in this crew he
        wears a matched pair, because they are protection for a man who hauls
        cargo and crates all day, not scavenged trophies.
        Neither is a flourish. If either reads as decorative or as armour, it is
        wrong. Both are here because he needs them, and both quietly become
        something he still wears eighteen years later.
      - >
        A THIN CORD AROUND HIS NECK, disappearing under the shirt. A small worn
        leather pouch hangs on it against the skin, older and more repaired than
        anything else he owns, and it is not visible with the jacket on. No
        pendant, no charm, no jewellery of any kind at his throat.
      - >
        LATE FORTIES — FORTY-EIGHT. Not a young man and not an old one. TALL AND
        BROAD AND THICKENED. Heavy through the chest and waist, not
        muscular, not lean, not athletic. He carries weight. NOTHING may suggest
        he could still fight — no fighter's stance, no coiled readiness, no combat
        posture. SHORT, BADLY SELF-CUT HAIR — uneven, no shape, cut by his own
        hand without a mirror. Full UNSHAPED beard, untrimmed. Deep lines from
        years of not sleeping. He is nobody and he looks it.
      - >
        MUTED BUT NEVER BLACK-ON-BLACK. Charcoal, ash brown, dust brown, faded
        olive. Everything repaired, resoled, re-shouldered, previously owned.
        He must still SEPARATE from a night forest and from camp firelight —
        do not sink him into the background.

  # Added 2026-08-01. The base five record what the costume department builds;
  # these five record what the audience actually sees him in for half the film.
  # The coat was excluded from the turnarounds because it hides the harness, the
  # belt and the holster — which is true, and is why this is a SECOND set rather
