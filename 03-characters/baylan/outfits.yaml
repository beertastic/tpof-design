character: Baylan
ratio: "2:3"

# Costume turnarounds — the primary deliverable.
# Five images per outfit: front, left, right, back, natural.
# See 09-prompt-library/Turnaround-Block.md

outfits:
  - id: working
    name: Working dress
    scenes: "2, 3, 7, 9, 19, 20 — his default, and what he is in for most of the film"
    description: >
      Salvaged, repaired mercenary workwear that has genuinely worked. A heavy
      work shirt, layered technical cloth and worn synth-leather over it, and a
      padded jacket that has been re-shouldered at least once. A functional
      harness across the chest carrying ammunition pouches and field tools —
      no trophies, no personal marks, no decoration of any kind. A holster on the
      hip holding an ugly, heavily modified blaster pistol. Heavy boots,
      resoled. Everything muted: charcoal, ash brown, dust brown, faded olive.
      The undertunic is visible only as a dark edge at the collar and cuff. A
      thin cord runs around his neck and disappears under the shirt.
      Nothing about this costume is decorative, chosen for looks, or new.

  - id: robe
    name: Working dress with robe
    scenes: "5, 10, 13 — off duty, at the fire, in the cold"
    description: >
      The same working dress, with a long, heavy, dark robe over it — weathered
      black or near it, falling below the knee, worn open. The robe has been
      through at least one real fight: repaired tears, scorching along one side,
      a burn that was never properly patched. It must read as an ordinary heavy
      weather cape or working coat and never as Jedi dress — no wide monastic
      sleeves, no ceremonial drape, no cowl, hood down. It is visibly the oldest
      and most comfortable thing he owns. The harness, holster and boots remain
      as in the working dress.

  - id: shirtsleeves
    name: Shirtsleeves
    scenes: "13, 15 — inside the tent, the only place he is unguarded"
    description: >
      Jacket, harness and holster removed. He is in the heavy work shirt, open
      at the collar, sleeves pushed up his forearms, and heavy work trousers with
      the boots still on. Beneath the shirt, at the collar and where the sleeves
      are rolled, the patched dark undertunic is clearly visible — an older,
      finer weave than anything over it, with a cross-wrapped front and a shaped
      shoulder that no industrial workwear would have, patched so many times the
      original fabric survives only in panels. A thin cord runs around his neck
      and disappears into the shirt. This is the least he is ever seen wearing.

  - id: jedi
    name: Jedi Knight robes
    scenes: "12 only — the vision, eighteen years earlier. A separate build"
    description: >
      Full Jedi Knight robes as of eighteen years before the film: a layered
      tunic, tabards over it, a wide obi at the waist, and a heavy over-robe.
      Campaign boots. Worn, travelled and field-dirty — this is a man fighting a
      war, not attending a council. Sand in the seams, sun-bleaching across the
      shoulders, dust to the knee. Natural undyed and earth-toned cloth. He is
      eighteen years younger here: less grey, less heavy, standing straighter,
      but recognisably the same man. This is the only costume in which he
      carries himself like someone who belongs somewhere.
