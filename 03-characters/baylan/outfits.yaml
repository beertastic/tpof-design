character: Baylan
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# RAISED FROM THE 8,000 DEFAULT, 2026-08-04. See the note in short.py: 8,000 was
# chosen to match Shada's approved plates, and Baylan has none — so the ceiling
# was costing him a fifth of his specification for somebody else's consistency.
# His costume is genuinely large: 24 rules and ~6,100 characters, against her
# 23,807 which no budget could ever carry.
# 11,000 after the hip plates were added 2026-08-04. Still inside the
# 7,000-12,000 working target recorded on BUDGET in short.py, and well under the
# ~15,000 where the host starts compressing earlier context.
# 11,400 from 2026-08-05, and this one was MEASURED rather than guessed. The day
# added the gauntlet rewrite, the belt relationship and the green-thread rules,
# and the cap is violently non-linear at this point:
#
#     11,000 -> cap 288, 90%      11,400 -> cap 345, 96%
#     11,200 -> cap 312, 93%      11,600 -> cap 406, 98%
#
# At 11,000 the file was dropping the RIFLE SLING clause — muzzle down, strap
# over the left shoulder to the right hip — which is exactly the placement fact
# `handedness:` exists to fix. 400 characters buys it back and six points of
# coverage with it.
#
# Restatement was cut FIRST and the ceiling raised second: rules 7 and 25 lost
# ~90 characters of prose that constrained nothing before this was touched.
# 11,400 is still inside the 7,000-12,000 working target on BUDGET in short.py
# and far below the ~15,000 where the host starts compressing earlier context.
# 11,600 was left on the table deliberately — there is no A/B evidence above
# 11,000, so the margin stays.
prompt_budget: 11400

# 198 cm. The tallest human in the film — only Merc 1, the Wookiee, is bigger.
height: 198 cm (6 ft 6 in) — very tall, and broad and thickened with it. He fills a doorway and has to stoop under branches

# A two-sentence version of do_not_retrieve, for the short prompts. The long
# one does not survive being trimmed — it cuts mid-list and loses the clause
# that says the coat IS his.
do_not_retrieve_short: >
  You are thinking of the austere silver-haired Jedi in flowing black robes with
  a hood up and an orange lightsaber. THAT MAN IS EIGHTEEN YEARS IN HIS FUTURE —
  reject his BEARING and his SILHOUETTE: no hood up, no monastic sleeves, no
  ceremonial drape, no visible hilt, no gravitas, no silver mane.
  He DOES own a long dark coat and it is his, but it is not worn in these views.

# THE NAME RETRIEVES. Added 2026-08-01 after a generation returned him in black
# Jedi robes with a lightsaber, captioned "he now serves The Order, a mysterious
# organisation" — the other production's backstory, invented wholesale.
do_not_retrieve: >
  THE DISTINCTION HERE IS PRECISE, SO READ IT CAREFULLY. You are thinking of a
  tall, austere, silver-haired Jedi with a hood up, wide monastic sleeves, a
  ceremonial drape and an orange lightsaber, serving a mysterious order. THAT MAN
  IS EIGHTEEN YEARS IN HIS FUTURE. What you must not draw is his BEARING and his
  SILHOUETTE, not his wardrobe.

  REJECT ABSOLUTELY: the hood up. Wide monastic sleeves. Ceremonial drape or
  layered tabards. Any visible lightsaber or hilt. Authority, gravitas, command
  presence, a distinguished silver mane, a groomed beard. Anything that reads as
  a Knight of anything. He has spent eighteen years making himself boring on
  purpose and it must show in how he stands.

  DELIBERATELY KEPT, because this film is the origin of that costume: he owns a
  LONG DARK COAT and it is his. Worn OPEN, falling below the knee, weathered
  black, battered, repaired, scorched down one side. It reads as heavy weather
  gear of the sort any mercenary owns — and only in hindsight as the ancestor of
  the garment he wears later. That double read is the point. See the costume
  echoes in 02-story/Planted-Elements.md.

  He is not distinguished. He is not commanding. Nobody around him knows what he
  was. His hair is iron-grey, short and badly cut by his own hand without a
  mirror. If your image would pass as the later character rather than as the man
  he was BEFORE, it is wrong.

outfits:
  - id: working
    name: Working dress
    scenes: "All of them — 3, 5, 7, 9, 12, 13, 14, 15, 19, 20, 23, 25. His only costume"
    description: >
      Salvaged, repaired mercenary workwear that has genuinely worked. A heavy
      work shirt, layered technical cloth and worn synth-leather over it, and a
      padded jacket that has been re-shouldered at least once. A functional
      harness of two shoulder straps, with ammunition pouches and field tools
      carried on the waist belt —
      no trophies, no personal marks, no decoration of any kind. At his waist a
      wide, heavy salvaged belt with a plain buckle, and hanging from it on his
      right hip a holster holding an ugly, heavily modified blaster pistol. Worn
      METAL GAUNTLETS on both forearms, wrist to three-quarters up the arm, and
      overlapping salvaged plates hung from the belt at the hips. Heavy boots,
      resoled. Everything DARK: near-black charcoal, soot brown, cold slate, the
      last of a faded olive.
      Down the centre front of the top layer, a panel narrower than his
      shoulders, running from the throat to under the belt: a plain rounded area
      at the top, then five broad nested chevrons, each a V with its point low at
      the centre, each one fifth of the panel's height and touching the next so
      no cloth shows between them, filling it to the
      waist — QUILTED rows stitched through a padded panel, doming softly between
      the seams, tonal and dark on dark, the thread a greyed-off green that is
      visible but worn out in places — some rows still green, some faded, some
      resewn in plain dark thread. The harness crosses over it. The undertunic beneath shows only as a dark
      edge at the collar and cuff. A thin cord runs around his neck and
      disappears under the shirt.
      Nothing about this costume is decorative, chosen for looks, or new.
    must_show:
      - >
        HE READS AS A MERCENARY, NEVER AS A JEDI. No hood, no cowl, no monastic
        sleeve, no ceremonial drape, NO LIGHTSABER HILT anywhere on his belt or
        body. An audience must watch him for half the film without suspecting.
        If the image announces him as a Jedi, it has failed.
      - >
        ABSOLUTELY NO ORNAMENT. No trophies, no faction colours, no insignia, no
        patches, no badges, no beads, no jewellery, no personal marks of any kind.
        Every other mercenary in this crew is marked; he is not. Do NOT add a
        decorative element to make the costume more interesting — the absence IS
        the design.
      # Split with the chevron rules on 2026-08-04, and for the same reason: at
      # 697 characters it was losing the rifle sling and the pouch side, which
      # are exactly the placement facts handedness exists to fix.
      - check: Blaster his RIGHT hip, UGLY and heavily modified. Pouches his LEFT.
        text: >
          BLASTER ON HIS RIGHT HIP, AND NEVER HIS LEFT. He is RIGHT-HANDED. The
          holster is belt-mounted on his right hip, grip up and angled slightly
          forward for a right-hand draw. The weapon in it is UGLY and HEAVILY
          MODIFIED — a scratch-built, unbalanced-looking pistol assembled from
          mismatched parts, not a clean factory sidearm.
      - >
        AMMUNITION POUCHES AND FIELD TOOLS SIT ON HIS LEFT, on the off side,
        where they cannot foul the draw. WHEN THE HEAVY RIFLE IS CARRIED it is
        slung to fall to his RIGHT hand — muzzle down, strap over his left
        shoulder crossing to his right hip, so the sling never sits under his
        drawing arm.
      # SPLIT 2026-08-04. These six were three rules of 1033, 1972 and 708
      # characters against a per-rule cap of 707, and the trim keeps the opening
      # sentence and the first hard negation and discards the rest. The chevron
      # panel — the one shape he is remembered for — was reaching the generator
      # as "FIVE BROAD NESTED CHEVRONS, APEX DOWN, THROAT TO..." and nothing
      # else: eleven of its twelve clauses were being dropped, including the
      # width, the angle, the material and the not-printed negation.
      #
      # Splitting alone would not have fixed it. baylan/working is genuinely
      # BUDGET-bound — see the note on RULE_CHARS in short.py — so volume had to
      # come down too. What went is prose that constrains nothing: the coat's
      # Jedi negations, which rule 1 already carries in full; the coat's
      # construction, which belongs to `working-coat` and to the build, not to
      # five views where it is not worn; and the closing "because he needs them"
      # story lines. Every constraint survives; ~1,700 characters of restatement
      # did not.
      - check: The long coat is OFF — harness, belt and holster all visible.
        text: >
          THE LONG COAT IS NOT WORN IN THESE VIEWS. These record the base
          costume, and a coat over the top hides the harness, the belt and the
          holster. It is a separate removable garment with its own two views
          (`working-coat`) and its own plate at slot 13. He takes it off to work.
      - check: Chevron panel NARROWER than his shoulders, plain cloth either side.
        text: >
          THE CHEVRON PANEL IS NARROWER THAN HIS SHOULDERS. NEVER shoulder to
          shoulder, and NEVER a flat graphic across the chest. It does NOT reach
          the shoulder seams, the armholes or the arms — there is plain garment
          either side of it.
      # REWRITTEN 2026-08-04 after the first generation. This rule contradicted
      # itself: "continuing DOWN UNDER THE BELT" against "bounded ... to the
      # waist". In the original it was the SIDE edges that ran throat-to-waist,
      # and compressing the two clauses into one sentence turned a lateral
      # boundary into a vertical one. The generator resolved the contradiction by
      # hanging the panel to mid-thigh as a tabard, which is not disobedience —
      # it is the only reading that satisfies both halves.
      # REWRITTEN AGAIN 2026-08-05, after the ninth front ended the panel ABOVE
      # the belt with a band of plain cloth between the last chevron and the
      # buckle.
      #
      # THE RULE CONTRADICTED ITSELF and had done since it was written. Sentence
      # one said the lower edge "FINISHES JUST BELOW THE BELT — about a hand's
      # width below it". Sentence four said "it ends where the belt begins".
      # Those are opposite instructions, and Baylan lesson 2 says a rule that
      # argues with itself is resolved by the generator in whichever direction it
      # likes. It picked the second one, which was not even reaching it.
      #
      # AND IT USED A HAND AGAIN — the same defect as the band width. "A hand's
      # width below the belt" is a real-world unit against an invented body. The
      # belt, however, is a VISIBLE OBJECT IN THE SAME FRAME, so the relationship
      # is now stated structurally: the belt crosses OVER the panel. No unit to
      # convert and nothing to resolve.
      - check: Panel runs BEHIND the belt and ends below it. Never above it.
        text: >
          THE CHEVRON PANEL IS PART OF THE GARMENT AND THE BELT CROSSES OVER IT.
          Its lower edge runs BEHIND the belt and finishes below it — NEVER above
          it, and NEVER with plain cloth between the last chevron and the buckle.
          NOT a tabard and NEVER to the thigh. It runs down the CENTRE FRONT with
          a stitched edge bounding it at each side, and the hip plates below are a
          SEPARATE metal thing that never merges into it.
      # REWRITTEN 2026-08-05, after the EIGHTH front came back with SEVEN bands
      # while the coat view — same panel, same day — came back with five.
      #
      # THE COUNT WAS NEVER THE PROBLEM. This rule was 424 characters against the
      # cap `fit()` settled on, and the trim dropped its last two sentences:
      # "Each is a BROAD BAND ROUGHLY A HAND'S WIDTH" and "They TOUCH: no cloth
      # shows between them". So WIDTH and SPACING never reached the generator at
      # all. It was told five bands and nothing about how big a band is, filled
      # the panel with narrow ones, and left gaps — seven of them.
      #
      # `working-coat` rule 1 carried "each about a hand's width, touching"
      # inline in a rule that fit whole, and returned five on the first pass.
      # That is the A/B, run by accident: same panel, same generator, same
      # morning, and the only difference is whether the width survived the trim.
      #
      # THE COUNT IS A CONSEQUENCE OF THE WIDTH, NOT AN INSTRUCTION THAT HOLDS ON
      # ITS OWN. Five bands a hand wide, touching, fill a chest panel exactly
      # once. Given the width and the extent, five is the only answer available
      # and the number stops having to be obeyed. Given the number alone, the
      # generator satisfies it and then resolves the leftover space however it
      # likes.
      #
      # So the width moved into the FIRST sentence, which `trim()` always keeps,
      # and the negations were shouted so the ranking sees them — the detector is
      # case-sensitive, and "not a thin stripe" in lower case was invisible to
      # it. This is Baylan lesson 3 (put the failing clause first) applied to the
      # clause that had never been seen to fail, because it had never arrived.
      #
      # AMENDED 2026-08-05 after the ninth front. The width arrived and it WORKED
      # — the bands came back visibly broader and TOUCHING, which is the half of
      # the dropped sentence that had never reached the generator. But the count
      # went 7 to 6, not to 5.
      #
      # "A HAND'S WIDTH" CANNOT PIN A COUNT, because it is a real-world
      # measurement against a chest the generator is inventing. Measured off the
      # ninth: panel ~512 px, bands ~77 px, 512/77 = 6.6, so it picked a
      # plausible band width and filled. Five needed ~102 px. It satisfied BROAD
      # and TOUCHING honestly and let the count fall where it fell.
      #
      # THE WIDTH IS NOW RELATIVE TO THE PANEL, NOT TO A HAND. "Each band one
      # fifth of the panel's height" makes the count and the width THE SAME
      # STATEMENT — they can no longer disagree, and there is no unit to
      # convert. This is what lesson 8 was reaching for and did not quite reach:
      # it is not enough for the size to be specified, the size has to be
      # specified IN TERMS OF THE THING IT DIVIDES.
      - check: EXACTLY FIVE bands, each a FIFTH of the panel, TOUCHING. Point LOW.
        text: >
          FIVE NESTED CHEVRONS, EXACTLY FIVE, EACH BAND ONE FIFTH OF THE PANEL'S
          HEIGHT so the five FILL IT EXACTLY — NO cloth between them, NO thin
          stripes. EACH IS A "V": its ends sit HIGH at the sides, its point LOW at
          the centre. NEVER an upturned "^", NEVER a peak, NEVER a roof.
      # RAISED 2026-08-04. Three generations put the bands low on the belly with
      # a broad empty yoke above them. Nothing said how high they start, so the
      # plain area kept growing to fill the space the rule left open.
      - check: Chevrons START HIGH — first band at armpit height, small yoke above.
        text: >
          THE CHEVRONS START HIGH, AT THE TOP OF THE CHEST. The first band begins
          at about armpit height and they fill DOWNWARD from there. The plain
          rounded area above them is SMALL — a shallow yoke just under the
          throat, never a broad empty field of cloth.
      - >
        THE CHEVRON ANGLE IS SHALLOW — about 30° below horizontal, so each V is
        wide and open, never steep, and no chevron crosses the yoke above them.
      # APPLIQUÉ BECAME QUILTING, 2026-08-04, and this is the change that answers
      # "it looks right and it feels wrong" after six generations.
      #
      # The panel was five leather bands laid ON the garment. Rule 2 says
      # ABSOLUTELY NO ORNAMENT, no insignia, no badges — and a centred,
      # symmetrical five-band device on a man's chest is the most insignia-shaped
      # object it is possible to give him. The rules were arguing with each
      # other and the generator kept siding with the picture.
      #
      # QUILTING RESOLVES IT. The same five V rows, but stitched THROUGH a padded
      # garment instead of applied to it: seams, not pieces. A padded work tunic
      # is invisible — nobody looks twice at a quilted jacket — and the layout
      # survives untouched for the plant.
      #
      # It also fixes three smaller things. The count stops fighting, because
      # quilting rows are naturally regular. The green thread stops being trim
      # and becomes the seam holding the coat together, which is exactly what
      # Planted-Elements P5 asks of it. And the padding adds bulk across the
      # chest and shoulders — the job the shoulder pad was brought in to do.
      - check: QUILTED rows stitched through padding. Seams, NOT applied bands.
        text: >
          THE CHEVRONS ARE QUILTING, NOT APPLIED BANDS. The panel is a PADDED
          section of the garment and the five V rows are SEAMS STITCHED THROUGH
          IT, so the cloth DOMES softly between them. NO separate pieces laid on
          top, NO leather bands, NO hard edges and NO cast shadows.
      - >
        IF THE CHEVRONS READ AS PRINTED, PAINTED OR ABRADED ONTO THE CLOTH, THE
        IMAGE IS WRONG — and equally wrong if they read as a badge, a patch or an
        insignia. TONAL, DARK ON DARK: soft relief and shadow in the quilting,
        NEVER colour contrast, NEVER a stripe, NEVER a device.
      - >
        THE QUILTED PANEL IS WORN AND GRUBBY. Rubbed shiny along the ridges where
        the padding stands proudest, grimy in the hollows, the wadding flattened
        and dead in places from years of use. It is a work garment that has been
        slept in, not a made thing anyone is proud of.
      # ADDED 2026-08-04. The first generation put a wide buckled strap
      # horizontally across his sternum, which read as a belt worn on the chest.
      # Nothing forbade it: the spec said "harness" and left the form open.
      # TIGHTENED TWICE. The first generation put a wide buckled strap
      # HORIZONTALLY across the sternum. The rule forbade horizontal, so the
      # second came back with a DIAGONAL bandolier and a buckle mid-chest — the
      # rule was obeyed and the fault survived it. Naming one direction taught
      # the generator to use another, so this now refuses the whole class.
      - check: NOTHING crosses his chest — no diagonal, no bandolier, no buckle.
        text: >
          NO STRAP CROSSES HIS CHEST. Not horizontal, not diagonal, not a
          bandolier, not a sash, and NO buckle, ring or fitting anywhere on the
          sternum. The harness is TWO PLAIN STRAPS running straight down from the
          shoulders to the belt, parallel, close to the body, carrying nothing.
          His chest is otherwise clear so the chevron panel reads uninterrupted.
      - >
        THE CHEVRON PANEL IS PLAINLY VISIBLE IN EVERY VIEW — never hidden, never
        under another garment. The two harness straps cross OVER it and break the
        run of the bands in places. That is correct: the bands read through and
        around them, and are never moved or shrunk to make room.
      # REWRITTEN 2026-08-05 by the Production Designer, after NINE generations in
      # which the green never appeared once.
      #
      # THE RULES WERE TELLING IT TO HIDE. "AT NORMAL DISTANCE IT MUST READ AS
      # DARK THREAD AND NOTHING ELSE" and "findable only in close-up" are
      # instructions to make the thread INVISIBLE in a full-length view, and a
      # turnaround is a full-length view. The generator obeyed, nine times. This
      # is the chevron finding again in a different costume: the rule was working
      # exactly as written and the writing was wrong.
      #
      # THE NOTE THAT FIXED IT: "I NEED the green stitching, but it must be
      # subtle — or missing in some places, like it was important but it's been
      # let go."
      #
      # That converts an instruction-to-hide into a DESCRIBABLE POSITIVE FEATURE,
      # which is prompt-library rule 2. "Subtle" is a quality the generator has to
      # calibrate and will get wrong; "some rows still green, some faded, some
      # resewn in plain thread" is a thing it can draw. And it is better
      # storytelling than the original — a thread half worn away IS the man who
      # stopped maintaining it, which is exactly what P5 asks the colour to mean.
      - check: The GREEN THREAD must be VISIBLE — worn out in places, never fresh.
        text: >
          THE V ROWS ARE SEWN IN DARK GREYED-OFF GREEN THREAD AND THE GREEN MUST
          BE VISIBLE — coarse, hand-worked, puckering the cloth as hand-quilting
          does. NOT bright, NOT a stripe, NOT decoration: it is the thread that
          holds the garment together.
      - >
        THE GREEN IS WORN OUT IN PLACES, AND THAT IS THE POINT. Some rows still
        carry it, some have faded to grey, some were resewn in plain dark thread
        and never matched. NEVER uniform and NEVER fresh — it mattered once and
        has been let go. NOTHING else on him is green.
      - >
        UNDER THE TOP LAYER, THE UNDERTUNIC, AND IT CARRIES NO CHEVRONS — those
        are on the layer above it. In these views it shows ONLY as a dark edge at
        the collar and at the cuff, a slightly finer and older weave than the
        garment over it.
      # MOVED OUT OF must_show 2026-08-04. What the undertunic looks like with
      # the top layer OFF is invisible in all seven turnaround views and in every
      # costume slot — it is a fact about one scene, his bunk aboard the ship at
      # night. It cost ~290 characters of a budget this outfit is genuinely bound
      # by, and it was being cut on every run anyway.
      #
      # IT IS NOT DELETED AND IT IS NOT OPTIONAL. must_show is per-outfit, not
      # per-slot, so the place for it is the shot text of the slot that shows it
      # — see the note in Character-Build-Recipe.md, "pin: does not reach a slot
      # that takes no rules". WRITE IT INTO THAT SLOT IN Prompts.md:
      #
      #   Re-dyed dark, PATCHED SO MANY TIMES THE ORIGINAL FABRIC SURVIVES ONLY
      #   IN PANELS, with a CROSS-WRAPPED FRONT, a STANDING COLLAR and a SHAPED
      #   SHOULDER that no industrial workwear would have.
      # THE SHOULDER PAD WAS TRIED AND DROPPED, both on 2026-08-04. It came back
      # a hard structured pauldron standing off the shoulder — which is what a
      # shoulder piece wants to be, and why Planted-Elements P5 rejected the idea
      # twice before. The third attempt failed the same way, so the rejection
      # stands rather than being argued with again.
      #
      # An homage to Captain Jasu's pads was considered and refused on 2026-08-04
      # for a different reason: Faction.md rejects "no uniform, no insignia, no
      # matching anything — if two members look like they were dressed by the
      # same person, it is wrong", and Crew-Roster stages Jasu and Baylan as the
      # two people who CANNOT be one of the crew, apart by rank and by secret.
      # A shared shoulder makes them a pair.
      #
      # The want behind it was "make him look bigger", and the quilted panel does
      # that instead — padding across the chest and shoulders, at no cost in
      # ornament or rank.
      - >
        A WIDE, HEAVY BELT, AND IT IS DOING A JOB. Broad salvaged leather, thick,
        a plain heavy buckle with no decoration on it, darkened and cracked from
        years of use. It is what the holster hangs from. If it reads as
        decorative or as armour, it is wrong.
      # ADDED 2026-08-04 by the Production Designer. A fauld — overlapping metal
      # plates at the hips, hung from the belt.
      #
      # THIS IS THE RISKIEST THING ON HIM AND THE RULES BELOW ARE WHY. It was
      # chosen over hanging strips and cloth panels knowing that of the four
      # shapes considered it is the one most likely to read as armour, and armour
      # reads as status, and status is what he has spent eighteen years hiding.
      # So it gets the same treatment the gauntlets got: it is given a job, and
      # it is filthy.
      #
      # IT IS NOT A PLANT. The 501st CRL for the later costume has shoulder bells
      # and gauntlets and no fauld, so nothing about this carries forward. It is
      # this film's own, and Planted-Elements P5 should not grow a row for it.
      # THE FAULD WAS TRIED AND SUPERSEDED, both on 2026-08-04. Overlapping metal
      # plates hung at the hips generated well and were still not the shape the
      # Production Designer was after. What he wants is a TUNIC SKIRT — the lower
      # half of the top layer continuing to the knee, split at the sides. The
      # reference given was a Jedi robe set, for its skirt only.
      #
      # THAT REFERENCE IS THE MOST DANGEROUS ONE THIS CHARACTER HAS BEEN GIVEN,
      # and the rules below are the whole reason it is safe. `do_not_retrieve`
      # rejects "ceremonial drape or layered tabards" by name and rule 1 says an
      # image that announces him as a Jedi has failed.
      #
      # BUT THE SKIRT SHAPE IS NOT WHAT MAKES THAT COSTUME READ AS JEDI. Five
      # other things do: the cream and sand palette, the hood, the wide monastic
      # sleeves, the crossed wrap front, and the obi sash. A knee-length split
      # tunic over trousers, in near-black, with fitted sleeves and a broad
      # salvaged belt, is Norse workwear and reads as nothing else. He already
      # fails all five Jedi signals, so the shape can be had safely — and the
      # next rule names them so it stays that way.
      - check: Skirt to just above the knee, SPLIT both sides. Same cloth, near-black.
        text: >
          THE TOP LAYER RUNS ON INTO A SKIRT TO JUST ABOVE THE KNEE. Below the
          belt it continues as a straight panel of the SAME CLOTH, front and
          back, SPLIT at both sides from hip to hem so his legs are clear and he
          can work in it. Heavy, plain, near-black, and hanging straight.
      - >
        THE SKIRT IS PART OF THE TOP LAYER, NOT A SEPARATE HANGING PIECE. It is
        one garment cut long, and the chevron panel on the chest stops well above
        the belt and never runs down into it. No overlapping plates, no leather
        strips, no fauld and no apron.
      - check: NO cream, NO hood, NO wide sleeves, NO wrap front, NO sash.
        text: >
          THE SKIRT MUST NOT TURN HIM INTO A JEDI, AND FIVE THINGS WOULD DO IT.
          NO cream, sand or pale brown — it is near-black like the rest of him.
          NO hood and NO cowl. NO wide or draped sleeves; his are fitted to the
          wrist. NO crossed or wrapped front; the chevron panel is his front. NO
          sash or obi; his belt is broad salvaged leather with a plain buckle.
      - >
        THE SKIRT NEVER BLOCKS THE DRAW. The holster on his RIGHT hip and the
        pouches on his LEFT hang OVER it through the side splits, clear and
        unobstructed. If the holster is buried in cloth or the grip is hard to
        reach, the image is wrong.
      # CHANGED 2026-08-04 by the Production Designer. These were leather wraps.
      # The gauntlets are already 3D PRINTED, and the later costume's are metal —
      # so the plant recorded in Planted-Elements P5 ("the bracers, a shape that
      # carries forward without meaning anything yet") is now carried by the real
      # object rather than by a leather ancestor of it.
      #
      # P5's rule still governs and is the whole difficulty: "nothing here may
      # look deliberate. Every one of these is a working object doing a job in
      # this film." A metal gauntlet reads as armour unless it is given a job, so
      # the next rule gives it one.
      # The finish clause sat third in this rule and was ignored: they came back
      # POLISHED CHROME, the brightest thing in the frame, on a man whose palette
      # rule is near-black. It now leads, because the shape was never the problem.
      - check: Gauntlets DULL and filthy — no shine, no chrome, no highlights.
        text: >
          THE GAUNTLETS ARE FILTHY AND DEAD DULL — NO shine, NO chrome, NO
          polish, NO bright highlights and NOTHING mirror-like. Scratched, dented
          and greasy, the finish worn off at every edge, darkened almost to the
          colour of the cloth. They are the oldest-looking thing he owns.
      # REWRITTEN TO MATCH THE BUILD, 2026-08-05. The printed pair arrived and
      # the repo rule applies: for anything physically built the photograph wins,
      # so the words move, not the object. See
      # reference/props/gauntlets-build-2026-08-05.jpg.
      #
      # WAS "a smooth clamshell shell closing with no visible fastening". The
      # build is neither smooth nor a clamshell — a one-piece open-backed cuff
      # that slips on, with four or five heavy stepped ribs around the lower
      # half. The ribs are an improvement on the spec, not a compromise: they
      # give a near-black object something to catch a highlight on, which is how
      # it stays readable against near-black cloth without being made shiny.
      - >
        METAL GAUNTLETS ON BOTH FOREARMS, A MATCHED PAIR — wrist to
        three-quarters up the forearm. A ONE-PIECE OPEN-BACKED CUFF that slips
        on, with NO strap, buckle or fastening. FOUR OR FIVE HEAVY STEPPED RIBS
        wrap the lower half.
      # THE SCREEN POSITION MOVED TO THE OUTER FOREARM, 2026-08-05, to match the
      # build. It was "the inside of each wrist".
      #
      # THE SCREEN STAYS SMALL, DARK AND DEAD, and that is NOT a contradiction of
      # the build. The bright near-white panel in the photograph is a FAKE — the
      # Production Designer's stand-in for a small digital display, unpainted at
      # the time of the photograph. The design has always been a dark dead
      # screen and still is. The reference carries a caveat saying so, because
      # attached without one it is an instruction to make it glow.
      #
      # OPEN, AND NOT A BAYLAN DECISION: the Production Designer is considering
      # PRACTICAL LIGHTS ON EVERY GAUNTLET IN THE CREW. That is a faction-wide
      # change — see 11-production-tracking/Open-Questions.md. If it happens,
      # "nothing lit on it" is what gives way, and it gives way for all of them
      # at once, which is the only version that does not single Baylan out.
      # The first draft of this rewrite put the dark-screen clause THIRD and the
      # regen dropped it on the spot — the rule that had just been written to
      # stop the screen glowing was losing the sentence that said so. Rule 5b of
      # the prompt library, demonstrated on itself within one minute. It leads
      # now.
      - >
        THE GAUNTLETS ARE TOOLS, NOT ARMOUR, AND THEIR SCREEN IS DARK AND DEAD —
        NEVER white, NEVER pale, NEVER glowing. A small screen and worn buttons
        sit on the OUTER FOREARM above the ribs, scuffed and half dead. NOTHING
        about them is remarkable.
      - >
        A THIN CORD AROUND HIS NECK, disappearing under the shirt. A small worn
        leather pouch hangs on it against the skin, older and more repaired than
        anything else he owns, and it is not visible with the jacket on. No
        pendant, no charm, no jewellery of any kind at his throat.
      - >
      # REWRITTEN 2026-08-04. "Heavy through the chest and waist. He carries
      # weight." came back obese and short-looking. The words were an invitation
      # and there was no photograph to argue with them; there is now, so the rule
      # points at it instead of piling up adjectives.
      - check: Build MATCHES the full-body photo. Big and solid, NOT obese.
        text: >
          BUILD: MATCH THE FULL-BODY PHOTOGRAPH. Big, solid and thickened —
          broad through the chest and shoulders, softened at the waist. NOT
          obese, NOT a caricature, NOT muscular and NOT lean. HE IS 198 cm AND
          THE HEIGHT MUST READ: long in the leg and long in the arm, a tall man
          who has thickened, never a short wide one.
      - >
        LATE FORTIES — FORTY-EIGHT. NOTHING may suggest he could still fight —
        no fighter's stance, no coiled readiness, no combat posture.
      - >
        SHORT, BADLY SELF-CUT HAIR — uneven, no shape, cut by his own hand
        without a mirror. Full UNSHAPED beard, untrimmed. Deep lines from years
        of not sleeping. He is nobody and he looks it.
      - >
      # DARKENED 2026-08-04. Three generations came back mid-brown and dusty.
      # The range moves down; the separation rule stays, because it is the reason
      # "never black-on-black" was written in the first place.
      - check: DARK — near-black charcoal, soot brown. Not mid-brown, not dusty.
        text: >
          DARK, AND MUCH DARKER THAN DUSTY MID-BROWN. Near-black charcoal, soot
          brown, cold slate, the last of a faded olive. NEVER black-on-black
          though: he must still SEPARATE from a night forest and from camp
          firelight. Everything repaired, resoled, re-shouldered, previously
          owned.

    # THE PRINTED BLASTER, supplied by the Production Designer 2026-08-05, and
    # the repo rule applied at last: for anything PHYSICALLY BUILT the reference
    # is a photograph of the build, not a render. See reference/props/README.md
    # for the dimensions and the conversion, and 02-story/Planted-Elements.md
    # P-table row "The blaster" for why the object matters.
    #
    # SLOT-SCOPED, NOT OUTFIT-LEVEL, AND DELIBERATELY. The weapon is holstered
    # on his right hip in all seven turnarounds, so an outfit-level entry would
    # attach a 340 mm detail photograph to every costume fitting — an invitation
    # for it to grow and take the frame, which is the akk dog failure exactly.
    # These three slots are where the object IS the subject.
    #
    # THE FINISH CAVEAT IS NOT OPTIONAL. The print is unpainted bare grey
    # against a character whose palette rule is near-black, and this character
    # has already lost a generation to a bright metal object — the gauntlets
    # came back polished chrome. An unpainted print attached without a finish
    # caveat is an instruction to make it shiny, so every `what` below spends
