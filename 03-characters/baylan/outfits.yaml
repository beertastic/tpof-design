      - >
        FIVE BROAD NESTED CHEVRONS, APEX DOWN, THROAT TO BELT, ON A PANEL
        NARROWER THAN HIS SHOULDERS — AND THE OPEN COAT MUST NOT COVER IT.
        Showing that panel is the point of this view; the coat only frames it.
        A plain rounded area at the top rises to a blunt point below the throat,
