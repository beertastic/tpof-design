character: Baylan
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# RAISED FROM THE 8,000 DEFAULT, 2026-08-04. See the note in short.py: 8,000 was
# chosen to match Shada's approved plates, and Baylan has none — so the ceiling
# was costing him a fifth of his specification for somebody else's consistency.
# His costume is genuinely large: 24 rules and ~6,100 characters, against her
# 23,807 which no budget could ever carry.
# 11,000 after the hip plates were added 2026-08-04. Still inside the
# 7,000-12,000 working target recorded on BUDGET in short.py, and well under the
# ~15,000 where the host starts compressing earlier context.
# 11,400 from 2026-08-05, and this one was MEASURED rather than guessed. The day
# added the gauntlet rewrite, the belt relationship and the green-thread rules,
# and the cap is violently non-linear at this point:
#
#     11,000 -> cap 288, 90%      11,400 -> cap 345, 96%
#     11,200 -> cap 312, 93%      11,600 -> cap 406, 98%
#
# At 11,000 the file was dropping the RIFLE SLING clause — muzzle down, strap
# over the left shoulder to the right hip — which is exactly the placement fact
# `handedness:` exists to fix. 400 characters buys it back and six points of
# coverage with it.
#
# Restatement was cut FIRST and the ceiling raised second: rules 7 and 25 lost
# ~90 characters of prose that constrained nothing before this was touched.
# 11,400 is still inside the 7,000-12,000 working target on BUDGET in short.py
# and far below the ~15,000 where the host starts compressing earlier context.
# 11,600 was left on the table deliberately — there is no A/B evidence above
# 11,000, so the margin stays.
# 12,000 from 2026-08-05, and THIS IS THE CEILING. It is the top of the
# 7,000-12,000 working target recorded on BUDGET in short.py, so there is no
# further raise available — every addition from here has to be paid for by a cut.
#
# The day added four rules the costume did not have this morning: whole-costume
# grime, the split tails, the wrist-stop on the gauntlets, and a longer build
# rule refusing a belly. At 11,400 that cost the panel RELIEF clause — "every
# band stands proud with a thick cut edge that throws a real shadow" — which is
# the exact thing the Production Designer had just asked for, plus the gauntlet
# ribs and the height-must-read line.
#
#     11,400 -> cap 301, 93%      12,000 -> nothing trimmed, 100%
#     11,700 -> cap 330, 97%
#
# Restatement was cut first on every previous raise and there is little left to
# cut: what remains in the drop list at 11,400 is load-bearing.
prompt_budget: 12000

# 198 cm. The tallest human in the film — only Merc 1, the Wookiee, is bigger.
height: 198 cm (6 ft 6 in) — very tall and broad through the shoulders, straight through the middle. He fills a doorway and has to stoop under branches

# A two-sentence version of do_not_retrieve, for the short prompts. The long
# one does not survive being trimmed — it cuts mid-list and loses the clause
# that says the coat IS his.
do_not_retrieve_short: >
  You are thinking of the austere silver-haired Jedi in flowing black robes with
  a hood up and an orange lightsaber. THAT MAN IS EIGHTEEN YEARS IN HIS FUTURE —
  reject his BEARING and his SILHOUETTE: no hood up, no monastic sleeves, no
  ceremonial drape, no visible hilt, no gravitas, no silver mane.
  He DOES own a long dark coat and it is his, but it is not worn in these views.

# THE NAME RETRIEVES. Added 2026-08-01 after a generation returned him in black
# Jedi robes with a lightsaber, captioned "he now serves The Order, a mysterious
# organisation" — the other production's backstory, invented wholesale.
do_not_retrieve: >
  THE DISTINCTION HERE IS PRECISE, SO READ IT CAREFULLY. You are thinking of a
  tall, austere, silver-haired Jedi with a hood up, wide monastic sleeves, a
  ceremonial drape and an orange lightsaber, serving a mysterious order. THAT MAN
  IS EIGHTEEN YEARS IN HIS FUTURE. What you must not draw is his BEARING and his
  SILHOUETTE, not his wardrobe.

  REJECT ABSOLUTELY: the hood up. Wide monastic sleeves. Ceremonial drape or
  layered tabards. Any visible lightsaber or hilt. Authority, gravitas, command
  presence, a distinguished silver mane, a groomed beard. Anything that reads as
  a Knight of anything. He has spent eighteen years making himself boring on
  purpose and it must show in how he stands.

  DELIBERATELY KEPT, because this film is the origin of that costume: he owns a
  LONG DARK COAT and it is his. Worn OPEN, falling below the knee, weathered
  black, battered, repaired, scorched down one side. It reads as heavy weather
  gear of the sort any mercenary owns — and only in hindsight as the ancestor of
  the garment he wears later. That double read is the point. See the costume
  echoes in 02-story/Planted-Elements.md.

  He is not distinguished. He is not commanding. Nobody around him knows what he
  was. His hair is iron-grey, short and badly cut by his own hand without a
  mirror. If your image would pass as the later character rather than as the man
  he was BEFORE, it is wrong.

outfits:
  - id: working
    name: Working dress
    scenes: "All of them — 3, 5, 7, 9, 12, 13, 14, 15, 19, 20, 23, 25. His only costume"
    # APPROVAL CLEARED 2026-08-05, hours after it was granted, because the
    # SKIRT CHANGED — see the rules below. APPROVAL.md's own procedure: clear the
    # block, change, regenerate, make a new reference view, re-approve, then
    # regenerate every other view.
    #
    # WHAT THE CLEARED APPROVAL WAS: front, 2026-08-05, on the fourteenth
    # turnaround, at source/artwork/turn-working-front.png. Everything on it was
    # right except the skirt, which is why only the skirt rules moved.
    #
    # BOTH EXISTING PLATES ARE NOW SUPERSEDED — turn-working-front.png and
    # turn-working-back.png. They are kept as history and MUST NOT be used as a
    # match target or as board source until a new front is approved.
    description: >
      Salvaged, repaired mercenary workwear that has genuinely worked. A heavy
      work shirt, layered technical cloth and worn synth-leather over it, and a
      padded jacket that has been re-shouldered at least once. NOTHING is worn
      over his chest — no harness, no braces, no shoulder straps of any kind.
      Ammunition pouches and field tools are carried on the waist belt, and
      no trophies, no personal marks, no decoration of any kind. At his waist a
      wide, heavy salvaged belt that FASTENS AT THE BACK — from the front an
      unbroken band of worn leather with no buckle or fitting on it — and hanging
      from it on his
      right hip a holster holding an ugly, heavily modified blaster pistol. Worn
      METAL GAUNTLETS on both forearms, wrist to three-quarters up the arm. Two
      separate torn panels of cloth hang from the belt over each hip, open at the
      centre front and back, as deep as his hand is long, one of them split at
      the bottom into two hanging tails. Heavy boots,
      resoled. Everything DARK: near-black charcoal, soot brown, cold slate, the
      last of a faded olive.
      Across his chest a BROAD PLASTRON, running almost armhole to armhole with
      a narrow strip of plain cloth each side, from the collar down to clear of
      the belt. A LARGE PLAIN YOKE fills its top half and ends in one wide V; below
      that, THREE TO FIVE broad chevron bands, each a V with its point low at
      the centre, filling the panel to its lower edge. The bands are SEPARATE
      PANELS LAID ON and overlapping like layered plates, each with a raised
      thick cut edge that shadows the band beneath, like the lames of a plated
      coat. THE BANDS ALTERNATE MATERIAL — smooth leather, then napped suede,
      then leather — so neighbours read strikingly different while both stay
      near-black: the contrast is finish, never colour. The seams are
      hand-sewn in a greyed-off green thread, visible but worn out in places —
      some still green, some faded, some resewn in plain dark thread.
      The undertunic beneath shows only as a dark
      edge at the collar and cuff. A thin cord runs around his neck and
      disappears under the shirt.
      Nothing about this costume is decorative, chosen for looks, or new.
    must_show:
      - >
        HE READS AS A MERCENARY, NEVER AS A JEDI. No hood, no cowl, no monastic
        sleeve, no ceremonial drape, NO LIGHTSABER HILT anywhere on his belt or
        body. An audience must watch him for half the film without suspecting.
        If the image announces him as a Jedi, it has failed.
      - >
        ABSOLUTELY NO ORNAMENT. No trophies, no faction colours, no insignia, no
        patches, no badges, no beads, no jewellery, no personal marks of any kind.
        Every other mercenary in this crew is marked; he is not. Do NOT add a
        decorative element to make the costume more interesting — the absence IS
        the design.
      # Split with the chevron rules on 2026-08-04, and for the same reason: at
      # 697 characters it was losing the rifle sling and the pouch side, which
      # are exactly the placement facts handedness exists to fix.
      - check: Blaster his RIGHT hip, UGLY and heavily modified. Pouches his LEFT.
        text: >
          BLASTER ON HIS RIGHT HIP, AND NEVER HIS LEFT. He is RIGHT-HANDED. The
          holster is belt-mounted on his right hip, grip up and angled slightly
          forward for a right-hand draw. The weapon in it is UGLY and HEAVILY
          MODIFIED — a scratch-built, unbalanced-looking pistol assembled from
          mismatched parts, not a clean factory sidearm.
      - >
        AMMUNITION POUCHES AND FIELD TOOLS SIT ON HIS LEFT, on the off side,
        where they cannot foul the draw. WHEN THE HEAVY RIFLE IS CARRIED it is
        slung to fall to his RIGHT hand — muzzle down, strap over his left
        shoulder crossing to his right hip, so the sling never sits under his
        drawing arm.
      # SPLIT 2026-08-04. These six were three rules of 1033, 1972 and 708
      # characters against a per-rule cap of 707, and the trim keeps the opening
      # sentence and the first hard negation and discards the rest. The chevron
      # panel — the one shape he is remembered for — was reaching the generator
      # as "FIVE BROAD NESTED CHEVRONS, APEX DOWN, THROAT TO..." and nothing
      # else: eleven of its twelve clauses were being dropped, including the
      # width, the angle, the material and the not-printed negation.
      #
      # Splitting alone would not have fixed it. baylan/working is genuinely
      # BUDGET-bound — see the note on RULE_CHARS in short.py — so volume had to
      # come down too. What went is prose that constrains nothing: the coat's
      # Jedi negations, which rule 1 already carries in full; the coat's
      # construction, which belongs to `working-coat` and to the build, not to
      # five views where it is not worn; and the closing "because he needs them"
      # story lines. Every constraint survives; ~1,700 characters of restatement
      # did not.
      - check: The long coat is OFF — the belt and holster are all visible.
        text: >
          THE LONG COAT IS NOT WORN IN THESE VIEWS. These record the base
          costume, and a coat over the top hides the panel, the belt and the
          holster. It is a separate removable garment with its own two views
          (`working-coat`) and its own plate at slot 13. He takes it off to work.
      # WIDENED 2026-08-05 against the reference crop. This said "NEVER shoulder
      # to shoulder" and produced a narrow strip down the centre front. The real
      # garment is a BROAD PLASTRON running almost armhole to armhole with only a
      # narrow strip of plain cloth at each side. The rule was written to stop a
      # flat graphic spanning the chest and overshot into the opposite fault.
      - check: Panel is BROAD — almost armhole to armhole, a strip clear each side.
        text: >
          THE CHEVRON PANEL IS A BROAD PLASTRON ACROSS HIS CHEST, running almost
          from armhole to armhole with only a NARROW STRIP of plain cloth left at
          each side. It stops short of the shoulder seams and NEVER runs onto the
          arms. NOT a narrow strip down the centre, and NOT a flat printed
          graphic.
      # REWRITTEN 2026-08-04 after the first generation. This rule contradicted
      # itself: "continuing DOWN UNDER THE BELT" against "bounded ... to the
      # waist". In the original it was the SIDE edges that ran throat-to-waist,
      # and compressing the two clauses into one sentence turned a lateral
      # boundary into a vertical one. The generator resolved the contradiction by
      # hanging the panel to mid-thigh as a tabard, which is not disobedience —
      # it is the only reading that satisfies both halves.
      # REWRITTEN AGAIN 2026-08-05, after the ninth front ended the panel ABOVE
      # the belt with a band of plain cloth between the last chevron and the
      # buckle.
      #
      # THE RULE CONTRADICTED ITSELF and had done since it was written. Sentence
      # one said the lower edge "FINISHES JUST BELOW THE BELT — about a hand's
      # width below it". Sentence four said "it ends where the belt begins".
      # Those are opposite instructions, and Baylan lesson 2 says a rule that
      # argues with itself is resolved by the generator in whichever direction it
      # likes. It picked the second one, which was not even reaching it.
      #
      # AND IT USED A HAND AGAIN — the same defect as the band width. "A hand's
      # width below the belt" is a real-world unit against an invented body. The
      # belt, however, is a VISIBLE OBJECT IN THE SAME FRAME, so the relationship
      # is now stated structurally: the belt crosses OVER the panel. No unit to
      # convert and nothing to resolve.
      # SETTLED 2026-08-05 — THE PANEL ENDS ABOVE THE BELT, and this rule now
      # describes the twelfth front rather than arguing with it.
      #
      # It had spent three revisions insisting the panel run BEHIND the belt and
      # finish below it, and the generator kept ending it higher. The twelfth
      # came back with the last chevron well clear of the belt and a band of
      # plain cloth between — and the Production Designer approved that panel as
      # it stood.
      #
      # So the rule was wrong, not the picture. Third time today: rule 9's yoke,
      # rule 11's construction, and now this. All three were us describing what
      # we expected rather than what the garment does.
      # THIS RULE PRODUCED A CROP TOP, 2026-08-05, and the wording was ours.
      #
      # It said "THE CHEVRON PANEL IS PART OF THE GARMENT" and then "the panel
      # NEVER runs under the belt, NEVER continues below it". Read together —
      # and they are one sentence apart — that is: the GARMENT never runs under
      # the belt. It obeyed exactly and returned a cropped vest ending above the
      # waist with a strip of shirt showing beneath it.
      #
      # THE TWO THINGS HAD THE SAME NAME. "Panel" meant the chevron field in one
      # clause and the whole garment in the next. Named separately now: the
      # GARMENT goes down behind the belt, the BANDS stop above it.
      - check: Garment runs BEHIND the belt — not a crop top. Bands stop above.
        text: >
          THE GARMENT RUNS DOWN BEHIND THE BELT AND IS NOT A CROP TOP — it NEVER
          ends above the waist and NEVER bares a strip of shirt between itself
          and the belt. The CHEVRON BANDS stop WELL SHORT of it, halfway down his
          chest, and a DEEP FIELD OF PLAIN CLOTH fills everything from the lowest
          band to the belt.
      # REWRITTEN 2026-08-05, after the EIGHTH front came back with SEVEN bands
      # while the coat view — same panel, same day — came back with five.
      #
      # THE COUNT WAS NEVER THE PROBLEM. This rule was 424 characters against the
      # cap `fit()` settled on, and the trim dropped its last two sentences:
      # "Each is a BROAD BAND ROUGHLY A HAND'S WIDTH" and "They TOUCH: no cloth
      # shows between them". So WIDTH and SPACING never reached the generator at
      # all. It was told five bands and nothing about how big a band is, filled
      # the panel with narrow ones, and left gaps — seven of them.
      #
      # `working-coat` rule 1 carried "each about a hand's width, touching"
      # inline in a rule that fit whole, and returned five on the first pass.
      # That is the A/B, run by accident: same panel, same generator, same
      # morning, and the only difference is whether the width survived the trim.
      #
      # THE COUNT IS A CONSEQUENCE OF THE WIDTH, NOT AN INSTRUCTION THAT HOLDS ON
      # ITS OWN. Five bands a hand wide, touching, fill a chest panel exactly
      # once. Given the width and the extent, five is the only answer available
      # and the number stops having to be obeyed. Given the number alone, the
      # generator satisfies it and then resolves the leftover space however it
      # likes.
      #
      # So the width moved into the FIRST sentence, which `trim()` always keeps,
      # and the negations were shouted so the ranking sees them — the detector is
      # case-sensitive, and "not a thin stripe" in lower case was invisible to
      # it. This is Baylan lesson 3 (put the failing clause first) applied to the
      # clause that had never been seen to fail, because it had never arrived.
      #
      # AMENDED 2026-08-05 after the ninth front. The width arrived and it WORKED
      # — the bands came back visibly broader and TOUCHING, which is the half of
      # the dropped sentence that had never reached the generator. But the count
      # went 7 to 6, not to 5.
      #
      # "A HAND'S WIDTH" CANNOT PIN A COUNT, because it is a real-world
      # measurement against a chest the generator is inventing. Measured off the
      # ninth: panel ~512 px, bands ~77 px, 512/77 = 6.6, so it picked a
      # plausible band width and filled. Five needed ~102 px. It satisfied BROAD
      # and TOUCHING honestly and let the count fall where it fell.
      #
      # THE WIDTH IS NOW RELATIVE TO THE PANEL, NOT TO A HAND. "Each band one
      # fifth of the panel's height" makes the count and the width THE SAME
      # STATEMENT — they can no longer disagree, and there is no unit to
      # convert. This is what lesson 8 was reaching for and did not quite reach:
      # it is not enough for the size to be specified, the size has to be
      # specified IN TERMS OF THE THING IT DIVIDES.
      # AMENDED AGAIN 2026-08-05, after the tenth front. THE FIVE LANDED — five
      # bands on the chest, the first time in ten attempts — and then the panel
      # carried on below the belt with two more, for seven on the garment.
      #
      # BOTH RULES WERE OBEYED. Rule 8 said five fill "the panel" and it put five
      # above the belt. Rule 7 said the panel runs behind the belt and finishes
      # below it, and it continued the quilting down. The ambiguity was ours:
      # "the panel" was given a new extent and a fractional band size IN THE SAME
      # PASS, without saying which extent the fraction divided. Lesson 6 — two
      # rules arriving whole and losing to each other.
      #
      # THE BELT IS NOW A LANDMARK ON THE COUNT, NOT A BOUNDARY BESIDE IT.
      # "Collar to lower edge, and the belt crosses the FOURTH" pins the extent
      # and the count in one statement, and it is CHECKABLE IN THE PICTURE rather
      # than inferred — prompt-library rule 1. Measured against the tenth: panel
      # ~555 to ~1480 px, belt centre ~1155, so at five bands the belt falls on
      # the fourth. It is right for the costume as built, not an invention.
      - check: FIVE bands, collar to lower edge. The BELT CROSSES THE FOURTH.
        text: >
          THREE TO FIVE BROAD CHEVRON BANDS BELOW THE YOKE, filling the panel to
          its lower edge. EACH IS A "V": ends HIGH at the sides, point LOW at the
          centre. NEVER a peak, NEVER an upturned "^". They are FEW AND BROAD,
          NEVER a stack of thin stripes and NEVER more than five.
      # REVERSED 2026-08-05, AND THIS ONE IS THE APOLOGY.
      #
      # It was RAISED on 2026-08-04 because "three generations put the bands low
      # on the belly with a broad empty yoke above them", and it forbade exactly
      # that: "the plain area above them is SMALL — a shallow yoke just under the
      # throat, NEVER a broad empty field of cloth."
      #
      # THE GENERATOR WAS RIGHT AND WE CORRECTED IT AWAY FROM THE SOURCE. The
      # reference crop shows a LARGE plain yoke filling the top half of the
      # plastron, ending in a wide V, with the bands only below it. It had been
      # reproducing the real garment three times and was told off for it.
      #
      # THE LESSON IS ABOUT EVIDENCE, NOT WORDING. Every other fault on this
      # costume was diagnosed by reading the trim report or measuring the image.
      # This one was diagnosed by looking at what the rule was fighting and
      # assuming the rule was right. Nobody had the reference yet, so "it keeps
      # doing X" was read as disobedience when it was information.
      # THE BANDS MOVE UP, 2026-08-05, and this is a DESIGN DECISION rather than
      # a correction — worth saying, because the rule it replaces was itself an
      # apology.
      #
      # On 2026-08-05 the large plain yoke was written IN, after the reference
      # arrived and showed that three generations drawing one had been right all
      # along. It is still right about the later costume. The Production
      # Designer now wants this one different: "move the chevrons up so they
      # start at the shoulder, and end higher up the body."
      #
      # THE PLANT SURVIVES IT. P5 transfers the two costumes by MATERIAL —
      # mismatched leather and suede now, proper leather later — not by exact
      # proportion, and he remakes the garment properly in between. Different
      # placement on the same shapes is what remaking it means.
      - check: Bands START AT THE SHOULDER and fill the TOP HALF, collar to belt.
        text: >
          THE TOPMOST BAND TOUCHES THE SHOULDER SEAM — NO plain yoke above it
          beyond a narrow strip, NEVER a broad empty field. THE LOWEST BAND ENDS
          A FULL BELT'S WIDTH ABOVE THE BELT, with that much plain cloth between
          the last chevron and the belt. The whole block sits HIGH on his chest.
      - >
        THE CHEVRON ANGLE IS SHALLOW — about 30° below horizontal, so each V is
        wide and open, never steep, and no chevron crosses the yoke above them.
      # APPLIQUÉ BECAME QUILTING, 2026-08-04, and this is the change that answers
      # "it looks right and it feels wrong" after six generations.
      #
      # The panel was five leather bands laid ON the garment. Rule 2 says
      # ABSOLUTELY NO ORNAMENT, no insignia, no badges — and a centred,
      # symmetrical five-band device on a man's chest is the most insignia-shaped
      # object it is possible to give him. The rules were arguing with each
      # other and the generator kept siding with the picture.
      #
      # AND REVERSED AGAIN 2026-08-05, against the reference. The real garment IS
      # applied panels: separate pieces, overlapping, each with a hard piped edge
      # and a visible cast shadow — exactly what the quilting rule had begun to
      # forbid by name.
      #
      # THE INSIGNIA PROBLEM WAS REAL BUT MISATTRIBUTED. It was never "applied
      # pieces" that read as a badge, it was FIVE EQUAL NESTED BANDS CENTRED ON
      # HIS STERNUM. The reference has applied panels and does not read as
      # insignia, because a LARGE YOKE breaks the nested pattern and three broad
      # overlapping plates read as garment construction — a jerkin — rather than
      # a device. Moving toward the reference reduces the badge risk; it does not
      # create it.
      #
      # SHEEN IS THE MECHANISM AND NOTHING SAID SO. The reference reads at all in
      # near-black because the panels are a DIFFERENT MATERIAL from the base —
      # suede against matte cloth — not a different tone. "TONAL, DARK ON DARK"
      # was true and insufficient: it described what must not happen (colour
      # contrast) without naming what makes the shape visible at all.
      # DEEPENED 2026-08-05. The bands were reading as panels laid flat with a
      # piped edge. The Production Designer wants the LAMES of a plated coat:
      # each band standing proud of the one below, a thick cut edge throwing a
      # real shadow down onto it. Same construction, much more relief.
      - check: OVERLAPPING LAMES — each band stands PROUD and shadows the next.
        text: >
          THE CHEVRONS ARE SEPARATE PIECES LAID ON THE GARMENT, EACH OVERLAPPING
          THE ONE BELOW IT like the lames of a plated coat. Every band STANDS
          PROUD with a THICK CUT EDGE that throws a REAL SHADOW onto the band
          beneath. NOT quilting, NOT stitched rows, NOT padding domed between
          seams, NOT flat pieces sewn down.
      # LOCKED IN 2026-08-05 AT THE PRODUCTION DESIGNER'S REQUEST: "I love the
      # alternating chevron colours, please lock that in."
      #
      # AND THIS RULE WAS FIGHTING IT. It said the bands stay "the SAME
      # NEAR-BLACK… NEVER a lighter tone", which forbids the exact thing he
      # likes. It survived because the generator kept disobeying it — the tonal
      # variation has been in every good plate since the reference arrived and
      # was never once specified.
      #
      # THE DISTINCTION THAT MAKES BOTH TRUE: the bands differ from EACH OTHER,
      # and none of them differs from HIM. Every band is near-black; they are
      # simply not the same near-black, because they were cut from whatever was
      # to hand. That is not a colour contrast, it is mismatched stock.
      #
      # IT IS ALSO THE PLANT. Planted-Elements P5 transfers this costume to the
      # later one by MATERIAL — mismatched scrap suede now, proper leather
      # later. The alternating tones ARE that mechanism visible on the garment,
      # so a tidy-minded generation evening them out would quietly cost the
      # payoff. Specified positively now rather than tolerated.
      - check: Bands ALTERNATE LEATHER and SUEDE. Contrast is FINISH, not colour.
        text: >
          THE BANDS ALTERNATE LEATHER AND SUEDE — smooth leather CATCHES the
          light, napped suede EATS it, so neighbours read STRIKINGLY different
          while both stay NEAR-BLACK. The contrast is FINISH, NEVER colour:
          nothing light, nothing bright.
      - >
        THE PANEL IS WORN AND GRUBBY. Rubbed bare along the piped edges where the
        panels stand proudest, the suede gone shiny at the high points and grimy
        in the angles, corners lifting where the stitching has let go. It is a
        work garment that has been slept in, not a made thing anyone is proud of.
      # ADDED 2026-08-04. The first generation put a wide buckled strap
      # horizontally across his sternum, which read as a belt worn on the chest.
      # Nothing forbade it: the spec said "harness" and left the form open.
      # TIGHTENED TWICE. The first generation put a wide buckled strap
      # HORIZONTALLY across the sternum. The rule forbade horizontal, so the
      # second came back with a DIAGONAL bandolier and a buckle mid-chest — the
      # rule was obeyed and the fault survived it. Naming one direction taught
      # the generator to use another, so this now refuses the whole class.
      # THE HARNESS IS GONE, 2026-08-05, by the Production Designer: "remove the
      # braces. The top should just be the chevrons."
      #
      # It was never carrying anything. The rule said so in its own words —
      # "TWO PLAIN STRAPS running from the shoulders straight down to the belt,
      # CARRYING NOTHING" — and the pouches and tools have always hung on the
      # waist belt. It survived four days as a thing that had to be described,
      # placed, coloured and defended, while doing no work at all.
      #
      # AND IT WAS FIGHTING THE ONE SHAPE HE IS REMEMBERED FOR. The next rule
      # used to concede that the straps "cross OVER it and break the run of the
      # bands in places. That is correct." It was not correct, it was tolerated.
      # The plastron is now uninterrupted from collar to hem.
      #
      # THE NEGATION STAYS AND MATTERS MORE THAN EVER. Three generations put a
      # buckled strap across his sternum before this rule existed, and with no
