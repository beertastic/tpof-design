      # convert and nothing to resolve.
      # SETTLED 2026-08-05 — THE PANEL ENDS ABOVE THE BELT, and this rule now
      # describes the twelfth front rather than arguing with it.
      #
      # It had spent three revisions insisting the panel run BEHIND the belt and
      # finish below it, and the generator kept ending it higher. The twelfth
      # came back with the last chevron well clear of the belt and a band of
      # plain cloth between — and the Production Designer approved that panel as
      # it stood.
      #
      # So the rule was wrong, not the picture. Third time today: rule 9's yoke,
      # rule 11's construction, and now this. All three were us describing what
      # we expected rather than what the garment does.
      - check: Panel ends ABOVE the belt, clear of it. NOT a tabard.
        text: >
          THE CHEVRON PANEL IS PART OF THE GARMENT AND IT ENDS ABOVE THE BELT.
          The last chevron finishes clear of it, with a band of plain cloth
          between the panel and the belt — that gap is correct and deliberate.
          The panel NEVER runs under the belt, NEVER continues below it, and is
          NOT a tabard and NEVER reaches the thigh.
      # REWRITTEN 2026-08-05, after the EIGHTH front came back with SEVEN bands
      # while the coat view — same panel, same day — came back with five.
      #
      # THE COUNT WAS NEVER THE PROBLEM. This rule was 424 characters against the
      # cap `fit()` settled on, and the trim dropped its last two sentences:
      # "Each is a BROAD BAND ROUGHLY A HAND'S WIDTH" and "They TOUCH: no cloth
      # shows between them". So WIDTH and SPACING never reached the generator at
      # all. It was told five bands and nothing about how big a band is, filled
      # the panel with narrow ones, and left gaps — seven of them.
      #
      # `working-coat` rule 1 carried "each about a hand's width, touching"
      # inline in a rule that fit whole, and returned five on the first pass.
      # That is the A/B, run by accident: same panel, same generator, same
      # morning, and the only difference is whether the width survived the trim.
      #
      # THE COUNT IS A CONSEQUENCE OF THE WIDTH, NOT AN INSTRUCTION THAT HOLDS ON
      # ITS OWN. Five bands a hand wide, touching, fill a chest panel exactly
      # once. Given the width and the extent, five is the only answer available
      # and the number stops having to be obeyed. Given the number alone, the
      # generator satisfies it and then resolves the leftover space however it
      # likes.
      #
      # So the width moved into the FIRST sentence, which `trim()` always keeps,
      # and the negations were shouted so the ranking sees them — the detector is
      # case-sensitive, and "not a thin stripe" in lower case was invisible to
      # it. This is Baylan lesson 3 (put the failing clause first) applied to the
      # clause that had never been seen to fail, because it had never arrived.
      #
      # AMENDED 2026-08-05 after the ninth front. The width arrived and it WORKED
      # — the bands came back visibly broader and TOUCHING, which is the half of
      # the dropped sentence that had never reached the generator. But the count
      # went 7 to 6, not to 5.
      #
      # "A HAND'S WIDTH" CANNOT PIN A COUNT, because it is a real-world
      # measurement against a chest the generator is inventing. Measured off the
      # ninth: panel ~512 px, bands ~77 px, 512/77 = 6.6, so it picked a
      # plausible band width and filled. Five needed ~102 px. It satisfied BROAD
      # and TOUCHING honestly and let the count fall where it fell.
      #
      # THE WIDTH IS NOW RELATIVE TO THE PANEL, NOT TO A HAND. "Each band one
      # fifth of the panel's height" makes the count and the width THE SAME
      # STATEMENT — they can no longer disagree, and there is no unit to
      # convert. This is what lesson 8 was reaching for and did not quite reach:
      # it is not enough for the size to be specified, the size has to be
      # specified IN TERMS OF THE THING IT DIVIDES.
      # AMENDED AGAIN 2026-08-05, after the tenth front. THE FIVE LANDED — five
      # bands on the chest, the first time in ten attempts — and then the panel
      # carried on below the belt with two more, for seven on the garment.
      #
      # BOTH RULES WERE OBEYED. Rule 8 said five fill "the panel" and it put five
      # above the belt. Rule 7 said the panel runs behind the belt and finishes
      # below it, and it continued the quilting down. The ambiguity was ours:
      # "the panel" was given a new extent and a fractional band size IN THE SAME
      # PASS, without saying which extent the fraction divided. Lesson 6 — two
      # rules arriving whole and losing to each other.
      #
      # THE BELT IS NOW A LANDMARK ON THE COUNT, NOT A BOUNDARY BESIDE IT.
      # "Collar to lower edge, and the belt crosses the FOURTH" pins the extent
      # and the count in one statement, and it is CHECKABLE IN THE PICTURE rather
      # than inferred — prompt-library rule 1. Measured against the tenth: panel
      # ~555 to ~1480 px, belt centre ~1155, so at five bands the belt falls on
      # the fourth. It is right for the costume as built, not an invention.
      - check: FIVE bands, collar to lower edge. The BELT CROSSES THE FOURTH.
        text: >
          THREE TO FIVE BROAD CHEVRON BANDS BELOW THE YOKE, filling the panel to
          its lower edge. EACH IS A "V": ends HIGH at the sides, point LOW at the
          centre. NEVER a peak, NEVER an upturned "^". They are FEW AND BROAD,
          NEVER a stack of thin stripes and NEVER more than five.
      # REVERSED 2026-08-05, AND THIS ONE IS THE APOLOGY.
      #
      # It was RAISED on 2026-08-04 because "three generations put the bands low
      # on the belly with a broad empty yoke above them", and it forbade exactly
      # that: "the plain area above them is SMALL — a shallow yoke just under the
      # throat, NEVER a broad empty field of cloth."
      #
      # THE GENERATOR WAS RIGHT AND WE CORRECTED IT AWAY FROM THE SOURCE. The
      # reference crop shows a LARGE plain yoke filling the top half of the
      # plastron, ending in a wide V, with the bands only below it. It had been
      # reproducing the real garment three times and was told off for it.
      #
      # THE LESSON IS ABOUT EVIDENCE, NOT WORDING. Every other fault on this
      # costume was diagnosed by reading the trim report or measuring the image.
      # This one was diagnosed by looking at what the rule was fighting and
      # assuming the rule was right. Nobody had the reference yet, so "it keeps
      # doing X" was read as disobedience when it was information.
      - check: A LARGE plain yoke fills the top half. Bands only BELOW it.
        text: >
          A LARGE PLAIN YOKE FILLS THE TOP HALF OF THE PANEL — a broad empty
          field of cloth from the collar down to about the middle of his chest,
          ending in ONE WIDE V. It is the biggest single shape on the panel. The
          chevron bands begin BELOW it and NEVER above it, and NOTHING crosses
          the yoke.
      - >
        THE CHEVRON ANGLE IS SHALLOW — about 30° below horizontal, so each V is
        wide and open, never steep, and no chevron crosses the yoke above them.
      # APPLIQUÉ BECAME QUILTING, 2026-08-04, and this is the change that answers
      # "it looks right and it feels wrong" after six generations.
      #
      # The panel was five leather bands laid ON the garment. Rule 2 says
      # ABSOLUTELY NO ORNAMENT, no insignia, no badges — and a centred,
      # symmetrical five-band device on a man's chest is the most insignia-shaped
