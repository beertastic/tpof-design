          THERE IS EXACTLY ONE, AND IT IS AT HER THROAT. Qty 1, and the belt
          carries no second whistle — a generated test on 2026-08-03 came back
          wearing two, and two makes it an ornament instead of an instrument.
      - item: Leash — heavy, coiled at her LEFT hip
