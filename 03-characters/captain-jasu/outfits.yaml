character: Captain Jasu
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# CAST 2026-08-01, and this is a DEPARTURE FROM THE SCRIPT. The screenplay says
# "CAPTAIN JASU (40s), a powerful woman". She is now twenty-eight and 150 cm.
# Recorded in Character.md so nobody rediscovers it as an error.
#
# It makes the design stronger, not weaker. "The animal is her rank" was always
# the central fact; at 4 ft 11 in there is now NOTHING else it could be.
height: >
  150 cm (4 ft 11 in) — VERY SMALL AND SLIGHT, and almost certainly the smallest
  adult in the film. She is TWENTY-EIGHT. NOT imposing, NOT muscular, NOT
  physically dangerous-looking in any way. Baylan stands 48 cm taller than her
  and her own animal outweighs her

do_not_retrieve_short: >
  SHE IS 28 AND 150 cm — SMALL AND SLIGHT, NEVER IMPOSING. Do not make a
  mercenary captain tall, broad, older or physically formidable.
  DO NOT draw an Imperial officer and DO NOT draw a samurai. She has a high
  collar, a hard shoulder and a long coat, and that is where the resemblance
  stops: no Imperial grey, no rank badge, no code cylinders, no peaked military
  cap, no lacquered plate armour, no helmet, no horns, no face mask. She belongs
  to no army and never did.

# THE TWO THINGS THAT WILL RETRIEVE. A high collar plus a hard shoulder plus a
# crest at the brow sits very close to two costumes an image model knows
# extremely well, and both are wrong for opposite reasons.
do_not_retrieve: >
  TWO DEPICTIONS WILL TRY TO ARRIVE HERE AND BOTH ARE WRONG.

  NOT AN IMPERIAL OFFICER. No flat grey-green uniform, no tunic with a rank
  plaque on the chest, no code cylinders at the shoulder, no peaked military cap,
  no jodhpurs, no gleaming jackboots, no insignia of any kind. She commands eight
  people and a dog. There is no empire behind her and nothing she wears may imply
  one.

  NOT A SAMURAI, AND NOT A JEDI. No lacquered lamellar plate, no laced armour
  panels, no wide flaring shoulder guards, no horned or winged helmet, no face
  mask, no mempo, no topknot, no robes, no sash-wrapped front, no sword. The man
  standing beside her in the finale is a Jedi hiding as a mercenary, and his
  entire design depends on nobody in frame reading as one.

  AND SHE IS NOT PHYSICALLY IMPOSING. She is twenty-eight years old, 150 cm,
  slight and fine-boned — the smallest adult in the film, and her own animal
  outweighs her. The word "captain" will pull you toward someone tall, broad and
  weathered. Refuse it. She is obeyed because of the beast at her side and for no
  other reason, and an image that makes her physically formidable has destroyed
  the only idea in the design.

  WHAT IS TRUE INSTEAD: she has bought the SHAPE of authority — a closed high
  collar, a square shoulder, a long coat and a cinched waist — because she has
  none of the real thing. It is well made and it has been in a forest for weeks.
  Battered, faded, mended, and worn by somebody who fights in it.

outfits:
  - id: field
    name: Field dress
    # The production's own early concept drawing, added 2026-08-01. The shoulder
    # mantle is the signature of this costume and prose was never going to land
    # it — attach the sketch and let it carry the shape.
    # APPROVED 2026-08-01. See 03-characters/APPROVAL.md. Clear this to unlock.
    # The front turnaround is right — mantle, palette, bracers, leg panels and
    # the horns all landed together — so the remaining four views are now matched
    # against the photograph instead of re-derived from the paragraph.
    approved:
      date: "2026-08-01"
      view: front
      reference: 03-characters/captain-jasu/source/artwork/turn-field-front.png
      note: "Front view locked. Match this for all other views"

    references:
      # The interim costume plate at reference/costume/ is superseded by the
      # approved front above and has been removed — two costume references would
      # have disagreed with each other eventually.
      - path: reference/concept/jasu-concept-sketch.jpg
        what: the shoulder mantle, the ribbed torso and the leg panels
      # DETACHED 2026-08-03. A painted figure built from the concept drawings on
      # 2026-08-01, and for two days the only three-dimensional record of the
      # headdress and the hair — which is exactly what a drawing cannot hold.
      #
      # The approved turnarounds now hold all of it, photoreal and on the right
      # actor: the pale bone horns, their curve, how they sit set into swept-back
      # dark hair above and behind the ear, and the profile read. There is
      # nothing left that only the figure carries.
      #
      # And it is a FUNKO POP — a stylised toy with a 1:1 HEAD-TO-BODY RATIO,
      # black dot eyes, a flat featureless face, painted brows, photographed on a
      # kitchen table with a drink and a speaker in shot. Every one of those is
      # something a photoreal prompt must not learn.
      #
      # The head proportion is the dangerous one, and it is dangerous for HER
      # specifically. This character's whole design rests on reading as VERY
      # SMALL and slight — 150 cm, the smallest adult in the film. An oversized
      # head is how a small figure turns into a child or a caricature, which
      # undoes the one thing her documents work hardest to establish.
      #
      # Kept on disk as history, like the superseded costume fronts. Do not
      # attach them to anything.
      # - path: reference/build/jasu-figure-front.jpg
      #   what: the headdress and hair, front
      # - path: reference/build/jasu-figure-side.jpg
      #   what: the headdress and hair, profile
      # Her blaster is the A180 — the weapon Jyn Erso carries in Rogue One.
      # Supplied by the production 2026-08-01, after four generations returned a
      # generic pistol from the name alone. It is a third-party image of the
      # weapon rather than a photograph of OUR build; when the prop is made,
      # replace it with a photograph of that, per the rule Shada's WESTAR-35
      # established.
      - path: reference/props/a180.jpg
        what: the A180 blaster pistol
    scenes: "9, 19, 20, 23, 24, 25 — her only costume. The akk dog is wherever she is"
    description: >
      The only coherent, deliberately assembled outfit in this crew, and that is
      the point of it, on a woman of twenty-eight who stands 150 cm and is the
      smallest adult in the film. The garment is a SECOND SKIN in heavy ribbed
      knit and dense woven cloth, close to the body from the throat all the way
      down — torso, arms and legs — with no volume anywhere on her, cut and
      articulated for an acrobat. Over the shoulders, a stiff dark RIBBED MANTLE
      standing proud of the body and reaching out past the shoulder points before
      angling down over the upper arm, rising at the back into a stand collar
      closed at the throat. A wide heavy belt with plain working hardware pulls
      the waist in hard. Below it, narrow split panels hang straight over the
      skin-tight leg, and there are textured panels down the outer thigh and over
      the knee. Hard bracers on the forearms. Tall boots close to the calf, flat
      and practical, the best in the crew. Nothing on her head at all. At her brow a low ornate
      band, asymmetric, carrying a small worn crest to one side — the only
      decorative object on her and clearly something she chose rather than
      earned. On her right hip a holstered blaster pistol, clean and serviced. A
      worn whistle on a cord at her throat, and a heavy leash coiled at her belt.
      Everything is good material and everything is battered: faded across the
      shoulders, mended at the cuffs, mud to the knee. Nothing about her is
      insignia, and nothing about her was issued.
    # THE BUILD. Split out of a sourcing guide on 2026-08-01. Routes follow
    # 11-production-tracking/Costume-Build-Method.md: bought / printed / made.
    #
    # SUPPLIER LINKS AND PRICES ARE DELIBERATELY NOT HERE. They live in the
    # production's Drive, because they rot — a shop closes, a listing sells, a
    # price doubles, and a repository full of dead links is worse than none
    # because somebody trusts it. What is durable is the material, the
    # construction and the things it must not be. That is what is recorded here.
    components:
      - item: Ribbed base top — mock neck, stand collar, front closure
        route: bought
        qty: 1
        status: not-started
        note: >
          Heavy ribbed knit, dark warm brown. Search by CONSTRUCTION, not by
          look — "ribbed mock neck", "ribbed base layer", "ribbed zip
          turtleneck". MUST BE ALTERED TO FIT HER EXACTLY once found. At 150 cm
          nothing off the peg fits, and "looks thrifted" is the one thing this
          costume cannot look.
      - item: Shoulder mantle
        route: made
        qty: 1
        status: not-started
        note: >
          STIFFENED CLOTH — ribbed, quilted or pleated, holding its shape by
          construction. NOT leather, NOT printed, NOT a bought pauldron. A
          sourcing guide written from photographs alone recommended an Etsy
          leather pauldron; that is the single most wrong thing it is possible
          to buy for this costume. Sharp upswept point at each shoulder, warm
          dark brown, rising at the back into the stand collar.
      - item: Trousers — quilted outer-thigh panels, knee pads
        route: bought
        qty: 1
        status: not-started
        note: >
          EQUESTRIAN JODHPURS OR BREECHES are the real-world match — contrast
          knee patches stitched onto a fabric leg is exactly this construction,
          and riders resell them constantly. Dark warm brown. Panels and
          distressing added in-house afterwards.
      - item: Forearm bracers
        route: made
        qty: 2
        status: not-started
        note: >
          Leather, riveted, buckled. FOREARM ONLY — wrist to below the elbow,
          not continuing up the upper arm. Dark. One of the few places leather
          is correct on this costume.
      - item: Wide belt, buckle and fittings
        route: bought
        qty: 1
        status: not-started
        note: >
          Broad leather belt, plain heavy buckle. Men's belts are often the
          right proportion even on a petite frame. Buckle and fittings printed
          if nothing suitable turns up.
      - item: Belt pouches
        route: bought
        qty: 2
        status: not-started
      - item: Holster — belt-mounted, her RIGHT hip
        route: made
        qty: 1
        status: not-started
        note: >
          Leather, hanging from the belt down the right thigh, grip up and
          angled forward for a right-hand draw. Built around the A180, not
          around a generic pistol.
      - item: A180 blaster pistol
        route: printed
        qty: 1
        status: not-started
        note: >
          The weapon Jyn Erso carries in Rogue One. Reference at
          reference/props/a180.jpg. Two-tone — bright polished steel forward,
          black at the back, six vent holes near the muzzle, fluting part way
          back, mounting rail with a knurled knob, chequered raked grip.
          IT MUST FINISH BRIGHT AND CLEAN. Everything else in this production is
          dulled and distressed; this is the one thing she looks after, and the
          palette rule protects it. Photograph the build and replace the
          third-party reference image.
      - item: Bone horns for the headdress
        route: printed
        qty: 2
        status: not-started
        note: >
          Pale bone, matte, YELLOWED WITH AGE. Never polished, never carved,
          never set in metal — they are trophies from what the akk kills, and a
          worked finish turns them into jewellery and collapses the reading.
          THEY MUST NOT MATCH EACH OTHER: long and sweeping on one side, shorter
          points on the other. This is the printing trap recorded in
          Costume-Build-Method — a printer produces a perfect matched pair by
          default, and a matched pair is a manufactured ornament rather than two
          things taken off two kills.
      - item: Whistle on a cord
        route: printed
        qty: 1
        status: not-started
        note: >
          THE HERO PROP. Small, cheap-looking, much handled, worn at the throat.
          It is her entire command structure — she whistles and the beast comes,
          she whistles and it kills — and it is worth nothing to anybody else.
          A sourcing guide written from the photographs listed it as a "vintage
          keychain fob". It is the most important object she owns.
      - item: Leash — heavy, coiled at her LEFT hip
        route: bought
        qty: 1
        status: not-started
        note: >
          Heavy strap or chain, coiled and hung at the belt on her left, off the
          drawing side. Never in her hand and never on the animal. She is
          carrying restraint she does not need, as a display for the crew.
      - item: Boots — tall, close to the calf
        route: bought
        qty: 1
        status: not-started
        note: >
          Brown leather, flat, practical, genuinely worn. Charity shops are the
          best source and the wear is wanted — do not pay extra for "like new".
          The best boots in the crew, and looked after.

    must_show:
      - >
        THE ANIMAL IS HER RANK, AND SHE MUST NOT READ AS A NATURAL LEADER.
        NO insignia, NO rank badge, NO faction mark, NO medal, NO braid.
        This is the whole design. She commands because she owns a monster and
        everyone knows it — not through seniority, not through tactical skill,
        not through the crew's respect. Whatever authority she projects is on
        loan from the beast. She has bought the SHAPE of an officer because she
        has none of the substance, and the outfit should read as chosen rather
        than earned: a woman dressed as an officer of an army that does not
        exist. If she reads as a person who would be obeyed without the animal,
        the image has failed.
        SHE IS THE SMALLEST PERSON IN ALMOST EVERY SCENE SHE IS IN, and she
        commands anyway. Do not compensate for that. Do not make her taller,
        broader, older or harder-looking to justify the rank — the gap between
        what she is and what she controls IS the character.
      - >
        SKIN-TIGHT THROUGH THE BODY — A SECOND SKIN FROM COLLAR TO ANKLE — WITH
        THE OFFICER LINE CARRIED ONLY IN THE HARD STRUCTURE OVER IT.
        NO FLARE, NO SWING, NO VOLUME, NO GATHERED OR DRAPED FABRIC ANYWHERE.
        NOT a full skirt, NOT a wide coat, NOT robes.
        THE BODY GARMENT follows her exactly — torso, arms and legs — close to
        the skin from the collar down, with no bulk over the ribs, the waist, the
        hips or the limbs. She has to be AGILE and the costume must say so at a
        glance. If fabric hangs away from her anywhere, it is wrong.
        THE COLLAR is stiff and STANDS, closed to the throat — never open, never
        a lapel, never a shawl or a cowl.
        SHE MOVES LIKE AN ACROBAT AND THE COSTUME MUST SAY SO. Cut for a gymnast,
        not a soldier: articulated at the shoulder, elbow, hip and knee, with
        panelled seams and give across every joint. NOTHING restricts her,
        NOTHING is stiff except the mantle, and NOTHING is bulky. She is the
        smallest adult in the film and she is the quickest.
        THE SHOULDER is the mantle — see its own rule below.
        THE WAIST is pulled in HARD by a wide heavy belt over the second skin.
        BELOW THE WAIST, NARROW SPLIT PANELS hang straight and free over the
        skin-tight leg — long, reaching towards the knee or past it, so the
        upright line survives. They are NARROW and they PART COMPLETELY when she
        moves. They never gather, never flare, and never close into a skirt.
        THE BOOTS are tall and close to the calf, the best in the crew, resoled
        and looked after.
        The severity is the point. Everything about the line is closed, upright
        and deliberate, and everything about the condition contradicts it.
        IT IS CUT TO HER AND ONLY TO HER. She is 150 cm, and a garment fitted
        this close cannot be anything but made to measure — which is precisely
        what nobody else in this crew has. It must NEVER look borrowed,
        oversized, or like a child in an adult's clothes. That misreading would
        make her pitiable, and she is not.
        IT IS CLOSE-FITTING FOR MOVEMENT, NOT FOR DISPLAY. No glamour, no posing,
        no fashion-editorial styling, nothing cut to be looked at. It is the
        working kit of a very small person who has to keep up with people twice
        her size, and it is filthy from a forest.
      - >
        A HARD SHOULDER MANTLE — THE SIGNATURE OF THIS COSTUME. MATCH THE COSTUME
        REFERENCE ATTACHED ABOVE.
        IT COMES TO A SHARP UPSWEPT POINT AT EACH SHOULDER — a defined peak
        angling up and out past the shoulder, not a flat slab and not a rounded
        pad. That point is what makes it read.
        IT IS WARM DARK BROWN, the same family as the rest of the costume. NOT
        grey, NOT black, NOT pale.
        A stiff, dark, RIBBED yoke sitting over BOTH shoulders, standing proud of
        the body and reaching out past the shoulder points before angling down
        over the top of the upper arm. It is WIDE — deliberately wider than she
        is — and it comes to a defined point at each shoulder. It rises at the
        back into the stand collar.
        It is STIFFENED CLOTH, not plate and not leather: ribbed, quilted or
        pleated, holding its shape by construction rather than by being armour.
        NOT a pauldron, NOT a spiked guard, NOT a winged shape, NOT a cape, NOT a
        fur collar.
        IT IS THE ONLY THING ON HER WIDER THAN SHE IS, and on a 150 cm frame that
        is the whole point: it is the shape of authority, worn. She had it made.
      - >
        THE HEADDRESS — PALE CURVED BONE HORNS IN SWEPT-UP HAIR.
        COPY IT FROM THE APPROVED TURNAROUNDS ATTACHED — the front and the left
        profile both carry it clearly. The FACE comes from the actor photograph
        and the BODY from the written description: a real woman of 150 cm,
        photographed as a real person, with a HEAD IN NORMAL ADULT PROPORTION to
        her body — never oversized, never a caricature, never a child's
        proportions.
        HER HAIR is long and dark, swept UP AND BACK off the face into a large
        rolled, worked mass held high on the head, with the length falling loose
        behind and to the sides. It is a BUILT shape, not a hairstyle anyone
        maintains daily.
        SET INTO IT, PALE CURVED HORNS — bone or bone-coloured, smooth, tapering
        to points, projecting UP AND OUTWARD from both sides. Long and sweeping
        on one side, shorter points on the other. ASYMMETRIC. They are pale
        against very dark hair and that contrast is the whole effect.
        NOT a helmet, NOT a crown, NOT a circlet, NOT a metal band, NOT a mask,
        NOT a visor. Nothing covers her face or her brow, and nothing is
        engraved, jewelled or polished. The horns are BONE — worn, matte, and
        clearly taken off something that was once alive.
        THE HORNS ARE THE ONLY PALE THING ON HER. Nothing else in this costume is
        bone, cream, ivory, light grey or pale in any way — not the bracers, not
        the leg panels, not the mantle, not the boots. If the pallor of the horns
        has spread anywhere else, the image is WRONG. This happened on
        2026-08-01 and it is the reason this sentence exists.
        THEY ARE TROPHIES FROM WHAT THE ANIMAL KILLS — decided 2026-08-01. Bone
        taken off creatures her akk brought down, worn on her head. This is the
        ONE ornamental thing in her costume and it is deliberate: the single
        decorative object on her is a display of THE BEAST'S power rather than
        her own. They are worn, matte and yellowed with age, never polished,
        never carved, never set in metal. A trophy, not jewellery.
      - >
        MORE CLOTH THAN LEATHER, AND GOOD CLOTH — EXPENSIVE, NEVER SMART.
        THE BODY IS TEXTILE: heavy ribbed knit, quilted panels, dense woven
        canvas — matte, dry, and clearly FABRIC rather than hide. The ribbing on
        the torso and the mantle is visible and structural.
        LEATHER IS THE MINORITY and it is confined to the working parts: the
        belt, the boots, the forearm bracers, the holster. If the costume reads
        as a leather bodysuit, it is WRONG.
        She takes the largest share and it shows in the QUALITY, never in the
        condition. Close tailoring, hardware that works and has been maintained. And then: faded across the shoulders and the crown of the
        coat, mended at the cuffs and the hem, mud to the knee, the collar worn
        shiny where it rubs. NOT clean, NOT pressed, NOT ceremonial, NOT new.
        She has been in a forest for weeks and she fights in these clothes.
        AND IT WAS MADE FOR HER. In a crew wearing dead men's kit and salvage,
        hers is the only outfit in the film that was cut to measure — at her
        size, nothing could be scavenged to fit anyway. Nobody out here has
        anything made. That is what the money actually looks like on her.
      - >
        THE WHISTLE AND THE LEASH — HER TWO INSTRUMENTS OF COMMAND, BOTH FOR THE
        ANIMAL AND NEITHER FOR THE CREW.
        A small worn WHISTLE on a cord at her throat, plainly visible, cheap and
        much handled. It is the most important object she owns: she whistles and
        the beast comes, and she whistles and it kills.
        A HEAVY LEASH — chain or thick strap — COILED AND HUNG AT HER BELT, on
        her LEFT, off the drawing side. She is not holding it and the animal is
        not on it. Carrying restraint she does not need is a display for the
        crew, and it is the difference between commanding an animal and
        controlling a weapon.
      - >
        THE A180 BLASTER PISTOL ON HER RIGHT HIP — THE WEAPON JYN ERSO CARRIES IN
        ROGUE ONE. She is RIGHT-HANDED and it is NEVER on her left.
        Holstered, belt-mounted, grip up and angled forward for a right-hand
        draw. It is a MODULAR weapon — a compact pistol built to be reconfigured
        — and the fittings for that are visible on it: rails and mounting points
        along the top and the fore-end where the other parts attach.
        IT IS TWO-TONE — BRIGHT POLISHED STEEL FORWARD, BLACK AT THE BACK — and
        that is the fastest way to recognise it.
        THE BARREL is LONG and BRIGHT: bare polished metal, with a ROW OF SIX
        ROUND VENT HOLES along its upper side towards the muzzle, a band of fine
        FLUTING part way back, and a stepped muzzle. A flat polished blade runs
        forward underneath it.
        THE RECEIVER is BLACK with bright polished plates, small levers and
        screws on the side, and a MOUNTING RAIL along the top carrying a round
        knurled knob at the rear — that rail is the modular fitting.
        THE GRIP is BLACK and finely CHEQUERED, raked STEEPLY BACK at an angle,
        with a large round-headed screw at the heel. The trigger guard is a big
        open circle.
        NOT a generic sidearm, NOT a revolver, NOT a scratch-built mismatch, NOT
        an antique, NOT ornate, NOT dark all over. It is a manufactured product
        and it looks it — which is precisely why it is hers and not this crew's.
        Unlike everything else in this crew it is CLEAN, SERVICED AND CARED FOR —
        unscratched finish, working hardware, nothing improvised. It is the one
        thing she spends money keeping right, and a modular weapon is an
        expensive weapon: it is the same statement as the made-to-measure
        clothes, in a different material.
        The leash, pouches and tools sit on her LEFT, off the drawing side.
      - >
        TWENTY-EIGHT, AND VERY SMALL — 150 cm, THE SMALLEST ADULT IN THE FILM.
        Slight, fine-boned, and NOT physically imposing in any way: NOT muscular,
        NOT broad, NOT heavy, NOT tall. NOTHING about her body may suggest she
        could win a fight or hold a room by force, because the entire point is
        that she cannot and does not have to.
        She is a young East Asian woman with long dark hair.
        SHE IS COLD, NOT ANGRY. Calm, still, watchful, unsentimental — an
        expression that is assessing you rather than threatening you. She kills a
        man mid-sentence and smiles afterwards, and that must read as
        characteristic rather than theatrical. NO snarl, NO glare, NO scowl, NO
        bared teeth, NO clenched fists, NO aggressive posturing of any kind. She
        controls people by fear and she never has to raise her voice to do it —
        the threat is what everyone already knows about her, not what her face is
        doing.
        NO makeup that reads as makeup, NO glamour, NO styling. She is not
        presented as attractive; she is presented as a person doing a job.
      - >
        MUTED AND DARK, BUT NEVER IMPERIAL GREY AND NEVER BLACK-ON-BLACK.
        Deep browns, dark umber, faded charcoal, oiled hide, the dull warm grey
        of old canvas.
        THE BRACERS, THE LEG PANELS, THE KNEE PADS, THE MANTLE AND THE BOOTS ARE
        ALL DARK WARM BROWN — the same family as everything else she wears. NONE
        of them is bone, cream, ivory or pale grey. They drifted pale on
        2026-08-01 and they must not.
        THE BRACERS ARE FOREARM ONLY — wrist to below the elbow, dark, buckled.
        They do NOT continue up the upper arm.
        TWO EXCEPTIONS AND ONLY TWO. The horns are pale bone. The blaster barrel
        is BRIGHT POLISHED STEEL and must stay bright — do not dull it to match
        her. It is the only gleaming object in this crew, and that is the point:
        everyone else carries salvage, and she carries something she paid for and
        looks after. Nothing else on her is pale and nothing else is bright. NO uniform green, NO uniform grey, NO red, NO gold braid,
        NO faction colour of any kind. She must separate from a night forest and
        from firelight — do not sink her into the background.
