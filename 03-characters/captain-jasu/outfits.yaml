character: Captain Jasu
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# CAST 2026-08-01, and this is a DEPARTURE FROM THE SCRIPT. The screenplay says
# "CAPTAIN JASU (40s), a powerful woman". She is now twenty-eight and 155 cm.
# Recorded in Character.md so nobody rediscovers it as an error.
#
# It makes the design stronger, not weaker. "The animal is her rank" was always
# the central fact; at 5 ft 1 in there is now NOTHING else it could be.
height: >
  155 cm (5 ft 1 in) — VERY SMALL AND SLIGHT, and almost certainly the smallest
  adult in the film. She is TWENTY-EIGHT. NOT imposing, NOT muscular, NOT
  physically dangerous-looking in any way. Baylan stands 43 cm taller than her
  and her own animal outweighs her

do_not_retrieve_short: >
  SHE IS 28 AND 155 cm — SMALL AND SLIGHT, NEVER IMPOSING. Do not make a
  mercenary captain tall, broad, older or physically formidable.
  DO NOT draw an Imperial officer and DO NOT draw a samurai. She has a high
  collar, a hard shoulder and a long coat, and that is where the resemblance
  stops: no Imperial grey, no rank badge, no code cylinders, no peaked military
  cap, no lacquered plate armour, no helmet, no horns, no face mask. She belongs
  to no army and never did.

# THE TWO THINGS THAT WILL RETRIEVE. A high collar plus a hard shoulder plus a
# crest at the brow sits very close to two costumes an image model knows
# extremely well, and both are wrong for opposite reasons.
do_not_retrieve: >
  TWO DEPICTIONS WILL TRY TO ARRIVE HERE AND BOTH ARE WRONG.

  NOT AN IMPERIAL OFFICER. No flat grey-green uniform, no tunic with a rank
  plaque on the chest, no code cylinders at the shoulder, no peaked military cap,
  no jodhpurs, no gleaming jackboots, no insignia of any kind. She commands eight
  people and a dog. There is no empire behind her and nothing she wears may imply
  one.

  NOT A SAMURAI, AND NOT A JEDI. No lacquered lamellar plate, no laced armour
  panels, no wide flaring shoulder guards, no horned or winged helmet, no face
  mask, no mempo, no topknot, no robes, no sash-wrapped front, no sword. The man
  standing beside her in the finale is a Jedi hiding as a mercenary, and his
  entire design depends on nobody in frame reading as one.

  AND SHE IS NOT PHYSICALLY IMPOSING. She is twenty-eight years old, 155 cm,
  slight and fine-boned — the smallest adult in the film, and her own animal
  outweighs her. The word "captain" will pull you toward someone tall, broad and
  weathered. Refuse it. She is obeyed because of the beast at her side and for no
  other reason, and an image that makes her physically formidable has destroyed
  the only idea in the design.

  WHAT IS TRUE INSTEAD: she has bought the SHAPE of authority — a closed high
  collar, a square shoulder, a long coat and a cinched waist — because she has
  none of the real thing. It is well made and it has been in a forest for weeks.
  Battered, faded, mended, and worn by somebody who fights in it.

outfits:
  - id: field
    name: Field dress
    # The production's own early concept drawing, added 2026-08-01. The shoulder
    # mantle is the signature of this costume and prose was never going to land
    # it — attach the sketch and let it carry the shape.
    # APPROVED 2026-08-01. See 03-characters/APPROVAL.md. Clear this to unlock.
    # The front turnaround is right — mantle, palette, bracers, leg panels and
    # the horns all landed together — so the remaining four views are now matched
    # against the photograph instead of re-derived from the paragraph.
    approved:
      date: "2026-08-01"
      view: front
      reference: 03-characters/captain-jasu/source/artwork/turn-field-front.png
      note: "Front view locked. Match this for all other views"

    references:
      # The interim costume plate at reference/costume/ is superseded by the
      # approved front above and has been removed — two costume references would
      # have disagreed with each other eventually.
      # DETACHED 2026-08-03, for the same reason as the figure photographs above.
      # The production's own early concept drawing, added 2026-08-01, and it did
      # its job: the mantle is the signature of this costume and prose was never
      # going to land it.
      #
      # Its declared scope was "the shoulder mantle, the ribbed torso and the leg
      # panels", and the approved turnarounds now carry all three photoreal from
      # five angles — including the quilted outer-thigh panels and the ribbed
      # knee pads, which read more clearly there than in the drawing.
      #
      # THREE REASONS IT IS NOW A LIABILITY:
      #
      # 1. IT IS A PENCIL DRAWING. Every prompt in this pack opens by insisting
      #    the image is a photograph and not an illustration. Attaching a drawing
      #    to that instruction is a contradiction the written rules have to fight.
      # 2. THE PROPORTIONS ARE STYLISED — long-legged, small-headed, drawn the way
      #    costume illustration is always drawn. She is 155 cm and slight. This is
      #    the Funko problem in the opposite direction.
      # 3. IT CONTAINS A SUPERSEDED DESIGN. One study on the sheet has a BARE
      #    MIDRIFF, and the costume is now a second skin from collar to ankle with
      #    no volume anywhere. A reference with no scope teaches everything in it,
      #    including the parts that are no longer true.
      #
      # The approved front outranks it by definition — that is what approval means.
      # Kept on disk as history. Do not attach it to anything.
      # - path: reference/concept/jasu-concept-sketch.jpg
      #   what: the shoulder mantle, the ribbed torso and the leg panels
      # DETACHED 2026-08-03. A painted figure built from the concept drawings on
      # 2026-08-01, and for two days the only three-dimensional record of the
      # headdress and the hair — which is exactly what a drawing cannot hold.
      #
      # The approved turnarounds now hold all of it, photoreal and on the right
      # actor: the pale bone horns, their curve, how they sit set into swept-back
      # dark hair above and behind the ear, and the profile read. There is
      # nothing left that only the figure carries.
      #
      # And it is a FUNKO POP — a stylised toy with a 1:1 HEAD-TO-BODY RATIO,
      # black dot eyes, a flat featureless face, painted brows, photographed on a
      # kitchen table with a drink and a speaker in shot. Every one of those is
      # something a photoreal prompt must not learn.
      #
      # The head proportion is the dangerous one, and it is dangerous for HER
      # specifically. This character's whole design rests on reading as VERY
      # SMALL and slight — 155 cm, the smallest adult in the film. An oversized
      # head is how a small figure turns into a child or a caricature, which
      # undoes the one thing her documents work hardest to establish.
      #
      # Kept on disk as history, like the superseded costume fronts. Do not
      # attach them to anything.
      # - path: reference/build/jasu-figure-front.jpg
      #   what: the headdress and hair, front
      # - path: reference/build/jasu-figure-side.jpg
      #   what: the headdress and hair, profile
      # Her blaster is the A180 — the weapon Jyn Erso carries in Rogue One.
      # Supplied by the production 2026-08-01, after four generations returned a
      # generic pistol from the name alone. It is a third-party image of the
      # weapon rather than a photograph of OUR build; when the prop is made,
      # replace it with a photograph of that, per the rule Shada's WESTAR-35
      # established.
      - path: reference/props/a180.jpg
        what: the A180 blaster pistol
    scenes: "9, 19, 20, 23, 24, 25 — her only costume. The akk dog is wherever she is"
    description: >
      The only coherent, deliberately assembled outfit in this crew, and that is
      the point of it, on a woman of twenty-eight who stands 155 cm and is the
      smallest adult in the film. The garment is a SECOND SKIN in heavy ribbed
      knit and dense woven cloth, close to the body from the throat all the way
      down — torso, arms and legs — with no volume anywhere on her, cut and
      articulated for an acrobat. Over the shoulders, a stiff dark RIBBED MANTLE
      standing proud of the body and reaching out past the shoulder points before
      angling down over the upper arm, rising at the back into a stand collar
      closed at the throat. A wide heavy belt with plain working hardware pulls
      the waist in hard. Below it, narrow split panels hang straight over the
      skin-tight leg, and there are textured panels down the outer thigh and over
      the knee. Hard bracers on the forearms. Tall boots close to the calf, flat
      and practical, the best in the crew. Nothing on her head at all. At her brow a low ornate
      band, asymmetric, carrying a small worn crest to one side — the only
      decorative object on her and clearly something she chose rather than
      earned. On her right hip a holstered blaster pistol, clean and serviced. A
      worn whistle on a cord at her throat, and a heavy leash coiled at her belt.
      Everything is good material and everything is battered: faded across the
      shoulders, mended at the cuffs, mud to the knee. Nothing about her is
      insignia, and nothing about her was issued.
    # THE BUILD. Split out of a sourcing guide on 2026-08-01. Routes follow
    # 11-production-tracking/Costume-Build-Method.md: bought / printed / made.
    #
    # SUPPLIER LINKS AND PRICES ARE DELIBERATELY NOT HERE. They live in the
    # production's Drive, because they rot — a shop closes, a listing sells, a
    # price doubles, and a repository full of dead links is worse than none
    # because somebody trusts it. What is durable is the material, the
    # construction and the things it must not be. That is what is recorded here.
    components:
      - item: Ribbed base top — mock neck, stand collar, front closure
        route: bought
        qty: 1
        status: not-started
        note: >
          Heavy ribbed knit, dark warm brown. Search by CONSTRUCTION, not by
          look — "ribbed mock neck", "ribbed base layer", "ribbed zip
          turtleneck". MUST BE ALTERED TO FIT HER EXACTLY once found. At 155 cm
          nothing off the peg fits, and "looks thrifted" is the one thing this
          costume cannot look.
      - item: Shoulder mantle
        route: made
        qty: 1
        status: not-started
        note: >
          STIFFENED CLOTH — ribbed, quilted or pleated, holding its shape by
          construction. NOT leather, NOT printed, NOT a bought pauldron. A
          sourcing guide written from photographs alone recommended an Etsy
          leather pauldron; that is the single most wrong thing it is possible
          to buy for this costume. Sharp upswept point at each shoulder, warm
          dark brown, rising at the back into the stand collar.
      - item: Trousers — quilted outer-thigh panels, knee pads
        route: bought
        qty: 1
        status: not-started
        note: >
          EQUESTRIAN JODHPURS OR BREECHES are the real-world match — contrast
          knee patches stitched onto a fabric leg is exactly this construction,
          and riders resell them constantly. Dark warm brown. Panels and
          distressing added in-house afterwards.
      - item: Forearm bracers
        route: made
        qty: 2
        status: not-started
        note: >
          Leather, riveted, buckled. FOREARM ONLY — wrist to below the elbow,
          not continuing up the upper arm. Dark. One of the few places leather
          is correct on this costume.
      - item: Wide belt, buckle and fittings
        route: bought
        qty: 1
        status: not-started
        note: >
          Broad leather belt, plain heavy buckle. Men's belts are often the
          right proportion even on a petite frame. Buckle and fittings printed
          if nothing suitable turns up.
      - item: Belt pouches
        route: bought
        qty: 2
        status: not-started
      - item: Holster — belt-mounted, her RIGHT hip
        route: made
        qty: 1
        status: not-started
        note: >
          Leather, hanging from the belt down the right thigh, grip up and
          angled forward for a right-hand draw. Built around the A180, not
          around a generic pistol.
      - item: A180 blaster pistol
        route: printed
        qty: 1
        status: not-started
        note: >
          The weapon Jyn Erso carries in Rogue One. Reference at
          reference/props/a180.jpg. Two-tone — bright polished steel forward,
          black at the back, six vent holes near the muzzle, fluting part way
          back, mounting rail with a knurled knob, chequered raked grip.
          IT MUST FINISH BRIGHT AND CLEAN. Everything else in this production is
          dulled and distressed; this is the one thing she looks after, and the
          palette rule protects it. Photograph the build and replace the
          third-party reference image.
      - item: Bone horns for the headdress
        route: printed
        qty: 2
        status: not-started
        note: >
          Pale bone, matte, YELLOWED WITH AGE. Never polished, never carved,
          never set in metal — they are trophies from what the akk kills, and a
          worked finish turns them into jewellery and collapses the reading.
          THEY MUST NOT MATCH EACH OTHER: long and sweeping on one side, shorter
          points on the other. This is the printing trap recorded in
          Costume-Build-Method — a printer produces a perfect matched pair by
          default, and a matched pair is a manufactured ornament rather than two
          things taken off two kills.
      - item: Whistle on a cord
        route: printed
        qty: 1
        status: not-started
        note: >
          THE HERO PROP. Small, cheap-looking, much handled, worn at the throat.
          It is her entire command structure — she whistles and the beast comes,
          she whistles and it kills — and it is worth nothing to anybody else.
          A sourcing guide written from the photographs listed it as a "vintage
          keychain fob". It is the most important object she owns.
          THERE IS EXACTLY ONE, AND IT IS AT HER THROAT. Qty 1, and the belt
          carries no second whistle — a generated test on 2026-08-03 came back
          wearing two, and two makes it an ornament instead of an instrument.
      - item: Leash — heavy, coiled at her LEFT hip
        route: bought
        qty: 1
        status: not-started
        note: >
          Heavy strap or chain, coiled and hung at the belt on her left, off the
          drawing side. Never in her hand and never on the animal. She is
          carrying restraint she does not need, as a display for the crew.
      - item: Boots — tall, close to the calf
        route: bought
        qty: 1
        status: not-started
        note: >
          Brown leather, practical, genuinely worn. Charity shops are the best
          source and the wear is wanted — do not pay extra for "like new".
          The best boots in the crew, and looked after.
          TALL — the shaft rises well up the calf and ends below the knee.
          Confirmed against a generated A/B on 2026-08-03; the tall shaft is the
          decision and the ankle boot in the earlier reference is superseded.
          HEEL: FLAT, or as near flat as a sourced boot allows — a walking sole,
          no more than about 25 mm. A heeled riding or fashion boot is the
          easiest thing to find in this shape and it is the wrong one. If a
          candidate boot is right in every other way, RE-HEEL IT rather than
          accept the heel; that is a cobbler's job and it is cheaper than the
          boot. Nothing about her costume may add height.

    # RESTRUCTURED 2026-08-03 — fix 2 from `Prompt-Reliability-TODO.md`, applied
    # to her the way it was applied to Shada on 2026-08-02.
    #
    # NINE RULES BECAME TWENTY-SIX, and the specification did not change. The
    # nine were prose: rule 2 alone carried the body garment, the collar, the
    # agility, the belt, the split panels, the boots, the made-to-measure line
    # and the not-for-display line in one 2,166-character block, so only its
    # first sentence and its first negation ever reached a generator. The
    # collar, the boots and "they never close into a skirt" were all being
    # dropped — the last of those is the exact fault that cost Shada her fifth
    # generation.
    #
    # HOW `trim()` ACTUALLY WORKS, and therefore how to write these:
    #   1. Sentence one ALWAYS survives. Put the constraint there, not the
    #      subject — "THE COLLAR IS STIFF AND STANDS", not "THE COLLAR".
    #   2. The first sentence after it carrying NOT/NEVER/NO/NOTHING/ONLY/
    #      ALWAYS/MUST also always survives. Make sentence two a prohibition.
    #   3. Everything after that competes on LENGTH. Short sentences win.
    # One rule per enforceable thing. If a rule covers two objects, only one of
    # them is protected. KEEP EVERY RULE UNDER ~250 CHARACTERS — that is the cap
    # the budget settles on, and a rule under it is never trimmed at all.
    #
    # THE REASONING IS NOT HERE ANY MORE, and it is not lost — it is in
    # `Character.md`, which is where a human reads it. A generator does not need
    # to be persuaded, and every character of persuasion displaces a constraint.
    #
    # The A180's barrel, receiver and grip detail moved to slot 9 in
    # `Prompts.md`. It is unreadable in a full-length figure and was spending
    # ~700 characters in all 21 prompts to be legible in one. Same argument as
    # fix 9.
    must_show:
      - pin: true
        text: >
          SHE IS 155 cm AND THE SMALLEST ADULT IN THE FILM, AND NOTHING
          COMPENSATES FOR IT.
          NEVER make her taller, broader, older or harder-looking to justify the
          rank.
          Slight and fine-boned: NOT muscular, NOT broad, NOT heavy, NOT tall.
      - pin: true
        text: >
          HER HEAD IS IN NORMAL ADULT PROPORTION TO HER BODY.
          NEVER oversized, NEVER a caricature, NEVER a child's proportions.
          The FACE comes from the actor photograph and the BODY from this
          description.
          A young East Asian woman with long dark hair.
      - >
        THE ANIMAL IS HER RANK.
        NO insignia, NO rank badge, NO faction mark, NO medal, NO braid.
        If she reads as a person who would be obeyed without the animal, the
        image has failed.
      - >
        THE BODY GARMENT IS SKIN-TIGHT FROM COLLAR TO ANKLE — A SECOND SKIN,
        WITH NO BULK OVER THE RIBS, THE WAIST, THE HIPS OR THE LIMBS.
        NO flare, NO swing, NO volume, NO gathered or draped fabric anywhere,
        and NOT a full skirt, NOT a wide coat, NOT robes.
      - >
        THE COLLAR IS STIFF AND STANDS, CLOSED TO THE THROAT.
        NEVER open, NEVER a lapel, NEVER a shawl, NEVER a cowl.
      - >
        THE WAIST IS PULLED IN HARD BY A WIDE HEAVY BELT over the second skin.
        The holster is belt-mounted on her RIGHT.
        The leash, the pouches and the tools sit on her LEFT, off the drawing
        side.
      # THE HANGING SPLIT PANELS WERE DELETED 2026-08-03, by the Production
      # Designer. They were the "long skirted coat" of the officer reference,
      # split into strips so the silhouette would not read as a skirt — and they
      # existed ONLY here. There was never a component for them, and the
      # approved front has never shown them. Two records of three already agreed
      # they were not in the costume; this one had not caught up.
      #
      # They were also the most samurai-adjacent element she had, and
      # `Character.md` names samurai as the retrieval to block hardest because
      # Baylan stands beside her in Sc.25.
      #
      # BELOW THE WAIST SHE IS SKIN-TIGHT TROUSERS with quilted outer-thigh
      # panels stitched flat to the leg, and knee pads. Nothing hangs, nothing
      # swings, nothing parts.
      - >
        BELOW THE WAIST SHE IS SKIN-TIGHT TROUSERS with quilted outer-thigh
        panels stitched FLAT to the leg, and knee pads.
        NOTHING hangs from the belt, NOTHING swings, and there is NO skirt, NO
        tabard, NO hanging panel and NO coat tail of any kind.
      # THE TALL BOOTS WON THE A/B, 2026-08-03 — see `evolution/`. This wording
      # is variant A's, adopted verbatim because it is the version that actually
      # produced them against a reference photograph showing ankle boots.
      - >
        THE BOOTS ARE TALL AND CLOSE TO THE CALF — the shaft rises well up the
        calf, close-fitting, ending below the knee.
        They are NOT ankle boots, NOT low, NOT pale and NOT ornamented.
      # Added after the A/B came back in heeled boots. The component note has
      # said "flat" since 2026-08-01 and a build note cannot reach a generator.
      - >
        THE BOOT HEEL IS FLAT, OR AS NEAR FLAT AS THE BOOT ALLOWS — a walking
        sole, no more than about 25 mm at the heel.
        NEVER a block heel, NEVER a shaped or raised heel, and NEVER anything
        that adds height to her.
      - >
        CUT FOR A GYMNAST, NOT A SOLDIER — SHE MOVES LIKE AN ACROBAT AND THE
        COSTUME MUST SAY SO.
        NOTHING restricts her and NOTHING is bulky.
        Articulated at the shoulder, the elbow, the hip and the knee, with
        panelled seams and give across every joint.
      - >
        IT IS CUT TO HER AND ONLY TO HER — MADE TO MEASURE.
        It must NEVER look borrowed, oversized, or like a child in adult
        clothes.
      - >
        A HARD SHOULDER MANTLE OF STIFFENED CLOTH, COMING TO A SHARP UPSWEPT
        POINT AT EACH SHOULDER — THE SIGNATURE OF THIS COSTUME.
        NOT a pauldron, NOT a spiked guard, NOT a winged shape, NOT a cape, NOT
        a fur collar, NOT a flat slab.
      - >
        A STIFF RIBBED YOKE OVER BOTH SHOULDERS, STANDING PROUD OF THE BODY and
        reaching out past the shoulder points before angling down over the top
        of the upper arm.
        It is the ONLY thing on her wider than she is.
        It rises at the back into the stand collar.
      - >
        HER HAIR IS SWEPT UP AND BACK OFF THE FACE INTO A LARGE ROLLED, WORKED
        MASS HELD HIGH ON THE HEAD, the length falling loose behind and to the
        sides.
        It is NEVER down and NEVER loose at the front — a BUILT shape, not a
        hairstyle anyone maintains daily.
      - >
        SET INTO THE HAIR, PALE CURVED BONE HORNS PROJECTING UP AND OUTWARD FROM
        BOTH SIDES — ASYMMETRIC, long on one side, shorter points on the other.
        NOT a helmet, NOT a crown, NOT a circlet, NOT a metal band, NOT a mask,
        NOT a visor.
      - >
        THE HORNS ARE BONE — WORN, MATTE AND YELLOWED, taken off something that
        was once alive.
        NEVER polished, NEVER carved, NEVER set in metal, NEVER jewelled.
        Smooth, and tapering to points.
      - >
        THE BODY IS TEXTILE, NOT LEATHER — heavy ribbed knit, quilted panels,
        dense woven canvas, matte and dry.
        If the costume reads as a leather bodysuit, it is WRONG.
        Leather is the MINORITY: the belt, the boots, the forearm bracers, the
        holster.
      - >
        THE CLOTH IS EXPENSIVE AND IT IS FILTHY — THE QUALITY IS IN THE CUT,
        NEVER IN THE CONDITION.
        NOT clean, NOT pressed, NOT ceremonial, NOT new.
        Faded at the shoulders, mended at cuffs and hem, mud to the knee, the
        collar worn shiny.
      # EXACTLY ONE. The A/B came back with two — one correctly at her throat
      # from this rule, and one still at her belt, carried over from the
      # approved photograph. Adding the throat whistle did not remove the belt
      # one, because nothing said there was only ever a single whistle.
      - >
        EXACTLY ONE WHISTLE, ON A CORD AT HER THROAT, PLAINLY VISIBLE.
        There is NEVER a second whistle, and NOTHING resembling a whistle hangs
        from her belt.
        NOT ornamental and NOT jewellery — cheap, plain and much handled.
      - >
        A HEAVY LEASH — CHAIN OR THICK STRAP — COILED AND HUNG AT HER BELT ON
        HER LEFT.
        She is NEVER holding it and the animal is NEVER on it.
      - >
        THE A180 BLASTER PISTOL — THE WEAPON JYN ERSO CARRIES IN ROGUE ONE —
        HOLSTERED ON HER RIGHT HIP, TWO-TONE: BRIGHT POLISHED STEEL FORWARD,
        BLACK AT THE BACK.
        She is RIGHT-HANDED and it is NEVER on her left.
        Grip up and angled forward for a right-hand draw.
      - >
        THE A180 IS CLEAN, SERVICED AND CARED FOR — the only maintained object
        in this crew.
        NOT a generic sidearm, NOT a revolver, NOT a scratch-built mismatch, NOT
        an antique, NOT ornate, NOT dark all over.
      - >
        SHE IS COLD, NOT ANGRY.
        NO snarl, NO glare, NO scowl, NO bared teeth, NO clenched fists, NO
        aggressive posturing of any kind.
        Calm, still, watchful and unsentimental — assessing you rather than
        threatening you.
      - >
        NO MAKEUP THAT READS AS MAKEUP, NO GLAMOUR, NO STYLING.
        She is not presented as attractive; she is presented as a person doing a
        job.
      - >
        MUTED AND DARK — DEEP BROWN, DARK UMBER, FADED CHARCOAL, OILED HIDE, THE
        DULL WARM GREY OF OLD CANVAS.
        NEVER imperial grey, NEVER black-on-black, NO uniform green, NO red, NO
        gold braid, NO faction colour.
      # Its own rule from 2026-08-03: it is a legibility instruction, not a
      # palette one, and as the tail of the palette rule it was being dropped.
      - >
        SHE MUST SEPARATE FROM A NIGHT FOREST AND FROM FIRELIGHT.
        Do NOT sink her into the background.
      - >
        THE BRACERS, THE LEG PANELS, THE KNEE PADS, THE MANTLE AND THE BOOTS ARE
        ALL DARK WARM BROWN.
        NEVER bone, NEVER cream, NEVER ivory, NEVER pale grey.
        THE BRACERS ARE FOREARM ONLY — wrist to below the elbow, dark, buckled.
        They do NOT continue up the upper arm.
      - >
        TWO PALE OR BRIGHT THINGS AND ONLY TWO — THE BONE HORNS AND THE BLASTER
        BARREL.
        NOTHING else on her is pale and NOTHING else is bright.
        Do not dull the barrel to match her.
