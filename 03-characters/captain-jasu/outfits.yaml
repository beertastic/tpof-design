character: Captain Jasu
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# CAST 2026-08-01, and this is a DEPARTURE FROM THE SCRIPT. The screenplay says
# "CAPTAIN JASU (40s), a powerful woman". She is now twenty-eight and 155 cm.
# Recorded in Character.md so nobody rediscovers it as an error.
#
# It makes the design stronger, not weaker. "The animal is her rank" was always
# the central fact; at 5 ft 1 in there is now NOTHING else it could be.
height: >
  155 cm (5 ft 1 in) — VERY SMALL AND SLIGHT, and almost certainly the smallest
  adult in the film. She is TWENTY-EIGHT. NOT imposing, NOT muscular, NOT
  physically dangerous-looking in any way. Baylan stands 43 cm taller than her
  and her own animal outweighs her

do_not_retrieve_short: >
  SHE IS 28 AND 155 cm — SMALL AND SLIGHT, NEVER IMPOSING. Do not make a
  mercenary captain tall, broad, older or physically formidable.
  DO NOT draw an Imperial officer and DO NOT draw a samurai. She has a high
  collar, a hard shoulder and a long coat, and that is where the resemblance
  stops: no Imperial grey, no rank badge, no code cylinders, no peaked military
  cap, no lacquered plate armour, no helmet, no horns, no face mask. She belongs
  to no army and never did.

# THE TWO THINGS THAT WILL RETRIEVE. A high collar plus a hard shoulder plus a
# crest at the brow sits very close to two costumes an image model knows
# extremely well, and both are wrong for opposite reasons.
do_not_retrieve: >
  TWO DEPICTIONS WILL TRY TO ARRIVE HERE AND BOTH ARE WRONG.

  NOT AN IMPERIAL OFFICER. No flat grey-green uniform, no tunic with a rank
  plaque on the chest, no code cylinders at the shoulder, no peaked military cap,
  no jodhpurs, no gleaming jackboots, no insignia of any kind. She commands eight
  people and a dog. There is no empire behind her and nothing she wears may imply
  one.

  NOT A SAMURAI, AND NOT A JEDI. No lacquered lamellar plate, no laced armour
  panels, no wide flaring shoulder guards, no horned or winged helmet, no face
  mask, no mempo, no topknot, no robes, no sash-wrapped front, no sword. The man
  standing beside her in the finale is a Jedi hiding as a mercenary, and his
  entire design depends on nobody in frame reading as one.

  AND SHE IS NOT PHYSICALLY IMPOSING. She is twenty-eight years old, 155 cm,
  slight and fine-boned — the smallest adult in the film, and her own animal
  outweighs her. The word "captain" will pull you toward someone tall, broad and
  weathered. Refuse it. She is obeyed because of the beast at her side and for no
  other reason, and an image that makes her physically formidable has destroyed
  the only idea in the design.

  WHAT IS TRUE INSTEAD: she has bought the SHAPE of authority — a closed high
  collar, a square shoulder, a long coat and a cinched waist — because she has
  none of the real thing. It is well made and it has been in a forest for weeks.
  Battered, faded, mended, and worn by somebody who fights in it.

outfits:
  - id: field
    name: Field dress
    # RE-APPROVED 2026-08-03, replacing the 2026-08-01 front. Same file path,
    # new image. See 03-characters/APPROVAL.md. Clear this block to unlock.
    #
    # The first approval was sound about what it covered — the mantle, the
    # palette, the bracers, the leg panels and the horns all landed together and
    # all five are unchanged here. It could not cover the three rules that were
    # never reaching the generator: the boots, the whistle and, as it turned out,
    # a hair rule that was itself wrong.
    #
    # This front carries all of them. TALL BOOTS with a low heel, EXACTLY ONE
    # WHISTLE at the throat, and HAIR WORN DOWN. Four generated passes to get
    # here, recorded in evolution/ with the previous approved front kept as
    # 00-first-approved-2026-08-01.png.
    approved:
      date: "2026-08-03"
      view: front
      reference: 03-characters/captain-jasu/source/artwork/turn-field-front.png
      note: >
        Front view locked, v2. Match this for all other views. Supersedes the
        2026-08-01 front, which showed ankle boots, a whistle at the belt and
        hair that no longer matches the rule. Do not attach the superseded
        image to anything — it is kept only as history in evolution/.

    references:
      # The interim costume plate at reference/costume/ is superseded by the
      # approved front above and has been removed — two costume references would
      # have disagreed with each other eventually.
      # DETACHED 2026-08-03, for the same reason as the figure photographs above.
      # The production's own early concept drawing, added 2026-08-01, and it did
      # its job: the mantle is the signature of this costume and prose was never
      # going to land it.
      #
      # Its declared scope was "the shoulder mantle, the ribbed torso and the leg
      # panels", and the approved turnarounds now carry all three photoreal from
      # five angles — including the quilted outer-thigh panels and the ribbed
      # knee pads, which read more clearly there than in the drawing.
      #
      # THREE REASONS IT IS NOW A LIABILITY:
      #
      # 1. IT IS A PENCIL DRAWING. Every prompt in this pack opens by insisting
      #    the image is a photograph and not an illustration. Attaching a drawing
      #    to that instruction is a contradiction the written rules have to fight.
      # 2. THE PROPORTIONS ARE STYLISED — long-legged, small-headed, drawn the way
      #    costume illustration is always drawn. She is 155 cm and slight. This is
      #    the Funko problem in the opposite direction.
      # 3. IT CONTAINS A SUPERSEDED DESIGN. One study on the sheet has a BARE
      #    MIDRIFF, and the costume is now a second skin from collar to ankle with
      #    no volume anywhere. A reference with no scope teaches everything in it,
      #    including the parts that are no longer true.
      #
      # The approved front outranks it by definition — that is what approval means.
      # Kept on disk as history. Do not attach it to anything.
      # - path: reference/concept/jasu-concept-sketch.jpg
      #   what: the shoulder mantle, the ribbed torso and the leg panels
      # DETACHED 2026-08-03. A painted figure built from the concept drawings on
      # 2026-08-01, and for two days the only three-dimensional record of the
      # headdress and the hair — which is exactly what a drawing cannot hold.
      #
      # The approved turnarounds now hold all of it, photoreal and on the right
      # actor: the pale bone horns, their curve, how they sit set into swept-back
      # dark hair above and behind the ear, and the profile read. There is
      # nothing left that only the figure carries.
      #
      # And it is a FUNKO POP — a stylised toy with a 1:1 HEAD-TO-BODY RATIO,
      # black dot eyes, a flat featureless face, painted brows, photographed on a
      # kitchen table with a drink and a speaker in shot. Every one of those is
      # something a photoreal prompt must not learn.
      #
      # The head proportion is the dangerous one, and it is dangerous for HER
      # specifically. This character's whole design rests on reading as VERY
      # SMALL and slight — 155 cm, the smallest adult in the film. An oversized
      # head is how a small figure turns into a child or a caricature, which
      # undoes the one thing her documents work hardest to establish.
      #
      # Kept on disk as history, like the superseded costume fronts. Do not
      # attach them to anything.
      # - path: reference/build/jasu-figure-front.jpg
      #   what: the headdress and hair, front
      # - path: reference/build/jasu-figure-side.jpg
      #   what: the headdress and hair, profile
      # Her blaster is the A180 — the weapon Jyn Erso carries in Rogue One.
      # Supplied by the production 2026-08-01, after four generations returned a
      # generic pistol from the name alone. It is a third-party image of the
      # weapon rather than a photograph of OUR build; when the prop is made,
      # replace it with a photograph of that, per the rule Shada's WESTAR-35
      # established.
      - path: reference/props/a180.jpg
        what: the A180 blaster pistol
    scenes: "9, 19, 20, 23, 24, 25 — her only costume. The akk dog is wherever she is"
    # REWRITTEN 2026-08-03. It had drifted badly and `description` OUTRANKS
    # must_show in the built prompt, so it was quietly fighting the rules:
    #   - "narrow split panels hang straight over the skin-tight leg" — a garment
    #     deleted from the design earlier the same day
    #   - "a stiff dark RIBBED MANTLE" — the ribbing belongs to the base top
    #   - "Nothing on her head at all. At her brow a low ornate band … a small
    #     worn crest" — the superseded headdress, contradicting itself in
    #     consecutive sentences, and years out of date against the bone horns
    # short.py's own warning caught the first of those. The other two it could
    # not see, because nothing forbids a word that is merely stale.
    description: >
      The only coherent, deliberately assembled outfit in this crew, and that is
      the point of it, on a woman of twenty-eight who stands 155 cm and is the
      smallest adult in the film. The garment is a SECOND SKIN in heavy ribbed
      knit and dense woven cloth, close to the body from the throat all the way
      down — torso, arms and legs — with no volume anywhere on her, cut and
      articulated for an acrobat. Over the shoulders, a stiff dark MANTLE
      standing proud of the body and reaching out past the shoulder points
      before angling down over the upper arm, rising at the back into a stand
      collar closed at the throat; its surface is undecorated and carries only
      the irregular crazing of a well-kept thing that has had a hard few years.
      A wide heavy belt with plain working hardware pulls the waist in hard.
      Below it, skin-tight trousers with quilted panels down the outer thigh and
      pads over the knee — nothing hangs from the belt and nothing swings. Hard
      bracers on the forearms. Tall boots close to the calf, flat-heeled and
      practical, the best in the crew. Her long dark hair is worn down and
      loose, swept back off the face, with TWO PALE CURVED BONE HORNS set into it
      above and behind the ears, one each side, each a third to a half the
      height of her head — alike but not identical, worn and matte, the only
      decorative object on her and a trophy rather than jewellery. On her right
      hip a holstered blaster pistol, clean and serviced. A single worn whistle
      on a cord at her throat, and a heavy leash coiled at her belt on the left.
      Everything is good material and everything is battered: faded across the
      shoulders, mended at the cuffs, mud to the knee. Nothing about her is
      insignia, and nothing about her was issued.
    components:
      - item: Ribbed base top — mock neck, stand collar, front closure
        route: bought
        qty: 1
        status: not-started
        shop:
          search:
            - ribbed mock neck
            - ribbed base layer
            - ribbed zip turtleneck
            - merino base layer half zip
          where: >-
            Vinted and eBay. Ski and thermal base layers and dancewear all turn
            up constantly secondhand with the right ribbed texture — search the
            sportswear categories, not the fashion ones.
          filter: UK 4–6 / XS. Add "Petite" where the filter exists.
          spec: Heavy ribbed knit, dark warm brown.
          avoid: >-
            SEARCH BY CONSTRUCTION, NOT BY LOOK. A "Star Wars" or "cosplay"
            search returns costume-shop knitwear that photographs as plastic.
            Do not reject a garment for being too big — this one MUST be
            altered to fit her exactly, and buying it already fitted is the
            mistake.
          budget: "£3–8"
        images:
          - src: 03-characters/captain-jasu/source/artwork/material_cloth.png
            crop: [0.0, 0.0, 0.44, 1.0]
            caption: >-
              THE TEXTURE TO MATCH. Fine, dense vertical ribbing — closer to a
              thermal base layer than to a chunky jumper. If the ribs are wide
              enough to count across the chest, it is too coarse.
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.30, 0.15, 0.70, 0.42]
            caption: >-
              How it sits — high mock neck, close to the body, sleeves to the
              wrist under the bracers.
        note: >
          Heavy ribbed knit, dark warm brown. Search by CONSTRUCTION, not by
          look — "ribbed mock neck", "ribbed base layer", "ribbed zip
          turtleneck". MUST BE ALTERED TO FIT HER EXACTLY once found. At 155 cm
          nothing off the peg fits, and "looks thrifted" is the one thing this
          costume cannot look.
      - item: Shoulder mantle
        route: made
        qty: 1
        status: not-started
        build:
          size: >-
            Covers both shoulders and the upper chest, rising at the back into
            the stand collar. A sharp upswept point at each shoulder, clearing
            the shoulder line by ~40 to 60 mm. Scale it off HER, not off a
            pattern — at 155 cm a mantle drafted to a standard block swamps the
            figure and reads as armour she is borrowing.
          colour: Warm dark brown
          hex: "#4a3a2c"
          finish: >-
            Fabric, not a finish — the surface must be irregular crazing and
            wear, heavier at the shoulder fold. NOT a regular diamond quilt and
            NOT a lattice; both have come back from generators and both are
            wrong.
          method: >-
            STIFFENED CLOTH — ribbed, quilted or pleated, holding its shape by
            construction rather than by material. Interface or pad it from the
            inside. NOT leather, NOT printed, NOT a bought pauldron: a sourcing
            guide written from photographs alone recommended an Etsy leather
            pauldron, and that is the single most wrong thing it is possible to
            buy for this costume.
        images:
          - src: 03-characters/captain-jasu/source/artwork/mantle_detail.png
            caption: >-
              THE AUTHORITY ON THIS SURFACE. Irregular crazing and wear,
              heavier at the shoulder fold — not a regular diamond quilt and
              not a lattice, both of which have come back from generators and
              are wrong.
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.26, 0.14, 0.74, 0.34]
            caption: >-
              The silhouette — a sharp upswept point at each shoulder, rising
              at the back into the stand collar.
        note: >
          STIFFENED CLOTH — ribbed, quilted or pleated, holding its shape by
          construction. NOT leather, NOT printed, NOT a bought pauldron. A
          sourcing guide written from photographs alone recommended an Etsy
          leather pauldron; that is the single most wrong thing it is possible
          to buy for this costume. Sharp upswept point at each shoulder, warm
          dark brown, rising at the back into the stand collar.
      - item: Trousers — quilted outer-thigh panels, knee pads
        route: bought
        qty: 1
        status: not-started
        shop:
          search:
            - equestrian jodhpurs
            - riding breeches knee patch
            - jodhpurs brown
            - full seat breeches
          where: >-
            Vinted and eBay, equestrian categories. Riders resell these
            constantly and in quantity. This is the one genuinely good idea
            that survived the superseded sourcing guide.
          filter: UK 4–6 / XS, or children's sizes 26–28 waist.
          spec: >-
            Dark warm brown. Contrast knee patches stitched onto a fabric leg
            IS exactly this construction — it is not an approximation of it.
          avoid: >-
            Not black, not navy, and not the modern high-shine technical
            fabrics. Panels and distressing are added in-house afterwards, so
            buy the construction and not the finish.
          budget: "£5–15"
        images:
          - src: 03-characters/captain-jasu/source/artwork/material_cloth.png
            crop: [0.44, 0.0, 1.0, 1.0]
            caption: >-
              The trouser cloth beside the knit — a flat, dry, close-woven
              fabric with a stitched panel seam. That seam is the construction
              to look for.
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.28, 0.42, 0.72, 0.75]
            caption: >-
              Close to the leg, panels at the outer thigh, pads at the knee.
              Jodhpurs already have this shape.
        note: >
          EQUESTRIAN JODHPURS OR BREECHES are the real-world match — contrast
          knee patches stitched onto a fabric leg is exactly this construction,
          and riders resell them constantly. Dark warm brown. Panels and
          distressing added in-house afterwards.
      - item: Forearm bracers
        route: made
        qty: 2
        status: not-started
        build:
          size: >-
            ~170 to 190 mm long on her forearm — wrist to just below the elbow,
            and NO FURTHER. Measure her; a bracer cut to a standard forearm
            runs into the elbow crease on a fine-boned 155 cm arm and stops the
            joint bending.
          colour: Dark brown leather, close to the belt but not matched to it
          hex: "#3b2c21"
          finish: >-
            Genuinely worn. Darken the buckle track and the edges where a
            forearm rubs, leave the flats lighter.
          method: >-
            Leather, riveted, buckled — one of the few places on this costume
            where leather is correct. Two or three buckles each, on the outside
            of the arm.
        images:
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.20, 0.36, 0.82, 0.52]
            caption: >-
              Both bracers, wrist to below the elbow, buckles on the outside of
              the arm. Note where they STOP — the elbow stays clear.
        note: >
          Leather, riveted, buckled. FOREARM ONLY — wrist to below the elbow,
          not continuing up the upper arm. Dark. One of the few places leather
          is correct on this costume.
      - item: Wide belt, buckle and fittings
        route: bought
        qty: 1
        status: not-started
        shop:
          search:
            - wide leather belt
            - mens leather belt heavy buckle
            - vintage tan leather belt
          where: Vinted, eBay, and charity shops — belts are everywhere secondhand.
          filter: >-
            Look at MEN'S belts. They are often the right proportion even on a
            petite frame, and the extra length is cut off and re-punched.
          spec: Broad leather, plain heavy buckle. Warm brown.
          avoid: >-
            No branding, no fashion hardware, nothing polished. If nothing
            suitable turns up, the buckle and fittings are printed and only the
            strap is bought.
          budget: "£3–10"
        images:
          - src: 03-characters/captain-jasu/source/artwork/material_hardware.png
            caption: >-
              The hardware language for the whole costume — plain, heavy,
              salvaged, unpolished. Buy a buckle that looks like these.
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.32, 0.39, 0.68, 0.50]
            caption: >-
              Broad at the waist, sitting level. The proportion is why a men's
              belt often works better than a women's.
        note: >
          Broad leather belt, plain heavy buckle. Men's belts are often the
          right proportion even on a petite frame. Buckle and fittings printed
          if nothing suitable turns up.
      - item: Belt pouches
        route: bought
        qty: 2
        status: not-started
        shop:
          search:
            - leather belt pouch
            - military surplus ammo pouch
            - leather drawstring belt bag
          where: >-
            Army surplus is the best and cheapest source. eBay and Vinted
            otherwise.
          filter: Two, and they need NOT match each other.
          spec: >-
            Brown leather or heavy canvas, small. Worn on her LEFT, off the
            drawing side.
          avoid: >-
            Nothing tactical-modern — no MOLLE webbing, no nylon, no visible
            branding. Nothing issued: nothing about her is insignia.
          budget: "£6–14 the pair"
        images:
          - src: 03-characters/captain-jasu/source/artwork/material_leather.png
            caption: >-
              THIS IS THE POUCH. Soft worn leather, a single stud closure, a
              hand-stitched seam and a rounded flap — not a stiff moulded
              case. Army surplus sells this shape constantly.
      - item: Holster — belt-mounted, her RIGHT hip
        route: made
        qty: 1
        status: not-started
        build:
          size: >-
            Hangs from the belt down the right thigh. BUILD IT AROUND THE
            PRINTED A180, not around a generic pistol and not before the
            blaster exists — the drop length is set by where her hand falls,
            and on a 155 cm frame a standard drop puts the grip below her
            reach.
          colour: Dark brown leather, matched to the bracers
          hex: "#3b2c21"
          finish: Worn at the mouth and along the draw edge.
          method: >-
            Grip up and angled forward for a right-hand draw. She is RIGHT
            handed — blaster on the right, leash and pouches on the left, off
            the drawing side.
        images:
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.26, 0.40, 0.52, 0.62]
            caption: >-
              Her RIGHT hip, which is the LEFT of this picture. Hanging from
              the belt down the thigh, grip up and angled forward.
        note: >
          Leather, hanging from the belt down the right thigh, grip up and
          angled forward for a right-hand draw. Built around the A180, not
          around a generic pistol.
      - item: A180 blaster pistol
        route: printed
        qty: 1
        status: not-started
        build:
          size: >-
            ~230 to 250 mm overall, muzzle to grip heel. CHECK IT IN HER HAND
            BEFORE PRINTING THE FINAL — a full-size pistol reads noticeably
            larger on a 155 cm frame, and this is the one prop that must not
            look like it is wearing her.
          colour: Bright polished steel, forward half
          hex: "#b9bcc0"
          accent: Near-black, rear half and grip
          accent_hex: "#1c1c1e"
          finish: >-
            THE ONE CLEAN THING IN THE FILM. Sand and fill the layer lines
            properly, then polish — everything else in this production is
            dulled and distressed and the palette rule protects this. No wash,
            no weathering, no dry-brushed grime. Serviced, not battered.
          method: >-
            Print in sections, muzzle along the build axis so the six vent
            holes and the fluting do not need support through their openings.
            The knurled knob on the mounting rail is the detail most likely to
            be lost at a coarse layer height — print it separately if it is.
        images:
          - src: 03-characters/captain-jasu/source/artwork/blaster.png
            caption: >-
              Two-tone: bright polished steel forward, black at the back. Six
              vent holes near the muzzle, fluting part way back, mounting rail
              with a knurled knob, chequered raked grip.
          - src: 03-characters/captain-jasu/reference/props/a180.jpg
            caption: The real-world original — the A180 Jyn Erso carries in Rogue One.
            scope: >-
              THIRD-PARTY REFERENCE. Replace it with a photograph of our own
              printed build as soon as one exists: for anything physically
              built the reference is a photograph of the build, not a render.
        note: >
          The weapon Jyn Erso carries in Rogue One. Reference at
          reference/props/a180.jpg. Two-tone — bright polished steel forward,
          black at the back, six vent holes near the muzzle, fluting part way
          back, mounting rail with a knurled knob, chequered raked grip.
          IT MUST FINISH BRIGHT AND CLEAN. Everything else in this production is
          dulled and distressed; this is the one thing she looks after, and the
          palette rule protects it. Photograph the build and replace the
          third-party reference image.
      - item: Bone horns for the headdress
        route: printed
        qty: 2
        status: not-started
        build:
          size: >-
            ~75 to 110 mm each, measured along the curve — a third to a half
            the height of her head. One slightly the longer of the two.
          colour: Pale bone, yellowed with age
          hex: "#d9cba4"
          accent: Deeper ochre, settled into the grain and the base
          accent_hex: "#b9a476"
          finish: >-
            MATTE AND SMOOTH. Never polished, never carved, never ridged or
            banded, never set in metal. They are trophies taken off what the
            akk kills; a worked finish turns them into jewellery and collapses
            the reading. Age them with a thin ochre wash pulled into the grain
            and wiped back off the high points — the yellowing is what sells
            them as old.
          method: >-
            PRINT AS TWO SEPARATE MODELS, NEVER ONE MODEL MIRRORED. This is the
            printing trap recorded in Costume-Build-Method: a printer produces
            a perfect matched pair by default, and a matched pair reads as a
            manufactured ornament rather than as two things taken off two
            kills. Both curved, one blunter and one pointed.
        note: >
          Pale bone, matte, YELLOWED WITH AGE. Never polished, never carved,
          never set in metal — they are trophies from what the akk kills, and a
          worked finish turns them into jewellery and collapses the reading.
          TWO ONLY, ONE EACH SIDE, each a third to a half the height of her
          head. ALIKE IN CURVE, COLOUR AND SIZE, AND NOT THE SAME OBJECT —
          both curved, one blunter and one pointed, one slightly the longer.
          SMOOTH, never ridged or banded.
          PRINT THEM AS TWO SEPARATE MODELS, NEVER ONE MODEL MIRRORED. This is
          the printing trap recorded in Costume-Build-Method — a printer
          produces a perfect matched pair by default, and a matched pair is a
          manufactured ornament rather than two things taken off two kills.
          SPEC SETTLED BY THE PRODUCTION DESIGNER 2026-08-04. The authority is
          source/artwork/portrait.png, the only plate that satisfies it on every
          point. The approved front is a TRUE MIRRORED PAIR — verified by
          flipping one horn onto the other — and must not be used for the horns.
        images:
          - src: 03-characters/captain-jasu/reference/headdress/horns-authority-2026-08-04.png
            caption: >-
              THE HORN AUTHORITY, cut from portrait.png above the collar. 46%
              and 53% of head height, one blunt-tipped and one pointed — the
              only plate compliant on every point of the 2026-08-04 ruling.
            scope: >-
              AUTHORITATIVE FOR THE HORNS AND NOTHING ELSE. The approved front
              is a TRUE MIRRORED PAIR and must not be used for them, and
              headdress.png shows three on the visible side and is out of spec.
      - item: Whistle on a cord
        route: printed
        qty: 1
        status: not-started
        build:
          size: >-
            ~45 to 55 mm long. Small enough to close a hand around, and small
            enough that it is not obviously a costume piece at distance.
          colour: Dull dark metal, brass gone brown with age
          hex: "#6e6250"
          accent: Rubbed brighter where a thumb has worn it for years
          accent_hex: "#9a8f7d"
          finish: >-
            CHEAP-LOOKING AND MUCH HANDLED. This is the hero prop and it must
            not look like one. Wear it at the edges and the mouthpiece, leave
            the recesses dark. It is her entire command structure and it is
            worth nothing to anybody else — that contradiction is the whole
            point, so resist every instinct to make it handsome.
          method: >-
            Cord at the throat, not a chain. THERE IS EXACTLY ONE AND IT IS AT
            HER THROAT — the belt carries no second whistle.
        images:
          - src: 03-characters/captain-jasu/source/artwork/whistle_and_leash.png
            crop: [0.0, 0.0, 0.44, 1.0]
            caption: >-
              Small, plain, dark, on a thin cord. A tube with a mouthpiece and
