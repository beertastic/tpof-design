          spec: >-
            Heavy strap or chain. Coiled and hung at the belt on her LEFT, off
            the drawing side.
          avoid: >-
            No bright colours, no nylon, no clip-on fashion hardware. NEVER in
            her hand and NEVER on the animal — she carries restraint she does
            not need, as a display for the crew.
          budget: "£4–10"
        images:
          - src: 03-characters/captain-jasu/source/artwork/whistle_and_leash.png
            crop: [0.42, 0.0, 1.0, 1.0]
            caption: >-
              Heavy doubled strap, a plain sprung hook, worn dark. Wide and
              thick for an animal far bigger than a dog.
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.58, 0.40, 0.82, 0.72]
            caption: >-
              Coiled and hung at the belt on her LEFT — off the drawing side.
              Never in her hand, never on the animal.
        note: >
          Heavy strap or chain, coiled and hung at the belt on her left, off the
          drawing side. Never in her hand and never on the animal. She is
          carrying restraint she does not need, as a display for the crew.
      - item: Boots — tall, close to the calf
        route: bought
        qty: 1
        status: not-started
        shop:
          search:
            - tall brown leather boots flat
            - leather riding boots brown
            - knee high leather boots flat heel
          where: >-
            CHARITY SHOPS FIRST — they are the best source and the cheapest,
            and the wear is wanted. Vinted and eBay after.
          filter: >-
            Her size, and check the CALF measurement as well as the foot — a
            tall shaft that will not close is the commonest failure on a fine
            build.
          spec: >-
            Brown leather, practical, genuinely worn. TALL — the shaft rises
            well up the calf and ends below the knee. The best boots in the
            crew, and looked after.
          avoid: >-
            HEEL FLAT, or as near flat as a sourced boot allows — a walking
            sole, no more than ~25 mm. A heeled riding or fashion boot is the
            easiest thing to find in this shape and it is the WRONG one;
            nothing about her costume may add height. If a boot is right in
            every other way, RE-HEEL IT — that is a cobbler's job and it costs
            less than the boot. Do not pay extra for "like new".
          budget: "£15–30"
        images:
          - src: 03-characters/captain-jasu/source/artwork/turn-field-front.png
            crop: [0.26, 0.66, 0.74, 1.0]
            caption: >-
              THE SHAFT HEIGHT IS THE TEST — well up the calf, ending below the
              knee, close to the leg. Flat sole. Scuffed, creased and looked
              after, which is what a charity shop already sells.
        note: >
          Brown leather, practical, genuinely worn. Charity shops are the best
          source and the wear is wanted — do not pay extra for "like new".
          The best boots in the crew, and looked after.
          TALL — the shaft rises well up the calf and ends below the knee.
          Confirmed against a generated A/B on 2026-08-03; the tall shaft is the
          decision and the ankle boot in the earlier reference is superseded.
          HEEL: FLAT, or as near flat as a sourced boot allows — a walking sole,
          no more than about 25 mm. A heeled riding or fashion boot is the
          easiest thing to find in this shape and it is the wrong one. If a
          candidate boot is right in every other way, RE-HEEL IT rather than
          accept the heel; that is a cobbler's job and it is cheaper than the
          boot. Nothing about her costume may add height.

    # RESTRUCTURED 2026-08-03 — fix 2 from `Prompt-Reliability-TODO.md`, applied
    # to her the way it was applied to Shada on 2026-08-02.
    #
    # NINE RULES BECAME TWENTY-SIX, and the specification did not change. The
    # nine were prose: rule 2 alone carried the body garment, the collar, the
    # agility, the belt, the split panels, the boots, the made-to-measure line
    # and the not-for-display line in one 2,166-character block, so only its
    # first sentence and its first negation ever reached a generator. The
    # collar, the boots and "they never close into a skirt" were all being
    # dropped — the last of those is the exact fault that cost Shada her fifth
    # generation.
    #
    # HOW `trim()` ACTUALLY WORKS, and therefore how to write these:
    #   1. Sentence one ALWAYS survives. Put the constraint there, not the
    #      subject — "THE COLLAR IS STIFF AND STANDS", not "THE COLLAR".
    #   2. The first sentence after it carrying NOT/NEVER/NO/NOTHING/ONLY/
    #      ALWAYS/MUST also always survives. Make sentence two a prohibition.
    #   3. Everything after that competes on LENGTH. Short sentences win.
    # One rule per enforceable thing. If a rule covers two objects, only one of
    # them is protected. KEEP EVERY RULE UNDER ~250 CHARACTERS — that is the cap
    # the budget settles on, and a rule under it is never trimmed at all.
    #
    # THE REASONING IS NOT HERE ANY MORE, and it is not lost — it is in
    # `Character.md`, which is where a human reads it. A generator does not need
    # to be persuaded, and every character of persuasion displaces a constraint.
    #
    # The A180's barrel, receiver and grip detail moved to slot 9 in
    # `Prompts.md`. It is unreadable in a full-length figure and was spending
    # ~700 characters in all 21 prompts to be legible in one. Same argument as
    # fix 9.
    # PER-SLOT REFERENCES — added 2026-08-04. These attach to the named slot and
    # to nothing else.
    #
    # The akk dog appears in three of her twenty-one images and in none of the
    # turnarounds. Declaring it at outfit level would attach a creature plate to
    # every costume fitting photograph, which is an invitation for the animal to
    # wander into frames it is not in. Declaring it nowhere is what was
    # happening, and `captaining` duly came back with a GENERIC DOG while
    # `camp_day` got a reptile — from the same prompt pack, seven minutes apart.
    #
    # `repo_path:` because these belong to the creature, not to her. Copying
    # them into her folder would create a second copy that goes stale against
    # the rig.
    #
    # The scale plate is first deliberately: the creature document says image
    # generators get creature scale wrong more reliably than anything else.
    slot_references:
      captaining:
        - repo_path: 08-species/akk-dog/reference/scale-with-figure.png
          what: THE AKK DOG — SIZE against a 1.8 m figure
        - repo_path: 08-species/akk-dog/reference/turnaround-three-quarter.png
          what: THE AKK DOG — SHAPE, 3/4 view
      akk_together:
        - repo_path: 08-species/akk-dog/reference/scale-with-figure.png
          what: THE AKK DOG — SIZE against a 1.8 m figure
        - repo_path: 08-species/akk-dog/reference/turnaround-three-quarter.png
          what: THE AKK DOG — SHAPE, 3/4 view
        - repo_path: 08-species/akk-dog/reference/head-detail.png
          what: THE AKK DOG — HEAD, where generators drift most
        - repo_path: 08-species/akk-dog/reference/hide-detail.png
          what: THE AKK DOG — HIDE at real scale
      camp_day:
        - repo_path: 08-species/akk-dog/reference/scale-with-figure.png
          what: THE AKK DOG — SIZE against a 1.8 m figure
        - repo_path: 08-species/akk-dog/reference/turnaround-three-quarter.png
          what: THE AKK DOG — SHAPE, 3/4 view

    must_show:
      - pin: true
        text: >
          SHE IS 155 cm AND THE SMALLEST ADULT IN THE FILM, AND NOTHING
          COMPENSATES FOR IT.
          NEVER make her taller, broader, older or harder-looking to justify the
          rank.
          Slight and fine-boned: NOT muscular, NOT broad, NOT heavy, NOT tall.
      - pin: true
        text: >
          HER HEAD IS IN NORMAL ADULT PROPORTION TO HER BODY.
          NEVER oversized, NEVER a caricature, NEVER a child's proportions.
          The FACE comes from the actor photograph and the BODY from this
          description.
          A young East Asian woman with long dark hair.
      - >
        THE ANIMAL IS HER RANK.
        NO insignia, NO rank badge, NO faction mark, NO medal, NO braid.
      - >
        THE BODY GARMENT IS SKIN-TIGHT FROM COLLAR TO ANKLE — A SECOND SKIN,
        WITH NO BULK OVER THE RIBS, THE WAIST, THE HIPS OR THE LIMBS.
        NO flare, NO swing, NO volume, NO gathered or draped fabric anywhere,
        and NOT a full skirt, NOT a wide coat, NOT robes.
      - >
        THE COLLAR IS STIFF AND STANDS, CLOSED TO THE THROAT.
        NEVER open, NEVER a lapel, NEVER a shawl, NEVER a cowl.
      - >
        THE WAIST IS PULLED IN HARD BY A WIDE HEAVY BELT over the second skin.
        The holster is belt-mounted on her RIGHT.
        The leash, the pouches and the tools sit on her LEFT, off the drawing
        side.
      # THE HANGING SPLIT PANELS WERE DELETED 2026-08-03, by the Production
      # Designer. They were the "long skirted coat" of the officer reference,
      # split into strips so the silhouette would not read as a skirt — and they
      # existed ONLY here. There was never a component for them, and the
      # approved front has never shown them. Two records of three already agreed
      # they were not in the costume; this one had not caught up.
      #
      # They were also the most samurai-adjacent element she had, and
      # `Character.md` names samurai as the retrieval to block hardest because
      # Baylan stands beside her in Sc.25.
      #
      # BELOW THE WAIST SHE IS SKIN-TIGHT TROUSERS with quilted outer-thigh
      # panels stitched flat to the leg, and knee pads. Nothing hangs, nothing
      # swings, nothing parts.
      - >
        BELOW THE WAIST SHE IS SKIN-TIGHT TROUSERS with quilted outer-thigh
        panels stitched FLAT to the leg, and knee pads.
        NOTHING hangs from the belt, NOTHING swings, and there is NO skirt, NO
        tabard, NO hanging panel and NO coat tail of any kind.
      # THE TALL BOOTS WON THE A/B, 2026-08-03 — see `evolution/`. This wording
      # is variant A's, adopted verbatim because it is the version that actually
      # produced them against a reference photograph showing ankle boots.
      - >
        THE BOOTS ARE TALL AND CLOSE TO THE CALF — the shaft rises well up the
        calf, close-fitting, ending below the knee.
        They are NOT ankle boots, NOT low, NOT pale and NOT ornamented.
      # Added after the A/B came back in heeled boots. The component note has
      # said "flat" since 2026-08-01 and a build note cannot reach a generator.
      - >
        THE BOOT HEEL IS FLAT, OR AS NEAR FLAT AS THE BOOT ALLOWS — a walking
        sole, no more than about 25 mm at the heel.
        NEVER a block heel, NEVER a shaped or raised heel, and NEVER anything
        that adds height to her.
      - >
        CUT FOR A GYMNAST, NOT A SOLDIER — SHE MOVES LIKE AN ACROBAT AND THE
        COSTUME MUST SAY SO.
        NOTHING restricts her and NOTHING is bulky.
        Articulated at the shoulder, the elbow, the hip and the knee, with
        panelled seams and give across every joint.
      - >
        IT IS CUT TO HER AND ONLY TO HER — MADE TO MEASURE.
        It must NEVER look borrowed, oversized, or like a child in adult
        clothes.
      # ITS SURFACE WAS UNSPECIFIED until 2026-08-03 and the generator filled
      # the gap: the mantle_detail plate came back as crackled, tooled leather
      # with a cross-hatch lattice. The sentence that used to describe the
      # material was cut earlier the same day to pay for the heel and whistle
      # rules — judged redundant, and it was not. A trimmed tail can leave a
      # HOLE, and a generator does not leave holes empty.
      #
      # PLAIN AND FLAT is the Production Designer's direction: cleaner,
      # flatter, less design.
      - >
        A HARD SHOULDER MANTLE OF STIFFENED CLOTH, COMING TO A SHARP UPSWEPT
        POINT AT EACH SHOULDER — THE SIGNATURE OF THIS COSTUME.
        NOT a pauldron, NOT a spiked guard, NOT a winged shape, NOT a cape, NOT
        a fur collar.
      # THE SHAPE IS UNIFORM, THE WEAR IS NOT — the same rule the akk dog lens
      # test and Shada's scale plate both arrived at. What came back wrong on
      # 2026-08-03 was a REGULAR cross-hatch lattice, which reads as a designed
      # pattern. The irregular crazing in the approved front is WANTED: it is
      # worn leather-like cloth, not decoration.
      - >
        THE MANTLE CARRIES WEAR, NEVER DECORATION — fine IRREGULAR crazing and
        cracking, heavier where it flexes and rubs.
        NO quilting, NO lattice, NO regular grid, NO tooling, NO repeating
        texture.
        Looked after, not derelict: NO splits, NO holes, NO rot.
      - >
        A STIFF YOKE OVER BOTH SHOULDERS, STANDING PROUD OF THE BODY and
        reaching out past the shoulder points before angling down over the top
        of the upper arm.
        It is the ONLY thing on her wider than she is.
        It rises at the back into the stand collar.
      # THE HAIR IS WORN DOWN — decided 2026-08-03 by the Production Designer,
      # after seeing it up. It had said 'swept up... NEVER down' since
      # 2026-08-01, and two generated passes put it up: high and sculpted
      # first, then low and rough. Neither was her. The approved front had it
      # right from the beginning and the rule was the thing that was wrong.
      #
      # It also makes the standing continuity question cheap: hair worn down
      # is not a build, so it costs the schedule almost nothing across her six
      # scenes, where a gathered shape would have to be reset every day.
      - >
        HER HAIR IS LONG, DARK AND WORN DOWN AND LOOSE — falling over her
        shoulders and down her back, swept back off the face, field-worn and
        slightly dishevelled.
        NEVER piled up, NEVER a bun, NEVER scraped back tight, NEVER styled.
      - >
        EXACTLY TWO PALE CURVED BONE HORNS, ONE EACH SIDE, set into the hair
        above and behind the ears. Each is A THIRD TO A HALF THE HEIGHT OF HER
        HEAD. NEVER three, NEVER a cluster, NEVER a row of points.
      - >
        THE TWO HORNS ARE NOT THE SAME OBJECT — alike in curve, colour and size,
        but one blunter and one pointed, and one slightly the longer.
        NEVER A MIRRORED PAIR. SMOOTH — never ridged, never banded, never
        segmented like a ram's horn.
      - >
        THE HORNS ARE BONE — WORN, MATTE AND YELLOWED, taken off something once
        alive. A TROPHY, NOT JEWELLERY. NEVER polished, NEVER carved, NEVER set
        in metal. NOT a helmet, NOT a crown, NOT a circlet, NOT a band, NOT a
        mask.
      - >
        THE BODY IS TEXTILE, NOT LEATHER — heavy ribbed knit, quilted panels,
        dense woven canvas, matte and dry.
        If the costume reads as a leather bodysuit, it is WRONG.
        Leather is the MINORITY: the belt, the boots, the forearm bracers, the
        holster.
      - >
        THE CLOTH IS EXPENSIVE AND IT IS FILTHY — THE QUALITY IS IN THE CUT,
        NEVER IN THE CONDITION.
        NOT clean, NOT pressed, NOT ceremonial, NOT new.
        Faded at the shoulders, mended at cuffs and hem, mud to the knee, the
        collar worn shiny.
      # EXACTLY ONE. The A/B came back with two — one correctly at her throat
      # from this rule, and one still at her belt, carried over from the
      # approved photograph. Adding the throat whistle did not remove the belt
      # one, because nothing said there was only ever a single whistle.
      - >
        EXACTLY ONE WHISTLE, ON A CORD AT HER THROAT, PLAINLY VISIBLE.
        There is NEVER a second whistle, and NOTHING resembling a whistle hangs
        from her belt.
        NOT ornamental and NOT jewellery — cheap, plain and much handled.
      - >
        A HEAVY LEASH — CHAIN OR THICK STRAP — COILED AND HUNG AT HER BELT ON
        HER LEFT.
        She is NEVER holding it and the animal is NEVER on it.
      - >
        THE A180 BLASTER PISTOL — THE WEAPON JYN ERSO CARRIES IN ROGUE ONE —
        HOLSTERED ON HER RIGHT HIP, TWO-TONE: BRIGHT POLISHED STEEL FORWARD,
        BLACK AT THE BACK.
        She is RIGHT-HANDED and it is NEVER on her left.
      - >
        THE A180 IS CLEAN, SERVICED AND CARED FOR — the only maintained object
        in this crew.
        NOT a generic sidearm, NOT a revolver, NOT a scratch-built mismatch, NOT
        an antique, NOT ornate, NOT dark all over.
      - >
        SHE IS COLD, NOT ANGRY.
        NO snarl, NO glare, NO scowl, NO bared teeth, NO clenched fists, NO
        aggressive posturing of any kind.
        Calm, still, watchful and unsentimental — assessing you rather than
        threatening you.
      - >
        NO MAKEUP THAT READS AS MAKEUP, NO GLAMOUR, NO STYLING.
        She is not presented as attractive; she is presented as a person doing a
        job.
      - >
        MUTED AND DARK — DEEP BROWN, DARK UMBER, FADED CHARCOAL, OILED HIDE, THE
        DULL WARM GREY OF OLD CANVAS.
        NEVER imperial grey, NEVER black-on-black, NO uniform green, NO red, NO
        gold braid, NO faction colour.
      # Its own rule from 2026-08-03: it is a legibility instruction, not a
      # palette one, and as the tail of the palette rule it was being dropped.
      - >
        SHE MUST SEPARATE FROM A NIGHT FOREST AND FROM FIRELIGHT.
        Do NOT sink her into the background.
      - >
        THE BRACERS, THE LEG PANELS, THE KNEE PADS, THE MANTLE AND THE BOOTS ARE
        ALL DARK WARM BROWN.
        NEVER bone, NEVER cream, NEVER ivory, NEVER pale.
        THE BRACERS ARE FOREARM ONLY — wrist to below the elbow, buckled.
        They do NOT continue up the upper arm.
      - >
        TWO PALE OR BRIGHT THINGS AND ONLY TWO — THE BONE HORNS AND THE BLASTER
        BARREL.
        NOTHING else on her is pale and NOTHING else is bright.
        Do not dull the barrel to match her.
