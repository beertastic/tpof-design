character: Captain Jasu
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

# CAST 2026-08-01, and this is a DEPARTURE FROM THE SCRIPT. The screenplay says
# "CAPTAIN JASU (40s), a powerful woman". She is now twenty-eight and 150 cm.
# Recorded in Character.md so nobody rediscovers it as an error.
#
# It makes the design stronger, not weaker. "The animal is her rank" was always
# the central fact; at 4 ft 11 in there is now NOTHING else it could be.
height: >
  150 cm (4 ft 11 in) — VERY SMALL AND SLIGHT, and almost certainly the smallest
  adult in the film. She is TWENTY-EIGHT. NOT imposing, NOT muscular, NOT
  physically dangerous-looking in any way. Baylan stands 48 cm taller than her
  and her own animal outweighs her

do_not_retrieve_short: >
  SHE IS 28 AND 150 cm — SMALL AND SLIGHT, NEVER IMPOSING. Do not make a
  mercenary captain tall, broad, older or physically formidable.
  DO NOT draw an Imperial officer and DO NOT draw a samurai. She has a high
  collar, a hard shoulder and a long coat, and that is where the resemblance
  stops: no Imperial grey, no rank badge, no code cylinders, no peaked military
  cap, no lacquered plate armour, no helmet, no horns, no face mask. She belongs
  to no army and never did.

# THE TWO THINGS THAT WILL RETRIEVE. A high collar plus a hard shoulder plus a
# crest at the brow sits very close to two costumes an image model knows
# extremely well, and both are wrong for opposite reasons.
do_not_retrieve: >
  TWO DEPICTIONS WILL TRY TO ARRIVE HERE AND BOTH ARE WRONG.

  NOT AN IMPERIAL OFFICER. No flat grey-green uniform, no tunic with a rank
  plaque on the chest, no code cylinders at the shoulder, no peaked military cap,
  no jodhpurs, no gleaming jackboots, no insignia of any kind. She commands eight
  people and a dog. There is no empire behind her and nothing she wears may imply
  one.

  NOT A SAMURAI, AND NOT A JEDI. No lacquered lamellar plate, no laced armour
  panels, no wide flaring shoulder guards, no horned or winged helmet, no face
  mask, no mempo, no topknot, no robes, no sash-wrapped front, no sword. The man
  standing beside her in the finale is a Jedi hiding as a mercenary, and his
  entire design depends on nobody in frame reading as one.

  AND SHE IS NOT PHYSICALLY IMPOSING. She is twenty-eight years old, 150 cm,
  slight and fine-boned — the smallest adult in the film, and her own animal
  outweighs her. The word "captain" will pull you toward someone tall, broad and
  weathered. Refuse it. She is obeyed because of the beast at her side and for no
  other reason, and an image that makes her physically formidable has destroyed
  the only idea in the design.

  WHAT IS TRUE INSTEAD: she has bought the SHAPE of authority — a closed high
  collar, a square shoulder, a long coat and a cinched waist — because she has
  none of the real thing. It is well made and it has been in a forest for weeks.
  Battered, faded, mended, and worn by somebody who fights in it.

outfits:
  - id: field
    name: Field dress
    # The production's own early concept drawing, added 2026-08-01. The shoulder
    # mantle is the signature of this costume and prose was never going to land
    # it — attach the sketch and let it carry the shape.
    references:
      - path: reference/concept/jasu-concept-sketch.jpg
        what: the shoulder mantle, the ribbed torso and the leg panels
    scenes: "9, 19, 20, 23, 24, 25 — her only costume. The akk dog is wherever she is"
    description: >
      The only coherent, deliberately assembled outfit in this crew, and that is
      the point of it, on a woman of twenty-eight who stands 150 cm and is the
      smallest adult in the film. The garment is a SECOND SKIN in heavy ribbed
      knit and dense woven cloth, close to the body from the throat all the way
      down — torso, arms and legs — with no volume anywhere on her, cut and
      articulated for an acrobat. Over the shoulders, a stiff dark RIBBED MANTLE
      standing proud of the body and reaching out past the shoulder points before
      angling down over the upper arm, rising at the back into a stand collar
      closed at the throat. A wide heavy belt with plain working hardware pulls
      the waist in hard. Below it, narrow split panels hang straight over the
      skin-tight leg, and there are textured panels down the outer thigh and over
      the knee. Hard bracers on the forearms. Tall boots close to the calf, flat
      and practical, the best in the crew. Nothing on her head at all. At her brow a low ornate
      band, asymmetric, carrying a small worn crest to one side — the only
      decorative object on her and clearly something she chose rather than
      earned. On her right hip a holstered blaster pistol, clean and serviced. A
      worn whistle on a cord at her throat, and a heavy leash coiled at her belt.
      Everything is good material and everything is battered: faded across the
      shoulders, mended at the cuffs, mud to the knee. Nothing about her is
      insignia, and nothing about her was issued.
    must_show:
      - >
        THE ANIMAL IS HER RANK, AND SHE MUST NOT READ AS A NATURAL LEADER.
        NO insignia, NO rank badge, NO faction mark, NO medal, NO braid.
        This is the whole design. She commands because she owns a monster and
        everyone knows it — not through seniority, not through tactical skill,
        not through the crew's respect. Whatever authority she projects is on
        loan from the beast. She has bought the SHAPE of an officer because she
        has none of the substance, and the outfit should read as chosen rather
        than earned: a woman dressed as an officer of an army that does not
        exist. If she reads as a person who would be obeyed without the animal,
        the image has failed.
        SHE IS THE SMALLEST PERSON IN ALMOST EVERY SCENE SHE IS IN, and she
        commands anyway. Do not compensate for that. Do not make her taller,
        broader, older or harder-looking to justify the rank — the gap between
        what she is and what she controls IS the character.
      - >
        SKIN-TIGHT THROUGH THE BODY — A SECOND SKIN FROM COLLAR TO ANKLE — WITH
        THE OFFICER LINE CARRIED ONLY IN THE HARD STRUCTURE OVER IT.
        NO FLARE, NO SWING, NO VOLUME, NO GATHERED OR DRAPED FABRIC ANYWHERE.
        NOT a full skirt, NOT a wide coat, NOT robes.
        THE BODY GARMENT follows her exactly — torso, arms and legs — close to
        the skin from the collar down, with no bulk over the ribs, the waist, the
        hips or the limbs. She has to be AGILE and the costume must say so at a
        glance. If fabric hangs away from her anywhere, it is wrong.
        THE COLLAR is stiff and STANDS, closed to the throat — never open, never
        a lapel, never a shawl or a cowl.
        SHE MOVES LIKE AN ACROBAT AND THE COSTUME MUST SAY SO. Cut for a gymnast,
        not a soldier: articulated at the shoulder, elbow, hip and knee, with
        panelled seams and give across every joint. NOTHING restricts her,
        NOTHING is stiff except the mantle, and NOTHING is bulky. She is the
        smallest adult in the film and she is the quickest.
        THE SHOULDER is the mantle — see its own rule below.
        THE WAIST is pulled in HARD by a wide heavy belt over the second skin.
        BELOW THE WAIST, NARROW SPLIT PANELS hang straight and free over the
        skin-tight leg — long, reaching towards the knee or past it, so the
        upright line survives. They are NARROW and they PART COMPLETELY when she
        moves. They never gather, never flare, and never close into a skirt.
        THE BOOTS are tall and close to the calf, the best in the crew, resoled
        and looked after.
        The severity is the point. Everything about the line is closed, upright
        and deliberate, and everything about the condition contradicts it.
        IT IS CUT TO HER AND ONLY TO HER. She is 150 cm, and a garment fitted
        this close cannot be anything but made to measure — which is precisely
        what nobody else in this crew has. It must NEVER look borrowed,
        oversized, or like a child in an adult's clothes. That misreading would
        make her pitiable, and she is not.
        IT IS CLOSE-FITTING FOR MOVEMENT, NOT FOR DISPLAY. No glamour, no posing,
        no fashion-editorial styling, nothing cut to be looked at. It is the
        working kit of a very small person who has to keep up with people twice
        her size, and it is filthy from a forest.
      - >
        A HARD SHOULDER MANTLE — THE SIGNATURE OF THIS COSTUME. SEE THE CONCEPT
        SKETCH ATTACHED ABOVE AND MATCH ITS SHAPE.
        A stiff, dark, RIBBED yoke sitting over BOTH shoulders, standing proud of
        the body and reaching out past the shoulder points before angling down
        over the top of the upper arm. It is WIDE — deliberately wider than she
        is — and it comes to a defined point at each shoulder. It rises at the
        back into the stand collar.
        It is STIFFENED CLOTH, not plate and not leather: ribbed, quilted or
        pleated, holding its shape by construction rather than by being armour.
        NOT a pauldron, NOT a spiked guard, NOT a winged shape, NOT a cape, NOT a
        fur collar.
        IT IS THE ONLY THING ON HER WIDER THAN SHE IS, and on a 150 cm frame that
        is the whole point: it is the shape of authority, worn. She had it made.
      - >
        NOTHING ON HER HEAD. NO headdress, NO circlet, NO diadem, NO crown, NO
        band, NO helmet, NO ornament of any kind at her brow or in her hair.
        Removed by the production 2026-08-01 — the shoulder mantle carries what
        the band was carrying, and carries it better, because it is construction
        rather than jewellery.
        HER HAIR IS LONG AND DARK, and BOUND UP AND BACK for the field — off the
        face and off the collar, in a tight worked shape that holds. Never loose
        and flowing, never styled, never a hairstyle anyone maintained. She works
        in a forest and handles an animal that could take her arm off.
      - >
        MORE CLOTH THAN LEATHER, AND GOOD CLOTH — EXPENSIVE, NEVER SMART.
        THE BODY IS TEXTILE: heavy ribbed knit, quilted panels, dense woven
        canvas — matte, dry, and clearly FABRIC rather than hide. The ribbing on
        the torso and the mantle is visible and structural.
        LEATHER IS THE MINORITY and it is confined to the working parts: the
        belt, the boots, the forearm bracers, the holster. If the costume reads
        as a leather bodysuit, it is WRONG.
        She takes the largest share and it shows in the QUALITY, never in the
        condition. Close tailoring, hardware that works and has been maintained. And then: faded across the shoulders and the crown of the
        coat, mended at the cuffs and the hem, mud to the knee, the collar worn
        shiny where it rubs. NOT clean, NOT pressed, NOT ceremonial, NOT new.
        She has been in a forest for weeks and she fights in these clothes.
        AND IT WAS MADE FOR HER. In a crew wearing dead men's kit and salvage,
        hers is the only outfit in the film that was cut to measure — at her
        size, nothing could be scavenged to fit anyway. Nobody out here has
        anything made. That is what the money actually looks like on her.
      - >
        THE WHISTLE AND THE LEASH — HER TWO INSTRUMENTS OF COMMAND, BOTH FOR THE
        ANIMAL AND NEITHER FOR THE CREW.
        A small worn WHISTLE on a cord at her throat, plainly visible, cheap and
        much handled. It is the most important object she owns: she whistles and
        the beast comes, and she whistles and it kills.
        A HEAVY LEASH — chain or thick strap — COILED AND HUNG AT HER BELT, on
        her LEFT, off the drawing side. She is not holding it and the animal is
        not on it. Carrying restraint she does not need is a display for the
        crew, and it is the difference between commanding an animal and
        controlling a weapon.
      - >
        BLASTER ON HER RIGHT HIP. She is RIGHT-HANDED. A holstered blaster
        pistol, belt-mounted, grip up and angled forward for a right-hand draw.
        NEVER her left. Unlike everything else in this crew the weapon is CLEAN,
        SERVICED AND CARED FOR — unscratched finish, working hardware, no
        mismatched parts. It is the one thing she spends money keeping right.
        The leash, pouches and tools sit on her LEFT, off the drawing side.
      - >
        TWENTY-EIGHT, AND VERY SMALL — 150 cm, THE SMALLEST ADULT IN THE FILM.
        Slight, fine-boned, and NOT physically imposing in any way: NOT muscular,
        NOT broad, NOT heavy, NOT tall. NOTHING about her body may suggest she
        could win a fight or hold a room by force, because the entire point is
        that she cannot and does not have to.
        She is a young East Asian woman with long dark hair.
        SHE IS COLD, NOT ANGRY. Calm, still, watchful, unsentimental — an
        expression that is assessing you rather than threatening you. She kills a
        man mid-sentence and smiles afterwards, and that must read as
        characteristic rather than theatrical. NO snarl, NO glare, NO scowl, NO
        bared teeth, NO clenched fists, NO aggressive posturing of any kind. She
        controls people by fear and she never has to raise her voice to do it —
        the threat is what everyone already knows about her, not what her face is
        doing.
        NO makeup that reads as makeup, NO glamour, NO styling. She is not
        presented as attractive; she is presented as a person doing a job.
      - >
        MUTED AND DARK, BUT NEVER IMPERIAL GREY AND NEVER BLACK-ON-BLACK.
        Deep browns, dark umber, faded charcoal, oiled hide, the dull warm grey
        of old canvas. NO uniform green, NO uniform grey, NO red, NO gold braid,
        NO faction colour of any kind. She must separate from a night forest and
        from firelight — do not sink her into the background.
