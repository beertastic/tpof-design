      w: 4.338
      h: 6.507
    sections:
    - heading: THIS COSTUME
      x: 0.45
      y: 8.177
      w: 7.063
      h: 2.75
      font_size: 11
      items:
      - Salvaged repaired mercenary workwear
      - Padded jacket re-shouldered at least once
      - Functional harness no trophies or marks
      - Undertunic visible only at collar and cuff
      - The blaster on the hip is a converted saber
    - heading: VIEWS
      x: 8.163
      y: 8.177
      w: 7.063
      h: 2.75
      items:
      - Front left right back then natural
      - One photograph with the subject rotated
      - Same distance lens height light and scale
      - Costume identical in all five
      - Natural pose shows how it actually sits
      font_size: 11
    - heading: BUILD NOTES
      x: 15.877
      y: 8.177
      w: 7.063
      h: 2.75
      font_size: 11
      items:
      - Every seam fastening and strap readable
      - Nothing obscured by pose or shadow
      - Buildable construction no floating elements
      - Repairs and replacements remain visible
      - Weathering follows contact and use
