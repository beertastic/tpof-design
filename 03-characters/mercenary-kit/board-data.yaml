# One turnaround sheet per mercenary — this is what costume builds from.
# The four are individuals, not four costumes for one person. See
# 04-factions/mercenaries/Crew-Roster.md
#
# NOTE ON turnaround_merc_1: the image generator refuses the Wookiee, so this
# sheet will never fill from generation — decided 2026-07-31, see Character.md.
# It stays in the config because the costume department still needs a turnaround
# sheet for a suit build. Fill it from concept art or from photographs of the
# build. --validate will report it as missing until then, and that is correct.

project: The Price of Freedom
character: Mercenary Kit
asset_id: CHAR-MERCENARY-KIT
version: '1.0'
status: NEW
date: '2026-08-01'
footer_left: THE PRICE OF FREEDOM - PRODUCTION DESIGN BIBLE
