character: Mercenary Kit
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
#
# All four builds are right-handed. The generator declares handedness once per
# character file and cannot vary it per build, and hand-mixing it is how
# placements get flipped. See Character.md.
handedness: right

# Four background mercenaries assembled from one modular kit. These are not four
# costumes of the same person — they are four people, and the whole point of the
# faction is that nothing matches. Each `must_show` therefore carries a rule that
# separates that build from the other three.
#
# The shared rule, repeated in every build because it is the one that fails:
# NO TWO OF THESE FOUR SHARE A SILHOUETTE CUE.

outfits:
  - id: heavy
    name: The large one
    scenes: "10, 20-23 — the Sabacc game, the pursuit, and the Vala fight in 23"
    description: >
      The large one — a towering fur-covered humanoid, and an established member of
      the crew. Decided 2026-07-31, see the faction guide. Standing well over two metres and the biggest thing in
      any frame he is in. Long shaggy fur in a dark iron-grey shot through with
      rust brown, greying at the muzzle and across one shoulder where an old
      injury healed badly. He is not young. Very little clothing: a broad,
      heavily built leather bandolier over one shoulder carrying ammunition and
      grenades, a second narrower utility strap crossing it the other way, a
      thick working belt with tools and pouches, and salvaged plate strapped over
      the forearms and one shoulder. Everything he carries is oversized because
      it was made or refitted for him. Slow, planted, physically certain. He
      stops things rather than chasing them.
    must_show:
      - >
        A TOWERING FUR-COVERED HUMANOID. Over two metres tall and massively
        built — substantially larger and heavier than every other figure in the
        crew. If he reads as merely a big man, the Vala fight does not work.
        His head, torso, arms and legs are entirely covered in coarse body hair.
        Broad chest, very long and powerful arms, a heavy brow over deep-set dark
        eyes, and a projecting muzzle. He stands and moves like a person, not
        like an animal.
      - >
        HE IS A SPECIFIC, ELDERLY INDIVIDUAL — DESCRIBE THIS ONE, NOT THE SPECIES
        IN GENERAL. His fur is DARK IRON-GREY SHOT THROUGH WITH RUST BROWN,
        mottled and uneven rather than any single tone, paling almost to white
        around the muzzle. He is OLD and it shows plainly: thinning patches over
        the shoulders, old scarring, sections matted and badly healed. His coat
        is COARSE, UNEVEN AND BADLY KEPT — worn down and patchy rather than
        long, clean, glossy or evenly-flowing.
        His bandolier is broad, thick and obviously hand-built from salvaged
        leather, and it is crossed by a second narrower strap the other way.
        Metal rings and beads are braided into the fur at the shoulder and
        muzzle.
      - >
        GRENADES ON THE BANDOLIER, CLEARLY VISIBLE AND CLEARLY REACHABLE.
        At least two grenades seated on the FRONT of the bandolier at mid-chest
        height, where someone held against him could get a hand to one. This is a
        hero prop planted in Scene 10 and paid off in Scene 23 — it must be
        legible in every image of him, never implied and never covered.
      - >
        TWO STRAPS CROSSING, NOT ONE. The heavy ammunition bandolier over one
        shoulder and a narrower utility strap crossing it the other way. This is
        the silhouette that separates him from the familiar single-bandolier
        read, and he is the only figure in this crew wearing anything DIAGONALLY
        across the chest.
      - >
        PLATING ON THE FOREARMS AND ONE SHOULDER ONLY, SALVAGED AND OVERSIZED —
        cut or refitted for a limb that size. No chest plate over the fur, no
        full armour, nothing matching. Most of him is fur, not gear.
      - >
        HIS PRIMARY WEAPON IS A HUMAN-SIZED RIFLE WORN AS A SIDEARM. The same
        class of salvaged blaster rifle another mercenary would carry in two
        hands, holstered on HIS RIGHT HIP like a pistol because that is what it
        is to him. This sells his scale in every frame and it is why he reaches
        for Vala with his hands rather than a weapon. HE IS RIGHT-HANDED and
        nothing is mirrored — no matching item on both sides.
      - >
        PERSONAL MARKS — WORKED INTO THE BODY. Metal rings, beads and small
        salvaged tokens braided into the fur at the shoulder and the muzzle.
        This is his only decoration and no other member of this crew decorates
        themselves this way.

  - id: ranged
    name: The rifle
    scenes: "10, 20-23 — the Sabacc game and the pursuit"
    description: >
      Built entirely around a long gun. The lightest armour of the four: a
      close-fitting technical knit, a sleeveless padded vest over it, and a
      single shoulder pad on the trigger side only. The most pouches of anyone —
      ammunition, tools, a scanner — arranged low on the hips and thighs where
      they do not foul going prone. Best boots in the crew, high and properly
      laced. A short-brimmed work cap worn low over the eyes, with
      goggles hanging around his neck. Lean, quick, always the one looking at
      the horizon.
    must_show:
      - >
        A LONG GUN, AND THE KIT IS CUT AROUND IT. A salvaged blaster rifle
        carried on a shoulder sling. NOTHING ON THE SHOULDERS OR UPPER CHEST THAT
        WOULD FOUL A RIFLE STOCK — no bandolier across the chest, no chest plate,
        no high collar. This is the visible difference between him and the others.
      - >
        LIGHTEST ARMOUR OF THE FOUR. One shoulder pad only, on HIS RIGHT — the
        trigger side. No chest plate, no forearm guards. He trades protection for
        speed and it must be obvious.
      - >
        POUCHES CARRIED LOW. Ammunition and tools on the hips and thighs, never on
        the chest, so he can go flat on the ground. The most pouches of any of the
        four.
      - >
        A SHORT-BRIMMED WORK CAP, worn low, shading the eyes — a shooter's cap,
        practical and salvaged. His goggles hang AROUND HIS NECK, never pushed up
        on the forehead and never over a wrapped head-cloth. NO head wrap, NO
        scarf over the head, NO cloth wound around the skull, NO goggles on the
        brow. Never a helmet — that belongs to another build.
      - >
        PERSONAL MARKS — MARKS OF THE TRADE. Job tallies notched into the rifle
        stock in deliberate counted groups, worn smooth where his hand sits. His
        only decoration, and nobody else in the crew marks themselves this way.

  - id: armoured
    name: The close one
    scenes: "10, 20-24 — the Sabacc game, the pursuit, and the clearing"
    description: >
      Built for the clearing rather than the chase. The most plating of the four
      after the large one, but placed differently — a segmented chest rig over a
      layered tunic, plates on both forearms, and a partial salvaged helmet that
      covers the crown and one side of the face and leaves the jaw open. A short
      weapon on the belt. Heavy, deliberate movement. Everything on him is about
      closing distance and surviving what happens when he gets there.
    must_show:
      - >
        A PARTIAL SALVAGED HELMET — the only headgear in the crew that could be
        called one. It covers the crown and ONE SIDE of the face and leaves the
        jaw and the other side open. Cut from scrap and refitted, clearly not
        issued and clearly not a matching pair with anything. No full helmet, no
        faceplate, no visor across both eyes.
      - >
        PLATES ON BOTH FOREARMS AND A SEGMENTED CHEST RIG. He is the only one of
        the four with armour on both arms. Legs and shoulders stay cloth.
      - >
        A SHORT WEAPON. A compact blaster or a heavy blade on HIS RIGHT HIP for a
        right-hand draw. NO LONG GUN — the rifle belongs to another build and two
        riflemen in four figures kills the individuality.
      - >
        NO LONG COAT AND NO CAPE. The outer-layer silhouette belongs to another
        build; his read is plating and bulk at the chest.
      - >
        PERSONAL MARKS — TROPHIES TAKEN FROM TARGETS. Small hard objects fixed to
        the helmet and the chest rig: a fastening, a badge, a cut-down fitting,
        each one obviously off somebody else's gear rather than bought. His only
        decoration, and nobody else in the crew carries trophies.

  - id: nearhuman
    name: The near-human
    scenes: "10, 20-23 — the Sabacc game and the pursuit"
    description: >
      A near-human, achieved in make-up alone — decided 2026-07-31. Distinct
      skin colour and geometric inked facial markings, nothing glued on, so he
      can be shot from any angle including close. A long weathered coat over
      layered cloth, worn open, the only long outer layer in the crew. Belt and
      braces rather than a chest rig. More visible personal decoration than any
      of the other three: small kept objects threaded onto the belt, from a life
      before this one. His gear is the same quality as everyone else's, which is
      the point — different species, same standard, found each other rather than
      recruited.
    must_show:
      - >
        A NEAR-HUMAN, ACHIEVED IN MAKE-UP ALONE — NO APPLIANCES, NO PROSTHETICS,
        NOTHING GLUED ON. He differs from human in SKIN COLOUR and MARKINGS only.
        THE SKIN COLOUR IS THE POINT AND IT KEEPS BEING MISSED. His skin is a
        clearly NON-HUMAN COLOUR over his whole face, neck and hands — a muted
        GREEN-GOLD or a desaturated GREY-BLUE, obvious at a glance and never
        mistakable for a human complexion, a suntan or weathering. If he could
        pass for a human with tattoos, the image has failed: the colour must do
        the work, not the markings.
        THE MARKINGS ARE SECONDARY. Geometric inked markings across the face, on
        top of that non-human skin tone. Human bone structure, human
        proportions, human scale. This must hold a close-up and survive a full
        day in a forest.
      - >
        THREE THINGS HE IS NOT. Not serpentine and not scaled — that language
        belongs to Shada and duplicating it weakens hers. Not large and NOT
        FURRED — that read belongs to the large one in this same crew. Not a
        creature build — no horns, no tentacles, no head-tails, no appliance of
        any kind.
      - >
        THE MARKINGS ARE EARNED, NOT DECORATIVE. Geometric, deliberate and
        clearly meaning something to him. Never tribal pastiche, never a tattoo
        chosen for looks.
      - >
        BARE HEAD. Nothing covering the head or the face — no cap, no wrap, no
        goggles, no helmet. Those belong to other builds, and the markings are
        the whole point of this one. They must be legible.
      - >
        THE ONLY LONG COAT IN THE CREW. A weathered coat below the knee, worn
        open, over layered cloth. No other build carries this silhouette.
      - >
        BELT AND BRACES. Nothing worn diagonally across the chest — that
        silhouette belongs to the large one. A compact blaster on HIS RIGHT HIP.
      - >
        PERSONAL MARKS — KEPT OBJECTS FROM A LIFE BEFORE THIS. Small, worn,
        obviously not equipment, threaded onto the belt where he can see them.
        More visible personal decoration than any of the other three, and nobody
        else in the crew carries anything sentimental.
      - >
        SAME QUALITY AS THE REST OF THE CREW. Good leather, sound hardware,
        repairs done properly. Not poorer, not scavenged, not othered by his gear.
