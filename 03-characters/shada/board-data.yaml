    sections:
    - heading: CONSTRUCTION RULES
      x: 0.45
      y: 11.3
      w: 5.323
      h: 4.4
      items:
      - Buildable seams and fasteners
      - Nothing floating or ornamental
      - Asymmetry remains functional
      - No snagging or rattling components
      - Repairs and replacements remain visible
      font_size: 10.5
    - heading: EXPOSED SKIN PURPOSE
      x: 6.173
      y: 11.3
      w: 5.323
      h: 4.4
      items:
      - Freedom of movement
      - Heat and weight reduction
      - Sensory function
      - Makes inherited scales legible
      - Arms and shoulders always bare
      font_size: 10.5
    - heading: FABRICATION NOTES
      x: 11.895
      y: 11.3
      w: 5.323
      h: 4.4
      font_size: 10.5
      items:
      - Matte and low-noise surfaces
      - Three patches three different metals
      - Test harness during crouch and climb
      - Knife and holster remain reachable
      - Weathering follows contact and repair history
    - heading: LAYER SYSTEM
      x: 17.618
      y: 11.3
      w: 5.323
      h: 4.4
      font_size: 10.5
      items:
      - Flexible scale-textured undersuit
      - Breathable base layer
      - Crossed harness and sporadic scale patches
      - Close fitting and cut to the figure
      - Quiet wraps and lightweight boots
