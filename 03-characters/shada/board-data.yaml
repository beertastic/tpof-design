boards:
  production:
    label: BOARD 01
    title: CHARACTER PRODUCTION BOARD
    output_pdf: Production-Board.pdf
    output_png: Production-Board-A2-300dpi.png
    tagline: Predator, not soldier.
    images:
      - {path: source/artwork/portrait.png, x: 0.45, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/forest.png, x: 5.80, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/industrial_a.png, x: 11.15, y: 1.35, w: 5.15, h: 9.70}
      - {path: source/artwork/species_strip.png, x: 16.50, y: 1.35, w: 6.40, h: 2.45}
    sections:
      - heading: FIRST IMPRESSION
        x: 16.50
        y: 4.00
        w: 6.40
        h: 3.00
        items: [Belongs in the wet forest, Notices everything, Wastes no movement, Could disappear at any moment]
      - heading: CHARACTER LOCK
        x: 16.50
        y: 7.20
        w: 6.40
        h: 3.85
        font_size: 11.5
        items: [Subtle scales and reptilian eyes, Functional exposed skin, Compact blaster and knife, Light scavenged vital-area armour, Quiet and dangerous while still]
      - heading: STORY FUNCTION
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Assassin thief scout and tracker, Reads terrain scent and access routes, Strikes from advantage, Integral member of the mercenary family]
      - heading: VISUAL PRINCIPLE
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Mostly human never fully reptilian, Predator rather than soldier, Practical construction and visible repairs, Dark clothing remains separated from the background]
      - heading: DESIGN DRIFT - DO NOT
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.5
        items: [Generic human scavenger, Heavy tactical or medieval armour, Glamour pose or sexualisation, Datapad or gadget overload, Crushed blacks that hide the silhouette]

  costume:
    label: BOARD 02
    title: COSTUME CONSTRUCTION BOARD
    output_pdf: Costume-Board.pdf
    output_png: Costume-Board-A2-300dpi.png
    tagline: Nothing new. Everything earned.
    images:
      - {path: source/artwork/forest.png, x: 0.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/industrial_b.png, x: 5.95, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/industrial_c.png, x: 11.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/materials.png, x: 16.95, y: 1.35, w: 5.95, h: 4.25}
    sections:
      - heading: LAYER SYSTEM
        x: 16.95
        y: 5.80
        w: 5.95
        h: 5.25
        font_size: 11.5
        items: [Flexible scale-textured undersuit, Breathable base layer, Crossed harness and light plates, Outer panels break the silhouette, Quiet wraps and lightweight boots]
      - heading: CONSTRUCTION RULES
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Buildable seams and fasteners, Nothing floating or ornamental, Asymmetry remains functional, No snagging or rattling components, Repairs and replacements remain visible]
      - heading: EXPOSED SKIN PURPOSE
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Freedom of movement, Heat and weight reduction, Sensory function, Makes inherited scales legible, Never decorative or sexualised]
      - heading: FABRICATION NOTES
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.7
        items: [Matte and low-noise surfaces, Separate dark layers by texture and value, Test harness during crouch and climb, Knife and holster remain reachable, Weathering follows contact and repair history]

  weapons:
    label: BOARD 03
    title: WEAPONS & EQUIPMENT BOARD
    output_pdf: Weapons-Board.pdf
    output_png: Weapons-Board-A2-300dpi.png
    tagline: Maintained daily. Trusted always.
    images:
      - {path: source/artwork/knife.png, x: 0.45, y: 1.35, w: 10.90, h: 3.70}
      - {path: source/artwork/blaster.png, x: 0.45, y: 5.25, w: 5.25, h: 5.50}
      - {path: source/artwork/utility.png, x: 5.90, y: 5.25, w: 5.45, h: 5.50}
      - {path: source/artwork/maintenance.png, x: 11.55, y: 1.35, w: 5.40, h: 9.40}
      - {path: source/artwork/industrial_a.png, x: 17.15, y: 1.35, w: 5.75, h: 9.40}
    sections:
      - heading: COMBAT KNIFE
        x: 0.45
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Old working blade repeatedly sharpened, Wrapped and repaired grip, Secure silent sheath, Survival tool first weapon second, Personal and always close]
      - heading: COMPACT BLASTER
        x: 7.90
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Modified for reliability, Easy to conceal and draw, Mechanically believable construction, Replacement parts and worn finish, No oversized silhouette]
      - heading: UTILITY & MAINTENANCE
        x: 15.35
        y: 11.00
        w: 7.55
        h: 4.70
        font_size: 11.5
        items: [Climbing rope lock picks and field tools, No datapad or unnecessary gadgets, Every item has a fixed habitual place, Checks and cleans equipment after every mission, Preparation is her method of controlling fear]

  performance:
    label: BOARD 04
    title: PERFORMANCE & MOVEMENT BOARD
    output_pdf: Performance-Board.pdf
    output_png: Performance-Board-A2-300dpi.png
    tagline: She does not enter a space. She studies it.
    images:
      - {path: source/artwork/forest.png, x: 0.45, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/maintenance.png, x: 5.80, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/industrial_a.png, x: 11.15, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/expression_strip.png, x: 16.50, y: 1.35, w: 6.40, h: 3.50}
    sections:
      - heading: MOVEMENT PRINCIPLES
        x: 16.50
        y: 5.05
        w: 6.40
        h: 5.50
        items: [Economical and controlled, Low profile and quiet footwork, Patient before explosive action, Predatory never theatrical, Uses terrain shadow and distance]
      - heading: ACTOR NOTES
        x: 0.45
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Breathe low and quiet, Scan before speaking, Shift weight onto the balls of the feet, Avoid military posture, Warmth appears only around the crew]
      - heading: FACIAL LANGUAGE
        x: 7.90
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Neutral alertness, Suspicion without panic, Focused assessment, Protective toward the helpless, Cold lethal calm toward the hunted]
      - heading: ENVIRONMENTAL BEHAVIOUR
        x: 15.35
        y: 10.80
        w: 7.55
        h: 4.90
        font_size: 11.7
        items: [Notices tracks scent weather and wildlife first, Stillness is active not passive, Checks exits before settling, Studies strangers before committing, The forest is an ally]

  materials:
    label: BOARD 05
    title: MATERIALS & COLOUR BOARD
    output_pdf: Materials-Board.pdf
    output_png: Materials-Board-A2-300dpi.png
    tagline: Muted. Natural. Weathered. Functional.
    images:
      - {path: source/artwork/materials.png, x: 0.45, y: 1.35, w: 7.00, h: 5.60}
      - {path: source/artwork/scale_portrait.png, x: 7.65, y: 1.35, w: 6.20, h: 8.00}
      - {path: source/artwork/forest.png, x: 14.05, y: 1.35, w: 4.30, h: 8.00}
      - {path: source/artwork/maintenance.png, x: 18.55, y: 1.35, w: 4.35, h: 8.00}
    sections:
      - heading: APPROVED PALETTE
        x: 0.45
        y: 7.20
        w: 7.00
        h: 4.15
        font_size: 11.5
        items: ["Charcoal #2B2A26", "Ash brown #3A352F", "Dust brown #544E42", "Leather #6B5A47", "Faded tan #7C6F5B", "Faded olive #4F563F", "Weathered black #2E2F33", "Natural bone #BDAF95"]
      - heading: SURFACE LANGUAGE
        x: 0.45
        y: 11.60
        w: 7.25
        h: 4.10
        items: [Flexible scale mesh, Worn reinforced leather, Coarse technical fabric, Weathered matte metal, Rope stitching patches mud and patina]
      - heading: LIGHT & CONTRAST
        x: 7.90
        y: 11.60
        w: 7.25
        h: 4.10
        items: [Lift forest midtones behind the silhouette, Keep clothing dark but never crushed, Use wet rim highlights and material variation, Warm firelight only when motivated, No bright colour without story purpose]
      - heading: OVERALL LOOK
        x: 15.35
        y: 11.60
        w: 7.55
        h: 4.10
        font_size: 13
        items: [Muted, Natural, Weathered, Functional, Non-reflective, Belongs in the wet forest]
