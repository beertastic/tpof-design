# REBUILT 2026-07-31 around costume turnarounds.
#
# The previous version was built on thirteen mood images made before turnarounds
# became the primary deliverable. Those images have been cleared and this config
# rewritten. Board 01 is now the turnaround sheet.
#
# Generate the five turnarounds first:
#   03-characters/shada/prompts/turnarounds/
# Then the plates in:
#   03-characters/shada/prompts/

boards:
  production:
    label: BOARD 01
    title: COSTUME TURNAROUND
    output_pdf: Turnaround-Board.pdf
    output_png: Turnaround-Board-A2-300dpi.png
    tagline: Predator, not soldier.
    images:
      - {path: source/artwork/turn-working-front.png, x: 0.45, y: 1.35, w: 4.35, h: 9.70}
      - {path: source/artwork/turn-working-left.png, x: 5.00, y: 1.35, w: 4.35, h: 9.70}
      - {path: source/artwork/turn-working-right.png, x: 9.55, y: 1.35, w: 4.35, h: 9.70}
      - {path: source/artwork/turn-working-back.png, x: 14.10, y: 1.35, w: 4.35, h: 9.70}
      - {path: source/artwork/turn-working-natural.png, x: 18.65, y: 1.35, w: 4.25, h: 9.70}
    sections:
      - heading: THE FOUR SCALE PATCHES
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        font_size: 11.5
        items: [Gauntlet one forearm dull grey steel oldest, Cap one shoulder brass with verdigris, Sternum patch dark bronze stitched flat, One outer thigh newest and least worn, Four scavenging trips nothing matches]
      - heading: CONSTRUCTION
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Coin sized metal scales laced on flexible backing, Cut from salvaged scrap never forged, Close fitting and cut to the figure, Buckles hooks and lacing not modern zips, Blaster and knife worn not implied]
      - heading: DESIGN DRIFT - DO NOT
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.5
        items: [Matching or symmetrical scale patches, Rigid plate or all-leather costume, Embossed or printed scale texture, Hanging chest piece reading as jewellery, Bulky loose or oversized silhouette]

  costume:
    label: BOARD 02
    title: COSTUME CONSTRUCTION BOARD
    output_pdf: Costume-Board.pdf
    output_png: Costume-Board-A2-300dpi.png
    tagline: Nothing new. Everything earned.
    images:
      - {path: source/artwork/turn-working-front.png, x: 0.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/turn-working-back.png, x: 5.95, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/turn-working-natural.png, x: 11.45, y: 1.35, w: 5.30, h: 9.70}
      - {path: source/artwork/material-scale.png, x: 16.95, y: 1.35, w: 2.90, h: 2.05}
      - {path: source/artwork/material-leather.png, x: 20.00, y: 1.35, w: 2.90, h: 2.05}
      - {path: source/artwork/material-cloth.png, x: 16.95, y: 3.55, w: 2.90, h: 2.05}
      - {path: source/artwork/material-hardware.png, x: 20.00, y: 3.55, w: 2.90, h: 2.05}
    sections:
      - heading: LAYER SYSTEM
        x: 16.95
        y: 5.80
        w: 5.95
        h: 5.25
        font_size: 11.5
        items: [Flexible scale-textured undersuit, Breathable base layer, Crossed harness and sporadic scale patches, Close fitting and cut to the figure, Quiet wraps and lightweight boots]
      - heading: CONSTRUCTION RULES
        x: 0.45
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Buildable seams and fasteners, Nothing floating or ornamental, Asymmetry remains functional, No snagging or rattling components, Repairs and replacements remain visible]
      - heading: EXPOSED SKIN PURPOSE
        x: 7.90
        y: 11.30
        w: 7.25
        h: 4.40
        items: [Freedom of movement, Heat and weight reduction, Sensory function, Makes inherited scales legible, Arms and shoulders always bare]
      - heading: FABRICATION NOTES
        x: 15.35
        y: 11.30
        w: 7.55
        h: 4.40
        font_size: 11.7
        items: [Matte and low-noise surfaces, Four patches four different metals, Test harness during crouch and climb, Knife and holster remain reachable, Weathering follows contact and repair history]

  weapons:
    label: BOARD 03
    title: WEAPONS & EQUIPMENT BOARD
    output_pdf: Weapons-Board.pdf
    output_png: Weapons-Board-A2-300dpi.png
    tagline: Maintained daily. Trusted always.
    images:
