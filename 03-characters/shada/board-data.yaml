      - {path: source/artwork/turn-working-natural.png, x: 17.15, y: 1.35, w: 5.75, h: 9.40}
    sections:
      - heading: COMBAT KNIFE
        x: 0.45
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Old working blade repeatedly sharpened, Wrapped and repaired grip, Secure silent sheath, Survival tool first weapon second, Personal and always close]
      - heading: COMPACT BLASTER
        x: 7.90
        y: 11.00
        w: 7.25
        h: 4.70
        items: [Modified for reliability, Easy to conceal and draw, Mechanically believable construction, Replacement parts and worn finish, No oversized silhouette]
      - heading: UTILITY & MAINTENANCE
        x: 15.35
        y: 11.00
        w: 7.55
        h: 4.70
        font_size: 11.5
        items: [Climbing rope lock picks and field tools, No datapad or unnecessary gadgets, Every item has a fixed habitual place, Checks and cleans equipment after every mission, Preparation is her method of controlling fear]

  performance:
    label: BOARD 04
    title: PERFORMANCE & MOVEMENT BOARD
    output_pdf: Performance-Board.pdf
    output_png: Performance-Board-A2-300dpi.png
    tagline: She does not enter a space. She studies it.
    images:
      - {path: source/artwork/camp_night.png, x: 0.45, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/maintenance.png, x: 5.80, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/forest.png, x: 11.15, y: 1.35, w: 5.15, h: 9.20}
      - {path: source/artwork/expression_strip.png, x: 16.50, y: 1.35, w: 6.40, h: 3.50}
      - {path: source/artwork/species_strip.png, x: 16.50, y: 5.05, w: 6.40, h: 2.45}
    sections:
      - heading: MOVEMENT PRINCIPLES
        x: 16.50
        y: 7.75
        w: 6.40
        h: 2.80
        font_size: 11
        items: [Economical and controlled, Low profile and quiet footwork, Patient before explosive action, Predatory never theatrical, Uses terrain shadow and distance]
      - heading: ACTOR NOTES
        x: 0.45
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Breathe low and quiet, Scan before speaking, Shift weight onto the balls of the feet, Avoid military posture, Warmth appears only around the crew]
      - heading: FACIAL LANGUAGE
        x: 7.90
        y: 10.80
        w: 7.25
        h: 4.90
        items: [Neutral alertness, Suspicion without panic, Focused assessment, Protective toward the helpless, Cold lethal calm toward the hunted]
      - heading: SPECIES TREATMENT
        x: 15.35
        y: 10.80
        w: 7.55
        h: 4.90
        font_size: 11.7
        items: [Scale texture at the edges of the face only, Temples cheekbone jawline neck behind the ear, Tonal and readable only in raking light, Makeup not prosthetics, Reptilian contact lenses do most of the work]

  materials:
