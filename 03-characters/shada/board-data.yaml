    sections:
    - heading: THE FOUR SCALE PATCHES
      x: 0.45
      y: 8.177
      w: 7.063
      h: 2.75
      font_size: 11
      items:
      - Gauntlet one forearm dull grey steel oldest
      - Cap one shoulder brass with verdigris
      - Sternum patch dark bronze stitched flat
      - One outer thigh newest and least worn
      - Four scavenging trips nothing matches
    - heading: CONSTRUCTION
      x: 8.163
      y: 8.177
      w: 7.063
      h: 2.75
      items:
      - Coin sized metal scales laced on flexible backing
      - Cut from salvaged scrap never forged
      - Close fitting and cut to the figure
      - Buckles hooks and lacing not modern zips
      - Blaster and knife worn not implied
      font_size: 11
    - heading: DESIGN DRIFT - DO NOT
      x: 15.877
      y: 8.177
      w: 7.063
      h: 2.75
      font_size: 11
      items:
      - Matching or symmetrical scale patches
      - Rigid plate or all-leather costume
      - Embossed or printed scale texture
      - Hanging chest piece reading as jewellery
      - Bulky loose or oversized silhouette
    - heading: MATERIALS  —  SCALE / LEATHER / CLOTH / HARDWARE
      x: 15.15
      y: 11.32
      w: 7.79
      h: 3.4
      font_size: 11
      items:
      - 'Charcoal #2B2A26   Ash brown #3A352F'
      - 'Dust brown #544E42   Leather #6B5A47'
      - 'Faded tan #7C6F5B   Faded olive #4F563F'
      - 'Weathered black #2E2F33   Natural bone #BDAF95'
      - Matte and low-noise throughout nothing reflective
