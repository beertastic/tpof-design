      x: 0.45
      y: 11.0
      w: 7.25
      h: 4.7
      items:
      - Old working blade repeatedly sharpened
      - Wrapped and repaired grip
      - Secure silent sheath
      - Survival tool first weapon second
      - Personal and always close
    - heading: COMPACT BLASTER
      x: 7.9
      y: 11.0
      w: 7.25
      h: 4.7
      items:
      - Modified for reliability
      - Easy to conceal and draw
      - Mechanically believable construction
      - Replacement parts and worn finish
      - No oversized silhouette
    - heading: UTILITY & MAINTENANCE
      x: 15.35
      y: 11.0
      w: 7.55
      h: 4.7
      font_size: 11.5
      items:
      - Climbing rope lock picks and field tools
      - No datapad or unnecessary gadgets
      - Every item has a fixed habitual place
      - Checks and cleans equipment after every mission
      - Preparation is her method of controlling fear
