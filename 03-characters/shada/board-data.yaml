    sections:
    - heading: MOVEMENT PRINCIPLES
      x: 0.45
      y: 13.6
      w: 5.322
      h: 2.1
      font_size: 9.5
      items:
      - Economical and controlled
      - Low profile and quiet footwork
      - Patient before explosive action
      - Predatory never theatrical
      - Uses terrain shadow and distance
    - heading: ACTOR NOTES
      x: 6.173
      y: 13.6
      w: 5.322
      h: 2.1
      items:
      - Breathe low and quiet
      - Scan before speaking
      - Shift weight onto the balls of the feet
      - Avoid military posture
      - Warmth appears only around the crew
      font_size: 9.5
    - heading: FACIAL LANGUAGE
      x: 11.895
      y: 13.6
      w: 5.322
      h: 2.1
      items:
      - Neutral alertness
      - Suspicion without panic
      - Focused assessment
      - Protective toward the helpless
      - Cold lethal calm toward the hunted
      font_size: 9.5
    - heading: SPECIES TREATMENT
      x: 17.617
      y: 13.6
      w: 5.322
      h: 2.1
      font_size: 9.5
      items:
      - Scale texture at the edges of the face only
      - Temples cheekbone jawline neck behind the ear
      - Tonal and readable only in raking light
      - Makeup not prosthetics
      - Reptilian contact lenses do most of the work
