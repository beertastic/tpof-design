    must_show:
      - >
        SCALE ARMOUR — SPORADIC PATCHES, NOT A SUIT AND NOT A MATCHED SET.
        THE PLATE — THIS IS THE BUILT OBJECT, MATCH IT.
        A flat six-sided plate about the width of two fingers. A REGULAR
        EQUILATERAL HEXAGON with six straight sides and slightly soft, rounded,
        uneven edges — cut and cast by hand, never machine-crisp. Never round,
        never a coin, never a teardrop, NEVER A FISH-SCALE SHAPE.
        SURFACE: rough and pitted like sand-cast or corroded metal. A shallow
        raised lip runs around the rim of each plate. Dark iron-grey, almost
        black, going to pale worn silver on the raised edges where it has been
        handled. Matte, never bright, never polished.
        EVERY SINGLE PLATE CARRIES A RAISED SNAKE SWIRL. THIS IS NOT
        OPTIONAL AND NOT DECORATIVE DETAIL THAT CAN BE OMITTED — a plate without
        one is not this costume. If the plates in the image are blank, the image
        has failed.
        THE SWIRL: a single continuous line curling and winding across the face
        of the plate in the shape of a small snake — coiling back on itself,
        loosely S-shaped or spiralling, with a slightly thicker head at one end
        tapering to a fine tail at the other. It fills most of the plate face.
        IT IS RAISED, NOT STAMPED INTO THE SURFACE. The swirl stands PROUD of the
        face as a soft, worn, rounded ridge, catching light along its top edge
        and casting a faint shadow beside it. NOT engraved, NOT incised, NOT a
        recessed stamp, NOT a printed or etched line.
        THE SWIRL VARIES FROM PLATE TO PLATE. Every plate carries one, but
        no two are identical — the curl sits differently, the line runs
        thicker or thinner, some are nearly worn away. It is a common
        manufacturer's mark from cheap Outer Rim plate, and every mill, batch and
        worn die renders it a little differently. She did not choose it, and
        nobody remarks on it.
        TWO SMALL LACING HOLES per plate, punched near opposite edges, for the
        cord or wire that fixes it to the backing. The holes are visible.
        FOUR PATCHES, FOUR DIFFERENT MATERIALS. Mismatched salvaged alloys —
        dull grey steel, brass with green verdigris, dark bronze — and one patch
        may be HARDENED HIDE cut to the same hexagon rather than metal. Whatever
        it is cut from, EVERY PLATE IS A DISCRETE, COUNTABLE, PHYSICALLY SEPARATE
        PIECE. Never an embossed or printed pattern on a continuous leather
        panel, never a texture, never a pattern on cloth. Leather plates carry
        the serpent only faintly or not at all — a mill mark belongs in metal.
        TESSELLATED, NOT OVERLAPPED. The plates sit EDGE TO EDGE in a single
        flat plane. They DO NOT lap over one another — no layering, no shingling.
        THE PLATES ALMOST TOUCH. The gap between neighbours is a THIN DARK SEAM
        no wider than the plate is thick — a line, not a space. They are laid
        CLOSE AND TIGHT in a continuous field. NEVER spaced apart, NEVER
        scattered, NEVER floating on a web of connectors with the backing showing
        through in wide gaps between them.
        THE LACING IS THIN AND MOSTLY HIDDEN. Fine waxed cord or thin wire
        through the two holes, passing BEHIND the plates to the backing. NO
        chunky toggles, NO rubber knots, NO beads, NO visible web of connectors
        sitting proud of the plates. The fixing is barely noticeable; the metal
        is what you see.
        THE BACKING IS NOT MANUFACTURED. Worn leather or heavy cloth, HAND CUT
        with an irregular uneven edge, stitched by hand with uneven stitches, and
        visibly repurposed from something else. NO neat scalloped outline, NO
        even machine topstitching, NO symmetrical shape, NO finished product
        edge. If the backing looks like it came off a production line, the whole
        costume says somebody made this for her, and it is wrong.
        WITHIN ONE PATCH THE METAL IS BROADLY CONSISTENT — one trip, one source —
        with only two or three plates obviously replaced later in a different
        alloy. It is the FOUR PATCHES that differ from each other, not every
        plate within a patch. A panel where every single plate is a different
        metal reads as decorative mottling and loses the four-trips story.
        The flex comes from the seams and the lacing, not from plates sliding
        over each other.
        IT MUST NOT READ AS TECHNOLOGY. Regular hexagons meeting edge to edge is
        also the shape of carbon fibre, machined hex panelling and energy
        shielding, and that is the failure mode of this design. NO frames, NO
        bezels, NO channels around the plates, NO carbon weave, NO composite, NO
        glowing elements, NO polished or moulded surfaces, NO two plates finished
        alike. This is scrap cut into hexagons by hand and laced on, and the WORN
        SALVAGED FINISH is the only thing separating it from a tech panel.
        THE SHAPE AND THE MOTIF REPEAT. THE MATERIAL AND THE FINISH DO NOT.
        CRITICAL: it is applied in FOUR SMALL IRREGULAR PATCHES ONLY, all
        different and all deliberately asymmetric:
        SIDES ARE FIXED. All positions below are described from HER OWN left and
        right, not the viewer's. In a front view her right side appears on the
        viewer's left; in a back view it appears on the viewer's right.
        (1) A GAUNTLET ON HER RIGHT FOREARM ONLY — the viewer's left in a front
        view. Overlapping metal scales wrapping the outer forearm from wrist to
        just below the elbow, held by two worn leather straps and buckles at top
        and bottom. SHE HAS EXACTLY ONE GAUNTLET, NOT A PAIR. HER LEFT FOREARM IS
        COMPLETELY BARE — no gauntlet, no bracer, no wrap, no metal of any kind,
        showing only the fine inherited scales on her skin. If both forearms have
        metal on them, the image is wrong.
        (2) A CAP OVER HER LEFT SHOULDER ONLY — the viewer's right in a front view,
        and the OPPOSITE side to the gauntlet. Her right shoulder is bare.
        (3) A patch STITCHED FLAT onto the front of the garment over the CENTRE of
        the sternum — integrated into the vest, lying against it, NOT a hanging bib,
        NOT a pendant, NOT suspended from the collar. It must read as armour sewn
        on, not as jewellery.
        (4) A patch on HER LEFT OUTER THIGH — the viewer's right in a front view,
        the same side as the shoulder cap. Her right thigh has no metal.
        THE FOUR PATCHES MUST BE FOUR DIFFERENT METALS. They came from four
        different scavenging trips and nothing matches:
        - the FOREARM GAUNTLET is dull grey steel, scratched and the most worn of
          the four — the oldest piece she owns;
        - the SHOULDER CAP is brass, with green verdigris collected in the gaps
          between plates;
        - the STERNUM PATCH is dark bronze, the darkest of the four, almost brown;
        - the THIGH PATCH is the newest — brighter and less worn than the others,
          clearly added later.
        Different sizes, different shapes, different ages. NO BREASTPLATE. NO FULL
        YOKE. NO MATCHING PAIRS OF ANYTHING. At most about a fifth of the costume
        carries metal; the rest is cloth and worn leather. The metal is the
        exception, and its mismatched colours are what prove nobody made this
        for her.
      - >
        FITTED AND CLOSE TO THE BODY. Her silhouette is compact and agile. The
        costume follows her figure — waist defined, nothing bulky, nothing loose,
        no oversized jacket or coat. She is small and quick, and the clothes say so.
      - >
        BARE ARMS AND SHOULDERS, showing the fine inherited scales on her skin at
        the shoulders, upper arms, forearms, hands, collarbone and neck. No sleeves
        covering them.
      - >
        WEAPONS — SIDES ARE FIXED. SHE IS RIGHT-HANDED. Positions are given from
        HER OWN left and right, not the viewer's.
        BLASTER: a WESTAR-35 BLASTER PISTOL on HER RIGHT THIGH, in a worn drop-leg
        holster held by a belt loop and a thigh strap, grip upward and angled
        slightly forward for a right-hand draw. In the holster, not an empty one.
        The specific in-universe model, not a generic sidearm: slab-sided and
        angular, dull silver-steel with BRASS PANELS let into the slide, a
        squared trigger guard, a prominent front sight and a worn black textured
        grip. Weathered and visibly used, never factory fresh.
        KNIFE: a well-used combat knife on HER LEFT HIP, in a secure sheath hanging
        from the belt, grip upward, positioned for a cross-draw with her right hand.
        Both weapons present and visible in every view. She is an assassin and a
        tracker; a costume record without her weapons is incomplete.
        Nothing is mirrored — she does not carry a matching item on both sides.
      - >
        EXTERIOR ONLY. She is never indoors and never on a ship. Every environment
        is exterior: wet forest, forest clearing, or the mercenary camp among the
        trees. NO ship corridors, NO bulkheads, NO control panels or warning
        lights, NO buildings, NO market stalls, NO crowds, NO interiors of any
        kind. If there is a wall or a ceiling in the image, it is wrong.
      - >
        FACE — BARELY THERE. Fine scale texture on the skin at the EDGES of her face
        only: the temples, the outer edge of the cheekbone, along the jawline, down
        the side of the neck, behind the ear. Tonal — the same colour as her skin,
        readable only where light rakes across it, easy to miss entirely in flat
        light. NOT across the nose, forehead, cheeks or mouth. She is a human actor
        in makeup, not a creature in prosthetics. Her irises are subtly reptilian.
        The effect is a hint of inherited history, not a transformation.
    description: >
      Light, fitted, scavenged armour protecting vital areas only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual six-sided metal plates. Every plate is
      a hexagon with six straight sides — never round, never a coin, never a
      fish-scale shape. Each is flat and about the width of two fingers, laced
      and riveted onto a flexible leather-and-fabric backing and laid so that each
      plate sits edge to edge with its neighbours, almost touching, separated only
      by a thin dark seam, and no frame or bezel around any plate. The lacing is
      fine and mostly hidden behind the plates, and the backing is hand-cut and
      irregular, never a neat manufactured panel.
      Tessellated, never overlapped and never shingled — a single flat plane. It
      must never read as carbon fibre or machined hex panelling; the worn
      salvaged finish is what keeps it off that. The flex comes from the gaps
      and the lacing.
      The individual plates are clearly visible and countable — real metal, never
      a texture and never a pattern printed on leather. Every plate carries the
      a RAISED serpent standing proud of the surface — a soft worn rounded ridge,
      never engraved and never a recessed stamp — and no two are identical: the
      curl sits differently, the line runs thicker or thinner, some are nearly
      worn away. It is a manufacturer's mark cast into cheap hull plate at the
      mill, industrial and meaningless, rendered a little differently by every
      batch and worn die. Never crisp, never ornamental. The
      plates are cut from salvaged hull plate rather than forged as armour:
      offcuts and machine panel, mismatched alloys oxidising at different rates —
      brass, bronze, dull steel, olive-green verdigris, patches of rust. The shape
      and the motif repeat; the material and the finish never do. Within any one patch
      the metal is broadly consistent, with only two or three plates obviously
      replaced later. Sections have plainly been
      replaced. Metallic but never bright: dulled, scratched, weathered to a low
      sheen, catching light in small dull glints across many facets. It appears
      ONLY in the four asymmetric patches listed in the non-negotiables — one
      forearm, one shoulder, the centre sternum and one thigh. It moves like heavy
      cloth rather than plate. DO NOT make this leather. DO NOT make it a printed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: for freedom of movement, heat and sensory function, and because it is
      what makes her inherited scales legible.
      The costume is CLOSE-FITTING AND FOLLOWS HER FIGURE. Waist defined, cut to
      the body, feminine. She is compact, agile and quick, and the clothes must
      say so — nothing bulky, nothing loose, no oversized jacket or coat swallowing
      her silhouette. It is still a working costume built for infiltration, not
      display: everything on it does a job.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A WESTAR-35 blaster pistol on her RIGHT THIGH in
      a drop-leg holster, and a well-used combat knife on her LEFT HIP. Nothing polished, ornamental or factory fresh.
