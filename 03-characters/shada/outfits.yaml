character: Shada
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

outfits:
  - id: working
    name: Infiltration dress
    scenes: "10, 23, 25 — her only costume"

    # See 03-characters/APPROVAL.md. Clear this block to unlock.
    approved:
      date: "2026-07-31"
      view: front
      reference: 03-characters/shada/source/artwork/turn-working-front.png
      note: "Front view locked. Match this for all other views"

    # Approved reference PLATES. Attached alongside the costume reference so the
    # material and the props stop being redrawn from words every time. This is
    # the prop lock recorded in 11-production-tracking/Shada-Image-TODO.md.
    references:
      - path: source/artwork/material-scale.png
        what: the scale plates, their finish and how the panel is assembled
      - path: source/artwork/knife.png
        what: the combat knife
      # For anything PHYSICALLY BUILT, the reference is a photograph of the
      # build, not a render. The blaster is being 3D printed, and the generated
      # blaster.png does not match the printed prop — no brass panels in the
      # slide, brown ribbed grip instead of black. Photograph the prop, save it
      # below, and uncomment. Until then the WESTAR-35 is held by words alone.
      # - path: reference/props/westar-35.jpg
      #   what: the WESTAR-35 blaster pistol, as built
    must_show:
      - >
        SCALE ARMOUR — THREE SMALL PATCHES ONLY, NEVER A SUIT AND NEVER A MATCHED
        SET. NO BREASTPLATE. NO FULL YOKE. NO TORSO PANEL. NO CHEST PLATE. At
        most about a fifth of the costume carries metal; the rest is cloth and
        worn leather.
        FOR WHAT A PLATE LOOKS LIKE, MATCH THE PLATE REFERENCE IMAGE FETCHED ABOVE.
        In brief: flat six-sided hexagons, SMALL — 10 to 15 mm across, about the size of a thumbnail. These are FINE SCALE, NOT LARGE PLATES: the forearm gauntlet alone carries well over a hundred of them, and a patch reads as a dense field of many small pieces rather than a dozen big ones, laid
        TESSELLATED EDGE TO EDGE and NEVER OVERLAPPED OR SHINGLED, each carrying
        a RAISED SNAKE SWIRL, laced to a hand-cut backing. Salvaged, pitted and
        worn — never machined, never polished, never carbon fibre or tech
        panelling.
        THREE PATCHES ONLY — FOREARM, SHOULDER, THIGH. THERE IS NO METAL ON HER
        TORSO: her chest, sternum and back are plain cloth. NO chest patch, NO
        sternum panel, NO bib, NO pendant, NO breastplate.
        SIDES ARE FIXED, and given from HER OWN left and right, never the
        viewer's. In a front view her right side appears on the viewer's left; in
        a back view it appears on the viewer's right.
        (1) A GAUNTLET ON HER RIGHT FOREARM ONLY — viewer's left in a front view.
        Wrapping the outer forearm from wrist to just below the elbow, held by
        two worn leather straps and buckles. EXACTLY ONE GAUNTLET, NOT A PAIR.
        HER LEFT FOREARM IS COMPLETELY BARE — no gauntlet, no bracer, no wrap, no
        metal of any kind. If both forearms have metal on them, the image is
        wrong.
        (2) A CAP OVER HER LEFT SHOULDER ONLY — viewer's right in a front view,
        the OPPOSITE side to the gauntlet. Her right shoulder is bare.
        (3) A PATCH ON HER LEFT OUTER THIGH — viewer's right in a front view, the
        same side as the shoulder cap. Her right thigh has no metal.
        Different sizes, different shapes, different ages, NO MATCHING PAIRS OF
        ANYTHING.
      - >
        THE THREE PATCHES ARE THREE DIFFERENT METALS, AND THIS KEEPS COMING BACK
        WRONG. They must NOT all be brass or all be gold. If the three patches
        read as the same metal, the image has failed — the mismatch is the whole
        point, because it is what proves nobody made this costume for her.
        - the FOREARM GAUNTLET is DULL GREY STEEL: cold, unpolished, scratched,
          the most worn of the three and the oldest piece she owns. NOT brass,
          NOT gold, NOT warm-toned.
        - the SHOULDER CAP is BRASS, warm yellow, with GREEN VERDIGRIS collected
          in the seams between plates.
        - the THIGH PATCH is DARK BRONZE, almost brown and noticeably deeper
          than the shoulder — and it is the NEWEST of the three, cleaner and
          less worn, clearly added later.
        Three clearly different colours and three different states of wear,
        readable side by side at a glance. Within any ONE patch the metal is
        consistent.
      - >
        FITTED AND CLOSE TO THE BODY. Her silhouette is compact and agile. The
        costume follows her figure — waist defined, nothing bulky, nothing loose,
        no oversized jacket or coat. She is small and quick, and the clothes say so.
      - >
        BARE ARMS AND BARE SHOULDERS. Her arms are UNCOVERED from the shoulder
        down — no sleeves of any length, no sleeve, no arm wrap, no gloves, no
        undershirt showing at the arm. The vest is SLEEVELESS. Her shoulders,
        upper arms, forearms, hands, collarbone and neck are all exposed skin,
        showing the fine inherited scales. The only thing on either arm is the
        single scale gauntlet on her right forearm.
        NOTHING AROUND HER NECK OR HEAD. No scarf, no shawl, no cowl, no hood, no
        neck wrap, no headwrap. Her hair is up and her neck and collarbone are
        visible. If her arms are covered or there is cloth at her throat, the
        image is wrong.
      - >
        HER SKIN CARRIES FINE INHERITED SCALES, AND THIS IS WHAT MAKES HER NOT
        HUMAN. The snake ancestry is TENS OF THOUSANDS OF YEARS BACK — so distant
        that almost nothing of it survives. She is human to look at, and this is
        the one trace left. That is why it is faint: it is not a costume choice,
        it is the last of something very old.
        THINK OF IT AS A TATTOO RATHER THAN AS ARMOUR. A fine, close-set scale
        pattern lying FLAT ON the skin, like faint ink under the surface — not
        raised, not applied, not a separate layer, nothing you could lift off.
        It follows the exposed skin of her shoulders, upper arms, forearms, the
        backs of her hands, her collarbone and the sides of her neck.
        TONAL, NOT COLOURED. The same colour as her skin, very slightly raised,
        readable where light rakes across it and easy to miss in flat frontal
        light. Never painted on and never a printed pattern. It is skin and reads as skin:
        the metal plates catch the light, this texture does not, and it stays the
        same colour and finish as the rest of her.
        MUCH FINER THAN THE METAL PLATES. The plates are 10 to 15 mm; this is
        skin texture at a fraction of that, closer to the scales of a snake than
        to anything made. The two must never be confused for each other.
        IF HER ARMS AND SHOULDERS ARE SMOOTH HUMAN SKIN, THE IMAGE HAS FAILED.
        Without this she is a woman in salvaged armour, and the entire serpentine
        ancestry — the thing her design exists to carry — is gone.
      - >
        WEAPONS — SIDES ARE FIXED. SHE IS RIGHT-HANDED. Positions are given from
        HER OWN left and right, not the viewer's.
        BLASTER: a WESTAR-35 BLASTER PISTOL ON HER RIGHT SIDE — hip or thigh,
        either is fine, but ALWAYS HER RIGHT AND NEVER HER LEFT. In a worn
        holster, grip upward and angled slightly forward for a right-hand draw.
        In the holster, not an empty one.
        The specific in-universe model, not a generic sidearm: slab-sided and
        angular, dull silver-steel with BRASS PANELS let into the slide, a
        squared trigger guard, a prominent front sight and a worn black textured
        grip. Weathered and visibly used, never factory fresh.
        KNIFE: a well-used combat knife on HER LEFT HIP, in a secure sheath hanging
        from the belt, grip upward, positioned for a cross-draw with her right hand.
        Both weapons present and visible in every view. She is an assassin and a
        tracker; a costume record without her weapons is incomplete.
        Nothing is mirrored — she does not carry a matching item on both sides.
      - >
        EXTERIOR, WITH ONE EXCEPTION. Almost every place she is seen is
        exterior: wet forest, forest clearing, or the mercenary camp among the
        trees. NO buildings, NO market stalls, NO crowds, NO interiors —
        EXCEPT the mercenary ship's main hold in Scene 10, the Sabacc game,
        which moved inside on 2026-08-01. That is the ONLY interior she is ever
        in, it is a cramped salvaged cargo hold lit by a single swinging work
        lamp, and it is not a corridor, a cockpit or a bridge. If an image is
        not slot 2 and has a wall, a bulkhead, a control panel or a warning
        light in it, it is wrong.
        THIS RULE DOES NOT APPLY TO STUDIO REFERENCE PLATES. A plain seamless
        backdrop is not a location and not an interior — it is the absence of
        one. Where the shot description below calls for a plain studio
        background, or for an object on a plain neutral surface, THAT GOVERNS
        and there is no environment for this rule to judge. Do not add a forest,
        trees, foliage, mist or any outdoor setting to a studio plate.
      - >
        FACE — BARELY THERE. Fine scale texture on the skin at the EDGES of her face
        only: the temples, the outer edge of the cheekbone, along the jawline, down
        the side of the neck, behind the ear. Tonal — the same colour as her skin,
        readable only where light rakes across it, easy to miss entirely in flat
        light. NOT across the nose, forehead, cheeks or mouth. She is a human actor
        in makeup, not a creature in prosthetics. Her irises are subtly reptilian.
        The effect is a hint of inherited history, not a transformation.
    description: >
      Light, fitted, scavenged armour in three small patches only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual six-sided metal plates. Every plate is
      a hexagon with six straight sides — never round, never a coin, never a
      fish-scale shape. EACH PLATE IS SMALL — 10 to 15 mm across, about the size of a thumbnail. These are FINE SCALE, NOT LARGE PLATES: the forearm gauntlet alone carries well over a hundred of them, and a patch reads as a dense field of many small pieces rather than a dozen big ones. Each is flat and laced
      and riveted onto a flexible leather-and-fabric backing and laid so that each
      plate sits edge to edge with its neighbours, almost touching, separated only
      by a thin dark seam, and no frame or bezel around any plate. The lacing is
      fine and mostly hidden behind the plates, and the backing is hand-cut and
      irregular, never a neat manufactured panel.
      Tessellated, never overlapped and never shingled — a single flat plane. It
      must never read as carbon fibre or machined hex panelling; the worn
      salvaged finish is what keeps it off that. The flex comes from the gaps
      and the lacing.
      The individual plates are clearly visible and countable — real metal, never
      a texture and never a pattern printed on leather. Every plate carries the
      a RAISED serpent standing proud of the surface — a soft worn rounded ridge,
      never engraved and never a recessed stamp — and no two are identical: the
      curl sits differently, the line runs thicker or thinner, some are nearly
      worn away. It is a manufacturer's mark cast into cheap hull plate at the
      mill, industrial and meaningless, rendered a little differently by every
      batch and worn die. Never crisp, never ornamental. The
      plates are cut from salvaged hull plate rather than forged as armour:
      offcuts and machine panel, mismatched alloys oxidising at different rates —
      brass, bronze, dull steel, olive-green verdigris, patches of rust. The shape
      and the motif repeat; the material and the finish never do. Within any one patch
      the metal is broadly consistent, with only two or three plates obviously
      replaced later. Sections have plainly been
      replaced. Metallic but never bright: dulled, scratched, weathered to a low
      sheen, catching light in small dull glints across many facets. It appears
      ONLY in the three asymmetric patches listed in the non-negotiables — one
      forearm, one shoulder and one thigh. It moves like heavy
      cloth rather than plate. DO NOT make this leather. DO NOT make it a printed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: for freedom of movement, heat and sensory function, and because it is
      what makes her inherited scales legible.
      The costume is CLOSE-FITTING AND FOLLOWS HER FIGURE. Waist defined, cut to
      the body, feminine. She is compact, agile and quick, and the clothes must
      say so — nothing bulky, nothing loose, no oversized jacket or coat swallowing
      her silhouette. It is still a working costume built for infiltration, not
      display: everything on it does a job.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A WESTAR-35 blaster pistol on her RIGHT SIDE, hip or
      thigh, and a well-used combat knife on her LEFT HIP. Nothing polished, ornamental or factory fresh.
