    must_show:
      # FIRST, AND FIRST FOR A REASON. Added 2026-08-01 after a generation came
      # back wearing the right costume on the wrong woman: it took the likeness
      # off the costume reference, which is a full-length portrait of a woman in
      # exactly this costume, and never says it is not a face reference. With
      # six attachments competing, the most face-like image wins unless told
      # otherwise. Saying "use the actor photo" is not enough — the other
      # photographs have to be explicitly disqualified.
      - pin: true
        text: >
          TAKE THE FACE ONLY FROM THE ACTOR PHOTOGRAPHS.
          THE COSTUME PHOTOGRAPH IS ATTACHED FOR THE COSTUME, NOT THE FACE.
          Build the face from the actor photographs alone.
          A full-figure costume photograph is attached and it is attached for the
          COSTUME. Take no face, no head, no hair and no likeness from it, however
          clear or well-lit the face in it is.
          The face, the head, the bone structure and the build come from the ACTOR
          photographs and from nowhere else. If the person in your image is
          recognisably the woman in a costume photograph rather than the woman in
          the actor photographs, THE IMAGE HAS FAILED and nothing else about it
          matters.
          HER HAIR is dark brown, worn UP in a loose working knot with strands
          escaping at the temples and the nape — from the description, not from
          any photograph.
      # SECOND, and added 2026-08-02 after a generation came back as CAPTAIN JASU
      # wearing Shada's face: bone horns, a full-width scale yoke across the
      # shoulders, a quilted long-sleeved bodysuit and a matched pair of
      # bracers. Every one of those is Jasu's costume, and none of them is
      # forbidden anywhere a short prompt could still see — "NO YOKE" was in the
      # placement rule and the trim had cut it.
      #
      # The cause is almost certainly a shared conversation rather than a bad
      # roll: her set was generated the day before, and a model that has just
      # drawn one character in this production will carry it forward. The fix is
      # a fresh chat, but the prompt should survive the mistake, so the four
      # tells are named here as hard negations that the trim will keep.
      - >
        SHE IS SHADA, NOT ANY OTHER CHARACTER IN THIS FILM.
        NO HORNS, NO HEADDRESS, NO HELMET.
        NO YOKE ACROSS SHOULDERS OR UPPER CHEST.
        NO SLEEVES, NO BODYSUIT, NO SECOND BRACER.
        Nothing in or on her hair, and no collar piece or shoulder-to-shoulder
        panel of any kind.
        If you have drawn another character from this production in this
        conversation, NONE of that costume carries over. Bone trophies, quilted
        sleeves, a scale yoke, matched wrist bracers and a hanging cord with a
        pendant all belong to a DIFFERENT character and must not appear here.
      # The first sentence is the only one the short prompts are guaranteed to
      # keep, so the three POSITIONS live there. They used to be twenty lines
      # down, and the short prompt therefore said "three patches, not on the
      # torso" without ever saying where they went — so a generation put all
      # three on the vest and left the forearm, shoulder and thigh bare.
      # 2026-08-01.
      # REVISED A THIRD TIME 2026-08-01, and this one restores the flank panels
      # that the second revision had dropped. Recorded in Character-Lock.md v4.0.
      #
      # The second revision dropped them on the argument that a shaped panel
      # each side, laced at the centre front, would read as a corset. A
      # generation of exactly that shape showed otherwise: it reads as
      # brigandine, and the vest cloth and placket visible in the lacing gap are
      # what keep it off a corset. The picture settled the argument, in the
      # opposite direction to the last one.
      # The lead sentence was rewritten 2026-08-02 to carry the four POSITIONS
      # rather than four bare body parts, and the anti-swap negation was moved to
      # second so the trim keeps it. The generation that day put the gauntlet on
      # her left forearm and the shoulder cap on her right — the two exchanged
      # sides while the blaster stayed correct, so it was not a mirrored image,
      # it was two pieces reading as interchangeable.
      # NOT pinned, deliberately. Its check line below carries the load-bearing
      # clause to the end of the prompt, so pinning the full 1,863 characters as
      # well bought redundancy at the cost of dropping every unpinned rule from
      # cap 354 to 196. Pinning does not create budget; it decides who pays.
      - check: "Gauntlet her RIGHT forearm. Cap her LEFT shoulder. NEVER swapped, NEVER a pair."
        text: >
          FIVE HARD PIECES: GAUNTLET HER RIGHT FOREARM, CAP HER LEFT SHOULDER,
          PATCH HER LEFT THIGH, FLANK PANELS BOTH SIDES.
          CAP AND GAUNTLET NEVER SWAP.
          NOWHERE ELSE. NEVER A FULL SUIT. NO BREASTPLATE, NO SOLID CHEST PLATE, NO BIB, NO
          PENDANT, NO YOKE. Roughly a quarter of the costume carries metal; the
          rest is cloth and worn leather.
          They are on OPPOSITE sides of her body and that is deliberate: one arm
          armoured and the other shoulder armoured is what stops a scavenged
          mismatch reading as a set somebody made for her. An image with the
          gauntlet on her left, or the cap on her right, has failed.
          SIDES ARE FIXED, and given from HER OWN left and right, never the
          viewer's. In a front view her right side appears on the viewer's left; in
          a back view it appears on the viewer's right.
          (1) A GAUNTLET ON HER RIGHT FOREARM ONLY — viewer's left in a front view.
          See the gauntlet rule below: it is a SOLID PRINTED SHELL, not laced
          plates. EXACTLY ONE GAUNTLET, NOT A PAIR. HER LEFT FOREARM IS COMPLETELY
          BARE — no gauntlet, no bracer, no wrap of any kind.
          (2) A LOOSE SCALE CAP OVER HER LEFT SHOULDER ONLY — viewer's right in a
          front view, the OPPOSITE side to the gauntlet. Her right shoulder is
          bare. See the shoulder rule below.
          (3) A SCALE PATCH ON HER LEFT OUTER THIGH — viewer's right in a front
          view, the same side as the shoulder cap. A dense field of small plates
          laced onto the outer trouser leg from hip to above the knee. Her right
          thigh has no metal.
          (4 and 5) A PAIR OF SCALE FLANK PANELS over her ribs, worn OVER the vest
          and laced together across her centre front — see the flank panel rule
          below. They are the only metal on her torso.
          Different sizes, different shapes, different ages. NOTHING IS MIRRORED
          except the flank panels, which exist on both sides because ribs do — and
          they are kept in different metals of different ages for exactly that
          reason.
      # The build is printing this piece, so the prompt describes the printed
      # object rather than a drawing of one. Added 2026-08-01.
      - >
        THE GAUNTLET IS A SOLID ONE-PIECE PRINTED SHELL, NOT LACED PLATES AND
        NOT LEATHER.
        A SMALL CLUSTER OF DIM AMBER TELLTALES AT THE WRIST, AND NO OTHER LIGHT
        ON THE COSTUME.
        MATCH THE GAUNTLET IN THE COSTUME PHOTOGRAPH EXACTLY.
        It wraps the OUTER RIGHT FOREARM from the wrist to just below the elbow,
        strapped over a worn taupe leather cuff that shows above and below it.
        It is ONE RIGID SURFACE — a single moulded piece with no separate plates,
        no lacing and no backing showing through. It does not flex.
        THE FACE OF THE SHELL IS PLAIN WORN PLATE, not a field of hexagons: a
        broad flat panel with a shallow border line following its edge, a scatter
        of small rivets, and a FAINT RAISED SERPENT SWIRL worn almost away. The
        hexagon field belongs to the other pieces; this one is a hull offcut.
        DULL GREY STEEL, pitted and hand-finished, with PALE WORN SILVER along
        the raised edges where a hand has gripped it for years. Never bright,
        never polished, never chrome.
        A SMALL CLUSTER OF FOUR TO SIX TELLTALES NEAR THE WRIST — dim amber
        pinpoints the size of a match head, dirty and half-dead, set INTO the
        shell in a tight group, as in the costume photograph. NO GLOW ON HER SKIN OR THE LEATHER, no
        light spill, no lit seams, no edge lighting, no illuminated hexagons and
        no blue. Salvaged electronics that still work, not a light source. If the
        gauntlet lights the shot, the image has failed.
        THIS IS THE ONLY RIGID THING SHE WEARS. The shoulder cap and the thigh
        patch remain flexible fields of separate plates and must not be printed,
        moulded or solid.
      # Added 2026-08-01. "Shoulder cap" on its own generates a fitted pauldron
      # every time, which is a made-for-her object and the exact failure the
      # whole mismatch argument exists to prevent.
      # Reworded 2026-08-02: the lead sentence now says SCALE PLATES, because
      # the costume photograph it is attached to shows a smooth solid plate on
      # that shoulder and an image beats a paragraph. "Cap" alone was safe while
      # the reference showed a scale cap; it is not safe now.
      # Re-ordered 2026-08-03. The lead used to be "A LOOSE FIELD OF SMALL SCALE
      # PLATES… A PALM'S WIDTH", so at Shada's cap of ~146 the generator received
      # the cap's SIZE and nothing about how it SITS — and returned a cap moulded
      # tight to the shoulder in every generation for four days. The drape was
      # written, detailed and correct, 700 characters further down, and was cut
      # from every short prompt ever produced. It reads as a design fault and it
      # is a trim fault. DAYLIGHT UNDER THE LOWER EDGE now leads, because that is
      # the single observable that distinguishes a scavenged cap from a pauldron.
      - >
        THE SHOULDER CAP HANGS LOOSE ON HER LEFT SHOULDER, A PALM'S WIDTH, WITH
        DAYLIGHT UNDER ITS LOWER EDGE.
        NEVER MOULDED OR FITTED TO THE SHOULDER.
        It lifts away from the body, swings when she turns, and stands off her
        shoulder by a few centimetres along its lower edge — it drapes over the
        shoulder rather than gripping it front to back.
        NEVER A SOLID PAULDRON OR ONE SMOOTH PLATE.
        NEVER DOWN THE ARM AND NEVER TO THE COLLARBONE.
        It covers THE POINT OF HER LEFT SHOULDER AND NOTHING ELSE, roughly the
        size of the palm of a hand — a size that took three passes to settle. Its
        OUTER edge stops where the shoulder becomes the arm — it does not run
        down her upper arm. Its INNER edge stays well clear of her collarbone and
        never crosses toward the centre front of the vest. Its lower edge stops
        well above the armpit. An oversized cap is how a YOKE gets back into this
        costume under another name, and the yoke is the most persistent failure
        this character has.
        The plates are the same 10-15 mm hexagons as the rest of the costume,
        about twenty-five to thirty-five of them, and three to five are MISSING.
        The cap is OBVIOUSLY SCAVENGED.
        Genuinely SEPARATE plates laced to a HAND-CUT, IRREGULAR backing, sitting
        AWAY FROM THE BODY over the point of her left shoulder. It hangs, it
        lifts, it swings when she turns, and DAYLIGHT SHOWS UNDER ITS LOWER EDGE.
        The bottom edge is ragged and uneven, following where the backing was cut
        rather than any designed outline.
        It is held on by a THIN STRAP UNDER THE ARM and a TIE TO THE VEST
        SHOULDER, both visibly improvised and mismatched.
        BLACKENED IRON — dark, matte, nearly black, with rust caught in the
        pitting.
        A cap that FITS her shoulder is a cap somebody MADE for her, and that is
        the failure. This one was cut off something else and tied on.
      # Plate geometry given its own rule 2026-08-01. It used to be a paragraph
      # inside the placement rule, which meant the short prompts carried no
      # dimension and no count at all — the plates were free-floating in every
      # generation, and came back three to four times too big. Size confirmed
      # 2026-07-31 and re-confirmed today: 10 to 15 mm stands.
      # Restored 2026-08-01 in the third revision. The form is a brigandine:
      # shaped panels laced across the body. The lacing does three jobs — it
      # closes it, it lets a scavenged thing be fitted to a body, and it is
      # visibly hand-made, which is the same argument that keeps a modern zip
      # off the vest.
      # Lead sentence rewritten 2026-08-02. The lacing and the cloth gap were
      # sentences four and five and the trim dropped both, so the short prompt
      # said where the panels sit and never said they lace — and they came back
      # as two hanging slabs with no closure and no gap.
      - >
        THE FLANK PANELS LACE ACROSS HER CENTRE FRONT OVER THE VEST, WITH A
        STRIP OF VEST CLOTH SHOWING IN THE GAP.
        RIBS, WAIST AND HIP ONLY — NEVER ABOVE THE ARMPIT.
        NOT A YOKE, NOT A BREASTPLATE, NOT A CORSET.
        NOTHING CROSSES HER SHOULDERS OR UPPER CHEST.
        THE SCALE PANELS SIT ON HER LOWER TORSO — RIBS, WAIST AND HIP.
        ONE PANEL EACH SIDE, covering the side of the ribcage from BELOW THE
        ARMPIT — never above it — down to the hem of the vest. The top edge sits
        at about the bottom of the shoulder blade, and the whole of her chest
        above that line is plain cloth. They FOLLOW THE RIBS, draw in at the
        waist and flare slightly over the hip: the shaping is structural, because
        that is the shape of the body under them, and it is not styling.
        THEY MEET AT THE CENTRE FRONT AND ARE LACED TOGETHER — a leather thong
        zig-zagging between punched eyelets down both facing edges and tied off
        at the bottom. A STRIP OF VEST CLOTH SHOWS BETWEEN THEM, with the
        concealed placket and the centre-front seam visible in the gap. That
        visible strip of cloth is what keeps this off a corset and it must not
        close up. The LACING IS THE CLOSURE and it must be visible. NO buckle
        plate, NO clasp, NO zip, NO seamless join.
        AT THE BACK they are held by TWO SALVAGED STRAPS AND BUCKLES. NOTHING
        GOES OVER HER SHOULDER — the panels hang on the lacing and the straps, so
        her arms and shoulders stay clear.
        THE TWO PANELS DO NOT MATCH. Different metal, different age, one visibly
        added later than the other — a pair in what they do, never in how they
        look. If they read as a matched, made-for-her set, the image has failed.
        WITHIN ONE PANEL THE METAL IS ALL ONE METAL. A panel speckled with four
        different alloys reads as decorative mottling and loses the story: one
        panel is one piece of salvage from one trip.
      # 2026-08-02: the costume photograph now attached as THE costume shows
      # plates roughly twice the specified size, so the size rule has to argue
      # against an image and not just against a habit. Second sentence says so
      # outright, and the trim keeps the first negation after the head.
      - check: "Plates SMALL: TWELVE across a flank panel, not six big ones. Flat hexagons, never shingled."
        text: >
          EACH PLATE IS 10-15 mm — TWELVE OF THEM ACROSS A FLANK PANEL.
          NEVER OVERLAPPED — THEY BUTT EDGE TO EDGE.
          FIVE METALS, NO BRASS, AND PLATES MISSING.
          Match the plate size in the costume photograph exactly.
          TESSELLATION, SAID POSITIVELY, because the prohibition alone has never
          been enough: every plate lies FLAT IN THE SAME PLANE as its neighbours,
          six flat sides butted against six flat sides. Between two plates there
          is a THIN DARK LINE showing the backing beneath, and nothing else — no
          plate edge riding over another, no shadow of an upper plate falling on a
          lower one, no stepped or layered surface. A hand run flat across the
          panel would not catch. NOT shingled, NOT lamellar, NOT roof tiles, NOT
          fish scales.
          THE WEAR IS PART OF THE SPECIFICATION. Five to ten plates MISSING from
          each flank panel and three to five from the shoulder cap, leaving
          scattered dark gaps where the hand-cut backing shows through — along the
          edges, at the waist, over the hip, at the top edge of the cap, the places
          that catch and flex. Bent corners, chipped and cracked plates, rows
          drifting out of line, an eyelet torn out and re-punched beside the old
          hole, a different cord spliced into the lacing where it broke. Worn hard
          and repaired badly, but still maintained — she is alive because it works.
          It must read as SURVIVED IN, never as laid out, and never as ruined.
          A DENSE FIELD OF HUNDREDS, AND NEVER A DOZEN BIG ONES. But do not go
          finer either: at about twelve across a panel each plate is still an
          INDIVIDUALLY VISIBLE hexagon you could put a fingertip on. A pass that
          shrank them further turned the panels into CHAIN MAIL, which is as wrong
          as making them too big. NOT chain mail, NOT ring mail, NOT a woven metal
          fabric, NOT a fine allover shimmer with no separate pieces in it.
          If they read as the same
          metal, the image has failed — the mismatch is the whole point, because it
          is what proves nobody made this costume for her.
          - the GAUNTLET on her RIGHT FOREARM is DULL GREY STEEL: cold, unpolished,
            pitted, with pale worn silver on the raised edges. NOT brass, NOT gold,
            NOT warm-toned.
          - the SHOULDER CAP on her LEFT SHOULDER is BLACKENED IRON — dark, matte,
            nearly black, with rust caught in the pitting.
          - the THIGH PATCH on her LEFT OUTER THIGH is DARK BRONZE, almost brown
            and the WARMEST thing on the costume — and it is the NEWEST, cleaner
            and less worn, clearly added later.
          - her RIGHT FLANK PANEL is PALE WORN PEWTER — cold, almost white-grey,
            thin and scratched right through in places. The OLDEST thing she owns.
          - her LEFT FLANK PANEL is RUST-RED OXIDISED IRON — brown-red and heavily
            corroded. Obviously not the same salvage as her right panel, and
            obviously acquired later.
          Five clearly different colours and five different states of wear,
          readable side by side at a glance. WITHIN ANY ONE PIECE THE METAL IS ALL
          ONE METAL — a panel speckled with several alloys is decorative mottling
          and is wrong.
          NO BRASS AND NO VERDIGRIS ANYWHERE ON THIS COSTUME.
          EACH PLATE IS 10-15 mm ACROSS — A DENSE FIELD OF MANY TINY PIECES, NEVER
          A DOZEN BIG ONES.
          About the size of a thumbnail. ONE FLANK PANEL alone carries WELL OVER A
          HUNDRED of them — about twelve across its width and fifteen rows down.
          The gauntlet is not part of this rule — it is a plain shell, not a
          hexagon field.
          FOR WHAT A PLATE LOOKS LIKE, MATCH THE PLATE PHOTOGRAPH FETCHED ABOVE.
          Flat six-sided hexagons, each carrying a RAISED SNAKE SWIRL, laced to a
          hand-cut backing.
      # Promoted to its own rule 2026-08-03 — the third time this exact failure
      # has been fixed the same way, after the reptilian eyes and the trousers.
      # "Salvaged, pitted and worn — never machined, never polished, never carbon
      # fibre or tech panelling" was the LAST SENTENCE of the rule above, which is
      # the longest in the file at 3,555 characters, so the trim cut it from every
      # short prompt. The same sentence also sat in the outfit `description:`,
      # which short.py does not read at all. It therefore reached no short prompt
      # by either route.
      #
      # It became load-bearing on 2026-08-03, when the plates were made a printed
      # part and the shape was deliberately locked to one master. Uniform shape
      # plus uniform finish is machined tile — and that is exactly what came back:
      # crisp embossed panelling, every plate equally new. Once the geometry stops
      # varying, the WEAR is the only thing left carrying the salvage, so the rule
      # that protects it can no longer be the clause most likely to be trimmed.
      - check: "Plates WORN salvage — uniform SHAPE, uneven WEAR. Never crisp machined panelling."
        text: >
          THE PLATES ARE SALVAGE AND THEY ARE WORN. They must NEVER read as carbon
          fibre, machined hex panelling, embossed tile or new decorative
          metalwork. The shape is deliberately uniform, so the worn finish is the
          ONLY thing keeping them off that.
          THE SHAPE IS UNIFORM; THE WEAR IS NOT. Between neighbouring plates the
          serpent ridge is worn flat on some and still sharp on others; paint and
          grime have gone from the high points of some and stayed in the hollows
          of others; the scratches, dents, chips and pitting differ on every
          plate. The raised rim softens where a plate has been handled, and never
          reads as a crisp bezel around every one. Two or three plates in any
          patch are plainly later replacements in a different metal.
      # The garment and its coverage were two rules until 2026-08-01; merged,
      # because they describe one object and eleven rules dropped the per-rule
      # budget far enough to start truncating the others.
      #
      # Written from a garment reference the same day. The vest kept generating
      # as a plain scoop-neck tank, because "sleeveless vest, fitted, front
      # closure" is an accurate description of one. What makes it read as BUILT
      # rather than bought is the panelling — and a concealed placket also
      # removes the modern coil zip, the fault this costume has never beaten.
      # Lead sentence rewritten 2026-08-02 to carry the COLLAR and the PLACKET.
      # They were sentence two, the trim dropped them, and the vest came back as
      # a crossover V-neck wrap — a garment nothing in the file describes, and
      # the one shape the short prompt had stopped forbidding.
      # MATERIAL AND COLOUR BOTH CHANGED 2026-08-02, on the Production
      # Designer's call, after two variant generations tested them. The vest was
      # scavenged HIDE in dark brown; it is now CLOTH in a dusty grey. The hide
      # was never wrong, but cloth reads as the flexible base layer the hard
      # pieces are strapped over, and the grey lets the five metals separate
      # from the garment instead of sinking into it.
      - >
        A PANELLED SLEEVELESS VEST IN DUSTY GREY CLOTH, WITH A STAND COLLAR AND
        CONCEALED PLACKET.
        CLOTH, NEVER LEATHER — NO WRAP FRONT, NO V-NECK, NO ZIP.
        The placket runs DOWN THE CENTRE FRONT and the collar stands away from
        the neck, open at the throat.
        THE MATERIAL IS CLOTH — a heavy, close-woven working fabric, matte, dry
        and sun-faded, with the softness and the give of cloth. It is her BASE
        LAYER: the flexible thing the hard pieces are strapped over. It must read
        as FABRIC AND NOT AS HIDE — no leather sheen, no leather grain, no stiff
        moulded panel edges, no rigidity anywhere in the garment. Where a plate,
        a strap or a buckle bears on it THE CLOTH COMPRESSES AND WRINKLES, and
        there are soft creases at the waist above the belt and at the armhole.
        Flexible is not slack: it is still close-fitting and cut to her figure.
        THE COLOUR IS A DUSTY, SUN-BLEACHED STONE GREY with only a HINT of
        khaki-green left in it. The green is a CAST, not a colour — enough that
        it does not read as neutral concrete, not enough that anyone would call
        it olive. NOT blue-grey, NOT slate, NOT charcoal, NOT silver, NOT a clean
        neutral grey. The colour of weathered canvas left out for years. It is
        the LIGHTEST thing she wears, lighter than the trousers, rubbed paler
        still at the seams and the wear points.
        BARE ARMS AND BARE SHOULDERS. PRINCESS SEAMS, RAW HEM.
        NO SLEEVES, NO BARE MIDRIFF, NO CROP TOP.
        THIS IS NOT A TANK TOP AND NOT A VEST TOP, AND NOT A ONE-SHOULDER DRAPE.
        It runs from the collarbone to below the waist, and her stomach, flanks
        and lower back are NEVER exposed — she is an infiltrator in salvaged
        working kit, not a figure in a costume designed to be looked at. Her silhouette
        is compact and agile, the costume cut to her figure, waist defined,
        nothing bulky, nothing loose, no oversized jacket or coat.
        THE COLLAR is a low band, 2 to 3 cm, standing away from the neck and OPEN
        at the front — her throat and collarbone stay visible and the scale
        pattern on them must still read. Never a funnel, never a polo neck,
        never closed to the chin.
        THE FRONT CLOSURE is hidden behind a flat band of cloth down the centre
        front. Nothing on the outside shows how it fastens.
        THE SEAMING is what makes it: curved princess seams running from the
        shoulder over the bust down to the hem, and a curved panel seam under the
        bust. The body is built from shaped panels, not cut from one piece, and
        every seam is visible as construction.
        THE SHOULDER is CUT ON — the cloth extends from the body to a small
        squared cap just past the point of the shoulder, with NO set-in sleeve
        and no seam at the top of the armhole. Her arm is bare below it and the
        armhole is cut high and close under the arm.
        THE HEM is shaped, dipping at centre front and back and rising at the
        sides, and its edge is RAW AND FRAYING — cut and left, never turned,
        never topstitched.
        THE CLOTH CARRIES A FAINT SERPENTINE GRAIN — WOVEN INTO THE MATERIAL,
        NEVER A PRINTED PATTERN. A dry matte cloth that does not catch the light,
        rubbed paler at the seams and the wear points, whose WEAVE ITSELF holds a
        FINE, CLOSE, IRREGULAR SNAKE-SKIN TEXTURE. TONAL — exactly the same
        colour as the rest of the vest — and readable ONLY where light rakes
        across the surface. At two paces it is a plain worn grey vest; the grain
        is something you find on the third look.
        NOT A REPTILE PRINT. No repeating motif, no decorative pattern, no
        crocodile or python print, nothing that looks bought. She did not choose
        it; it is simply what the cloth was. (Until 2026-08-02 this was a grain
        pressed into scavenged hide. The vest is cloth now, so the same idea
        lives in the weave — it survived the material change on purpose,
        because it is the quietest thing in the costume carrying her ancestry.)
        IT IS NOT THE SCALE ARMOUR AND MUST NEVER BE CONFUSED WITH IT. The armour
        is discrete, countable, separate pieces of METAL that catch the light;
        this is the surface of a piece of cloth and it catches nothing. It is
        also FINER AND FLATTER THAN THE SCALE ON HER SKIN, which is a third thing
        again. Three textures, three scales, never blended.
        THE FLANK PANELS ARE WORN OVER THIS VEST and cover its sides, but the
        centre front stays visible between them: the collar, the placket and a
        strip of vest cloth down the middle are all still readable.
        BARE ARMS AND BARE SHOULDERS, EXCEPT THE PRINTED GAUNTLET ON HER RIGHT
        FOREARM AND THE LOOSE CAP ON HER LEFT SHOULDER.
        NO SCARF, COWL, HOOD OR NECK WRAP.
        Apart from those two pieces her arms are UNCOVERED from the shoulder
        down. The flank panels stop at her sides and NOTHING GOES OVER HER
        SHOULDER — no sleeves of any length, no sleeve, no arm wrap, no gloves, no
        undershirt showing at the arm. The vest is SLEEVELESS. Her shoulders,
        upper arms, forearms, hands, collarbone and neck are otherwise exposed
        skin, showing the fine inherited scales. No scarf, no shawl, no cowl, no hood, no
        neck wrap, no headwrap. Her hair is up and her neck and collarbone are
        visible above the vest's low open collar, which is the ONLY cloth
        permitted near her throat. If her arms are covered, or anything is
        wrapped round her neck, the image is wrong.
      - check: "Scale pattern TONAL — the SAME COLOUR as her skin. Never warm, orange or tan. Flat, not raised."
        text: >
          FINE SCALE PATTERN ON HER SHOULDERS, ARMS, COLLARBONE AND NECK — IT MUST
          BE VISIBLE HERE, NEVER SMOOTH SKIN.
          This is what makes her not
          HUMAN. The snake ancestry is TENS OF THOUSANDS OF YEARS BACK — so distant
          that almost nothing of it survives. She is human to look at, and this is
          the one trace left. That is why it is faint: it is not a costume choice,
          it is the last of something very old.
          THINK OF IT AS A TATTOO RATHER THAN AS ARMOUR. A fine, close-set scale
          pattern lying FLAT ON the skin, like faint ink under the surface — not
          raised, not applied, not a separate layer, nothing you could lift off.
          It follows the exposed skin of her shoulders, upper arms, forearms, the
          backs of her hands, her collarbone and the sides of her neck.
          TONAL, NOT COLOURED. The same colour as her skin, very slightly raised,
          readable where light rakes across it and easy to miss in flat frontal
          light. Never painted on and never a printed pattern. It is skin and reads as skin:
          the metal plates catch the light, this texture does not, and it stays the
          same colour and finish as the rest of her.
          MUCH FINER THAN THE METAL PLATES. The plates are 10 to 15 mm; this is
          skin texture at a fraction of that, closer to the scales of a snake than
          to anything made. The two must never be confused for each other.
          IF HER ARMS AND SHOULDERS ARE SMOOTH HUMAN SKIN, THE IMAGE HAS FAILED.
          Without this she is a woman in salvaged armour, and the entire serpentine
          ancestry — the thing her design exists to carry — is gone.
      # Rewritten 2026-08-02. The blaster sentence was long enough to eat the
