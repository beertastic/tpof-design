character: Shada
ratio: "2:3"

outfits:
  - id: working
    name: Infiltration dress
    scenes: "10, 24, 24A — her only costume"

    # See 03-characters/APPROVAL.md. Clear this block to unlock.
    approved:
      date: "2026-07-31"
      view: front
      reference: 03-characters/shada/source/artwork/turn-working-front.png
      note: "Front view locked. Match this for all other views"
    must_show:
      - >
        METAL SCALE ARMOUR — SPORADIC PATCHES, NOT A SUIT AND NOT A MATCHED SET.
        Individual overlapping metal scales, coin-sized, laced onto a flexible
        backing — countable, physically separate pieces of metal cut from salvaged
        scrap. NOT leather, NOT an embossed pattern.
        CRITICAL: it is applied in FOUR SMALL IRREGULAR PATCHES ONLY, all
        different and all deliberately asymmetric:
        (1) A GAUNTLET ON ONE FOREARM ONLY. Overlapping metal scales wrapping the
        outer forearm from wrist to just below the elbow, held by two worn leather
        straps and buckles at top and bottom. SHE HAS EXACTLY ONE GAUNTLET, NOT A
        PAIR. THE OTHER FOREARM IS COMPLETELY BARE — no gauntlet, no bracer, no
        wrap, no metal of any kind on it, showing only the fine inherited scales on
        her skin. If both forearms have metal on them, the image is wrong.
        (2) A cap over ONE shoulder only, not both.
        (3) A patch STITCHED FLAT onto the front of the garment over the sternum —
        integrated into the vest, lying against it, NOT a hanging bib, NOT a
        pendant, NOT suspended from the collar. It must read as armour sewn on, not
        as jewellery.
        (4) A patch on ONE outer thigh, over the trouser.
        THE FOUR PATCHES MUST BE FOUR DIFFERENT METALS. They came from four
        different scavenging trips and nothing matches:
        - the FOREARM GAUNTLET is dull grey steel, scratched and the most worn of
          the four — the oldest piece she owns;
        - the SHOULDER CAP is brass, with green verdigris collected in the overlaps
          between scales;
        - the STERNUM PATCH is dark bronze, the darkest of the four, almost brown;
        - the THIGH PATCH is the newest — brighter and less worn than the others,
          clearly added later.
        Different sizes, different shapes, different ages. NO BREASTPLATE. NO FULL
        YOKE. NO MATCHING PAIRS OF ANYTHING. At most about a fifth of the costume
        carries metal; the rest is cloth and worn leather. The metal is the
        exception, and its mismatched colours are what prove nobody made this
        for her.
      - >
        FITTED AND CLOSE TO THE BODY. Her silhouette is compact and agile. The
        costume follows her figure — waist defined, nothing bulky, nothing loose,
        no oversized jacket or coat. She is small and quick, and the clothes say so.
      - >
        BARE ARMS AND SHOULDERS, showing the fine inherited scales on her skin at
        the shoulders, upper arms, forearms, hands, collarbone and neck. No sleeves
        covering them.
      - >
        HER WEAPONS ARE ON HER BODY AND MUST BE VISIBLE. A compact blaster pistol
        in a worn holster at the hip or thigh — in the holster, not an empty
        holster. A well-used combat knife in a secure sheath, positioned where she
        can reach it. Both present in every view. She is an assassin and a
        tracker; a costume record without her weapons is incomplete.
      - >
        FACE — BARELY THERE. Fine scale texture on the skin at the EDGES of her face
        only: the temples, the outer edge of the cheekbone, along the jawline, down
        the side of the neck, behind the ear. Tonal — the same colour as her skin,
        readable only where light rakes across it, easy to miss entirely in flat
        light. NOT across the nose, forehead, cheeks or mouth. She is a human actor
        in makeup, not a creature in prosthetics. Her irises are subtly reptilian.
        The effect is a hint of inherited history, not a transformation.
    description: >
      Light, fitted, scavenged armour protecting vital areas only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual overlapping metal scales, each roughly
      the size of a coin, laced and riveted onto a flexible leather-and-fabric
      backing and overlapping downward like fish scales. The individual scales are
      clearly visible and countable — real overlapping metal, never a texture and
      never a printed or embossed pattern on leather. The scales are cut from
      salvaged sheet metal rather than forged as armour: hull offcuts and machine
      plate, slightly irregular, mismatched alloys oxidising at different rates —
      brass, bronze, dull steel, olive-green verdigris, patches of rust. Nothing
      matches; sections have plainly been replaced. Metallic but never bright:
      dulled, scratched, weathered to a low sheen, catching light in small dull
      glints across many facets. It covers a panel across the front of the torso,
      caps over both shoulders, and the outer forearms. It moves like heavy cloth
      rather than plate. DO NOT make this leather. DO NOT make it an embossed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Quiet wraps at the
      forearms and lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: for freedom of movement, heat and sensory function, and because it is
      what makes her inherited scales legible.
      The costume is CLOSE-FITTING AND FOLLOWS HER FIGURE. Waist defined, cut to
      the body, feminine. She is compact, agile and quick, and the clothes must
      say so — nothing bulky, nothing loose, no oversized jacket or coat swallowing
      her silhouette. It is still a working costume built for infiltration, not
      display: everything on it does a job.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A compact blaster at the hip and a well-used
      combat knife. Nothing polished, ornamental or factory fresh.
