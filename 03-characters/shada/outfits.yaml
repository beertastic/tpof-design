      - >
        EXTERIOR, AND THE PLACE IS WET FOREST, FOREST CLEARING OR THE
        MERCENARY CAMP AMONG THE TREES — never desert, never sand, never dry
        scrub, never a rocky waste. Almost every place she is seen is one of
        those three. NO buildings, NO market stalls, NO crowds, NO interiors —
