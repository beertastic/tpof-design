character: Shada
ratio: "2:3"

# Required. Every weapon and armour placement follows from this.
# See 09-prompt-library/Handedness-And-Placement.md
handedness: right

outfits:
  - id: working
    name: Infiltration dress
    scenes: "10, 23, 25 — her only costume"

    # See 03-characters/APPROVAL.md. Clear this block to unlock.
    #
    # UNLOCKED 2026-08-01 by the structural revision recorded in
    # Character-Lock.md. The approved front showed a METAL forearm gauntlet and
    # no flank panels, and it is therefore a picture of a costume that no longer
    # exists. Leaving it approved would have been worse than having no
    # reference: every other view is handed it with "COSTUME (match exactly)",
    # so all twenty would have been matched to the superseded build.
    #
    # DO NOT re-approve until a new front turnaround has been generated against
    # the revised spec and checked. Then restore this block, pointing at the new
    # file, and redo the other four views and the narrative plates against it.
    # approved:
    #   date: "2026-07-31"
    #   view: front
    #   reference: 03-characters/shada/source/artwork/turn-working-front.png
    #   note: "Front view locked. Match this for all other views"

    # Approved reference PLATES. Attached alongside the costume reference so the
    # material and the props stop being redrawn from words every time. This is
    # the prop lock recorded in 11-production-tracking/Shada-Image-TODO.md.
    references:
      - path: source/artwork/material-scale.png
        what: the scale plates, their finish and how the panel is assembled
      - path: source/artwork/knife.png
        what: the combat knife
      # For anything PHYSICALLY BUILT, the reference is a photograph of the
      # build, not a render. The blaster is being 3D printed, and the generated
      # blaster.png does not match the printed prop — no brass panels in the
      # slide, brown ribbed grip instead of black. Photograph the prop, save it
      # below, and uncomment. Until then the WESTAR-35 is held by words alone.
      # - path: reference/props/westar-35.jpg
      #   what: the WESTAR-35 blaster pistol, as built
    must_show:
      # The first sentence is the only one the short prompts are guaranteed to
      # keep, so the three POSITIONS live there. They used to be twenty lines
      # down, and the short prompt therefore said "three patches, not on the
      # torso" without ever saying where they went — so a generation put all
      # three on the vest and left the forearm, shoulder and thigh bare.
      # 2026-08-01.
      # REVISED 2026-08-01 at the team's request. Two changes, both recorded in
      # Character-Lock.md: the forearm gauntlet loses its plates and becomes
      # plain leather, and a pair of scale FLANK PANELS is added over her ribs.
      # The flank panels reverse "NO METAL ON HER TORSO", which had itself been
      # a decision — the sternum patch was dropped on 2026-07-31.
      #
      # It is the better reading of the design. Character-Lock already asked for
      # VITAL-AREA PROTECTION ONLY, and panels over the liver, kidneys and
      # spleen are exactly that. A forearm gauntlet never was.
      - >
        METAL ON HER LEFT SHOULDER, LEFT THIGH, AND A PAIR OF FLANK PANELS
        OVER HER RIBS — NOWHERE ELSE.
        NO PLATES ON THE GAUNTLET.
        NEVER A FULL SUIT. NO BREASTPLATE, NO CHEST PLATE OVER THE STERNUM, NO
        BIB, NO PENDANT, NO YOKE. Roughly a quarter of the costume carries metal;
        the rest is cloth and worn leather.
        SIDES ARE FIXED, and given from HER OWN left and right, never the
        viewer's. In a front view her right side appears on the viewer's left; in
        a back view it appears on the viewer's right.
        (1) A LEATHER GAUNTLET ON HER RIGHT FOREARM ONLY — viewer's left in a
        front view. Wrapping the outer forearm from wrist to just below the
        elbow, held by two worn straps and buckles, exactly as before — but the
        scale plates are GONE and it is plain leather. It is a VISIBLY DIFFERENT
        leather from her belt and holster: a different tan, a different age, cut
        off something else. EXACTLY ONE GAUNTLET, NOT A PAIR. HER LEFT FOREARM IS
        COMPLETELY BARE — no gauntlet, no bracer, no wrap of any kind.
        (2) A SCALE CAP OVER HER LEFT SHOULDER ONLY — viewer's right in a front
        view, the OPPOSITE side to the gauntlet. Her right shoulder is bare.
        (3) A SCALE PATCH ON HER LEFT OUTER THIGH — viewer's right in a front
        view, the same side as the shoulder cap. Her right thigh has no metal.
        (4) A PAIR OF SCALE FLANK PANELS over her ribs — see the flank panel rule
        below. They are the only metal on her torso and there is none on her
        chest, her sternum or the middle of her back.
        Different sizes, different shapes, different ages, and NO MATCHING PAIR
        ANYWHERE — including the two flank panels, which must not match.
      # Plate geometry given its own rule 2026-08-01. It used to be a paragraph
      # inside the placement rule, which meant the short prompts carried no
      # dimension and no count at all — the plates were free-floating in every
      # generation, and came back three to four times too big. Size confirmed
      # 2026-07-31 and re-confirmed today: 10 to 15 mm stands.
      # Added 2026-08-01. The form is a brigandine: shaped panels laced across
      # the body. The lacing does three jobs — it closes it, it lets a scavenged
      # thing be fitted to a body, and it is visibly hand-made, which is the same
      # argument that keeps a modern zip off the vest.
      - >
        THE FLANK PANELS ARE SCALE ARMOUR LACED ACROSS HER CENTRE FRONT, WORN
        OVER THE VEST — NOT A BREASTPLATE AND NOT A CORSET.
        ONE PANEL EACH SIDE, covering the side of the ribcage from just under the
        arm down to the point of the hip. They FOLLOW THE RIBS, draw in at the
        waist and flare slightly over the hip: the shaping is structural, because
        that is the shape of the body under them, and it is not styling.
        THEY MEET AT THE CENTRE FRONT AND ARE LACED TOGETHER — a leather thong
        zig-zagging between punched eyelets down both facing edges and tied off
        at the bottom, leaving a visible gap of vest cloth between them. The
        LACING IS THE CLOSURE and it must be visible. NO buckle plate, NO clasp,
        NO zip, NO seamless join.
        AT THE BACK they are held by TWO SALVAGED STRAPS AND BUCKLES. NOTHING
        GOES OVER HER SHOULDER — the panels hang on the lacing and the straps, so
        her arms and shoulders stay clear.
        THE TWO PANELS DO NOT MATCH. Different metal, different age, one visibly
        added later than the other — a pair in what they do, never in how they
        look. If they read as a matched, made-for-her set, the image has failed:
        the mismatch is what proves she assembled this herself.
        Her chest and sternum stay plain cloth between them. This is VITAL-AREA
        PROTECTION — the ribs and the organs under them — and nothing more.
      - >
        EACH PLATE IS 10-15 mm ACROSS — A DENSE FIELD OF MANY TINY PIECES, NEVER
        A DOZEN BIG ONES.
        TESSELLATED EDGE TO EDGE AND NEVER OVERLAPPED OR SHINGLED.
        About the size of a thumbnail. ONE FLANK PANEL alone carries WELL OVER A
        HUNDRED of them and the costume carries roughly 440 in total, so
        if the plates in a patch can be counted at a glance they are far too big.
        FOR WHAT A PLATE LOOKS LIKE, MATCH THE PLATE PHOTOGRAPH FETCHED ABOVE.
        Flat six-sided hexagons, each carrying a RAISED SNAKE SWIRL, laced to a
        hand-cut backing. Salvaged, pitted and worn — never machined, never
        polished, never carbon fibre or tech panelling.
      - >
        FOUR METAL PIECES, FOUR DIFFERENT METALS, AND THIS KEEPS COMING BACK
        WRONG. They must NOT all be brass or all be gold. If they
        read as the same metal, the image has failed — the mismatch is the whole
        point, because it is what proves nobody made this costume for her.
        - her RIGHT FLANK PANEL is DULL GREY STEEL: cold, unpolished, scratched,
          the most worn thing she owns and the oldest. NOT brass, NOT gold,
          NOT warm-toned.
        - her LEFT FLANK PANEL is BLACKENED IRON — dark, matte, nearly black,
          with rust caught in the pitting. Obviously not the same piece of salvage
          as the right, and obviously acquired at a different time.
        - the SHOULDER CAP is BRASS, warm yellow, with GREEN VERDIGRIS collected
          in the seams between plates.
        - the THIGH PATCH is DARK BRONZE, almost brown and noticeably deeper
          than the shoulder — and it is the NEWEST, cleaner and
          less worn, clearly added later.
        Four clearly different colours and four different states of wear,
        readable side by side at a glance. Within any ONE piece the metal is
        consistent.
        THE FOREARM GAUNTLET IS NOT ON THIS LIST — it is plain leather and
        carries no metal at all.
      # The garment and its coverage were two rules until 2026-08-01; merged,
      # because they describe one object and eleven rules dropped the per-rule
      # budget far enough to start truncating the others.
      #
      # Written from a garment reference the same day. The vest kept generating
      # as a plain scoop-neck tank, because "sleeveless vest, fitted, front
      # closure" is an accurate description of one. What makes it read as BUILT
      # rather than bought is the panelling — and a concealed placket also
      # removes the modern coil zip, the fault this costume has never beaten.
      - >
        A PANELLED SLEEVELESS VEST COVERING HER TORSO: STAND COLLAR, CONCEALED
        PLACKET, PRINCESS SEAMS, RAW HEM.
        NO BARE MIDRIFF, NO CROP TOP, NO ZIP.
        THIS IS NOT A TANK TOP AND NOT A VEST TOP, AND NOT A ONE-SHOULDER DRAPE.
        It runs from the collarbone to below the waist, and her stomach, flanks
        and lower back are NEVER exposed — she is an infiltrator in salvaged
        working kit, not a figure in a costume designed to be looked at. Her silhouette
        is compact and agile, the costume cut to her figure, waist defined,
        nothing bulky, nothing loose, no oversized jacket or coat.
        THE COLLAR is a low band, 2 to 3 cm, standing away from the neck and OPEN
        at the front — her throat and collarbone stay visible and the scale
        pattern on them must still read. Never a funnel, never a polo neck,
        never closed to the chin.
        THE FRONT CLOSURE is hidden behind a flat band of cloth down the centre
        front. Nothing on the outside shows how it fastens.
        THE SEAMING is what makes it: curved princess seams running from the
        shoulder over the bust down to the hem, and a curved panel seam under the
        bust. The body is built from shaped panels, not cut from one piece, and
        every seam is visible as construction.
        THE SHOULDER is CUT ON — the cloth extends from the body to a small
        squared cap just past the point of the shoulder, with NO set-in sleeve
        and no seam at the top of the armhole. Her arm is bare below it and the
        armhole is cut high and close under the arm.
        THE HEM is shaped, dipping at centre front and back and rising at the
        sides, and its edge is RAW AND FRAYING — cut and left, never turned,
        never topstitched.
        THE CLOTH is a dry crinkled matte weave that does not catch the light.
      # The exception has to be in the first sentence. Trimmed to "BARE ARMS AND
      # BARE SHOULDERS", this rule contradicted the gauntlet and the shoulder
      # cap outright, and the generator resolved the contradiction by moving all
      # three patches onto the vest. 2026-08-01.
      - >
        BARE ARMS AND BARE SHOULDERS, EXCEPT A PLAIN LEATHER GAUNTLET ON HER RIGHT FOREARM
        AND THE CAP ON HER LEFT SHOULDER.
        NO SCARF, COWL, HOOD OR NECK WRAP.
        Apart from those two pieces her arms are UNCOVERED from the shoulder
        down — no sleeves of any length, no sleeve, no arm wrap, no gloves, no
        undershirt showing at the arm. The vest is SLEEVELESS. Her shoulders,
        upper arms, forearms, hands, collarbone and neck are otherwise exposed
        skin, showing the fine inherited scales. No scarf, no shawl, no cowl, no hood, no
        neck wrap, no headwrap. Her hair is up and her neck and collarbone are
        visible above the vest's low open collar, which is the ONLY cloth
        permitted near her throat. If her arms are covered, or anything is
        wrapped round her neck, the image is wrong.
      - >
        FINE SCALE PATTERN ON HER SHOULDERS, ARMS, COLLARBONE AND NECK — IT MUST
        BE VISIBLE HERE, NEVER SMOOTH SKIN.
        This is what makes her not
        HUMAN. The snake ancestry is TENS OF THOUSANDS OF YEARS BACK — so distant
        that almost nothing of it survives. She is human to look at, and this is
        the one trace left. That is why it is faint: it is not a costume choice,
        it is the last of something very old.
        THINK OF IT AS A TATTOO RATHER THAN AS ARMOUR. A fine, close-set scale
        pattern lying FLAT ON the skin, like faint ink under the surface — not
        raised, not applied, not a separate layer, nothing you could lift off.
        It follows the exposed skin of her shoulders, upper arms, forearms, the
        backs of her hands, her collarbone and the sides of her neck.
        TONAL, NOT COLOURED. The same colour as her skin, very slightly raised,
        readable where light rakes across it and easy to miss in flat frontal
        light. Never painted on and never a printed pattern. It is skin and reads as skin:
        the metal plates catch the light, this texture does not, and it stays the
        same colour and finish as the rest of her.
        MUCH FINER THAN THE METAL PLATES. The plates are 10 to 15 mm; this is
        skin texture at a fraction of that, closer to the scales of a snake than
        to anything made. The two must never be confused for each other.
        IF HER ARMS AND SHOULDERS ARE SMOOTH HUMAN SKIN, THE IMAGE HAS FAILED.
        Without this she is a woman in salvaged armour, and the entire serpentine
        ancestry — the thing her design exists to carry — is gone.
      - >
        WEAPONS — SIDES ARE FIXED. SHE IS RIGHT-HANDED. Positions are given from
        HER OWN left and right, not the viewer's.
        BLASTER: a WESTAR-35 BLASTER PISTOL ON HER RIGHT SIDE — hip or thigh,
        either is fine, but ALWAYS HER RIGHT AND NEVER HER LEFT. In a worn
        holster, grip upward and angled slightly forward for a right-hand draw.
        In the holster, not an empty one.
        The specific in-universe model, not a generic sidearm: slab-sided and
        angular, dull silver-steel with BRASS PANELS let into the slide, a
        squared trigger guard, a prominent front sight and a worn black textured
        grip. Weathered and visibly used, never factory fresh.
        KNIFE: a well-used combat knife on HER LEFT HIP, in a secure sheath hanging
        from the belt, grip upward, positioned for a cross-draw with her right hand.
        Both weapons present and visible in every view. She is an assassin and a
        tracker; a costume record without her weapons is incomplete.
        Nothing is mirrored — she does not carry a matching item on both sides.
      - >
        EXTERIOR, WITH ONE EXCEPTION. Almost every place she is seen is
        exterior: wet forest, forest clearing, or the mercenary camp among the
        trees. NO buildings, NO market stalls, NO crowds, NO interiors —
        EXCEPT the mercenary ship's main hold in Scene 10, the Sabacc game,
        which moved inside on 2026-08-01. That is the ONLY interior she is ever
        in, it is a cramped salvaged cargo hold lit by a single swinging work
        lamp, and it is not a corridor, a cockpit or a bridge. If an image is
        not slot 2 and has a wall, a bulkhead, a control panel or a warning
        light in it, it is wrong.
        THIS RULE DOES NOT APPLY TO STUDIO REFERENCE PLATES. A plain seamless
        backdrop is not a location and not an interior — it is the absence of
        one. Where the shot description below calls for a plain studio
        background, or for an object on a plain neutral surface, THAT GOVERNS
        and there is no environment for this rule to judge. Do not add a forest,
        trees, foliage, mist or any outdoor setting to a studio plate.
      - >
        FACE — BARELY THERE. Fine scale texture on the skin at the EDGES of her face
        only: the temples, the outer edge of the cheekbone, along the jawline, down
        the side of the neck, behind the ear. Tonal — the same colour as her skin,
        readable only where light rakes across it, easy to miss entirely in flat
        light. NOT across the nose, forehead, cheeks or mouth. She is a human actor
        in makeup, not a creature in prosthetics.
        The effect is a hint of inherited history, not a transformation.
      # Promoted to its own rule 2026-08-01. It was the last clause of the face
      # rule and the trim cut it every time, so the single highest-value make-up
      # item in the costume never reached a generator.
      - >
        HER EYES ARE REPTILIAN — A VERTICAL SLIT PUPIL, CLEARLY READABLE, ON AN
        OTHERWISE HUMAN EYE.
        This is a CONTACT LENS on a human performer, not a prosthetic and not a
        creature eye: the eye keeps its human shape, its lids, its lashes and its
        expression, and only the pupil is wrong. It is the single
        highest-value element in her make-up and it must be legible in a
        head-on view. Do NOT make the whole eye animal, do NOT enlarge it, and do
        NOT lose it to shadow.
    description: >
      Light, fitted, scavenged armour in three small patches only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual six-sided metal plates. Every plate is
      a hexagon with six straight sides — never round, never a coin, never a
      fish-scale shape. EACH PLATE IS SMALL — 10 to 15 mm across, about the size of a thumbnail. These are FINE SCALE, NOT LARGE PLATES: one flank panel alone carries well over a hundred of them, and a patch reads as a dense field of many tiny pieces, not a few large ones. Each is flat and laced
      and riveted onto a flexible leather-and-fabric backing and laid so that each
      plate sits edge to edge with its neighbours, almost touching, separated only
      by a thin dark seam, and no frame or bezel around any plate. The lacing is
      fine and mostly hidden behind the plates, and the backing is hand-cut and
      irregular, never a neat manufactured panel.
      Tessellated, never overlapped and never shingled — a single flat plane. It
      must never read as carbon fibre or machined hex panelling; the worn
      salvaged finish is what keeps it off that. The flex comes from the gaps
      and the lacing.
      The individual plates are clearly visible and countable — real metal, never
      a texture and never a pattern printed on leather. Every plate carries the
      a RAISED serpent standing proud of the surface — a soft worn rounded ridge,
      never engraved and never a recessed stamp — and no two are identical: the
      curl sits differently, the line runs thicker or thinner, some are nearly
      worn away. It is a manufacturer's mark cast into cheap hull plate at the
      mill, industrial and meaningless, rendered a little differently by every
      batch and worn die. Never crisp, never ornamental. The
      plates are cut from salvaged hull plate rather than forged as armour:
      offcuts and machine panel, mismatched alloys oxidising at different rates —
      brass, bronze, dull steel, olive-green verdigris, patches of rust. The shape
      and the motif repeat; the material and the finish never do. Within any one patch
      the metal is broadly consistent, with only two or three plates obviously
      replaced later. Sections have plainly been
      replaced. Metallic but never bright: dulled, scratched, weathered to a low
      sheen, catching light in small dull glints across many facets. It appears
      ONLY in the three asymmetric patches listed in the non-negotiables — one
      forearm, one shoulder and one thigh. It moves like heavy
      cloth rather than plate. DO NOT make this leather. DO NOT make it a printed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: for freedom of movement, heat and sensory function, and because it is
      what makes her inherited scales legible.
      The costume is CLOSE-FITTING AND FOLLOWS HER FIGURE. Waist defined, cut to
      the body, feminine. She is compact, agile and quick, and the clothes must
      say so — nothing bulky, nothing loose, no oversized jacket or coat swallowing
      her silhouette. It is still a working costume built for infiltration, not
      display: everything on it does a job.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A WESTAR-35 blaster pistol on her RIGHT SIDE, hip or
      thigh, and a well-used combat knife on her LEFT HIP. Nothing polished, ornamental or factory fresh.
