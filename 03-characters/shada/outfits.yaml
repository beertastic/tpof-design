character: Shada
ratio: "2:3"

outfits:
  - id: working
    name: Infiltration dress
    scenes: "10, 24, 24A — her only costume"
    description: >
      Light, fitted, scavenged armour protecting vital areas only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual overlapping metal scales, each roughly
      the size of a coin, laced and riveted onto a flexible leather-and-fabric
      backing and overlapping downward like fish scales. The individual scales are
      clearly visible and countable — real overlapping metal, never a texture and
      never a printed or embossed pattern on leather. The scales are cut from
      salvaged sheet metal rather than forged as armour: hull offcuts and machine
      plate, slightly irregular, mismatched alloys oxidising at different rates —
      brass, bronze, dull steel, olive-green verdigris, patches of rust. Nothing
      matches; sections have plainly been replaced. Metallic but never bright:
      dulled, scratched, weathered to a low sheen, catching light in small dull
      glints across many facets. It covers a panel across the front of the torso,
      caps over both shoulders, and the outer forearms. It moves like heavy cloth
      rather than plate. DO NOT make this leather. DO NOT make it an embossed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Quiet wraps at the
      forearms and lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: this exists for freedom of movement, heat and sensory function, and
      because it is what makes her inherited scales legible. It is never
      decorative and never sexualised.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A compact blaster at the hip and a well-used
      combat knife. Nothing polished, ornamental or factory fresh.
