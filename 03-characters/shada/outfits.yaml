    description: >
      Light, fitted, scavenged armour in five pieces — a solid printed gauntlet
      on her right forearm, a loose scale cap on her left shoulder, a scale patch
      on her left outer thigh, and a pair of unmatched scale flank panels laced
      across the centre front over her ribs — worn over a fitted sleeveless vest
      of dusty grey cloth. NO BREASTPLATE: her chest and sternum stay plain cloth
      between the panels. The palette is grey, grey-green and khaki throughout,
      with the bronze thigh patch the one warm thing in it.
      CRITICAL — THE SCALE ARMOUR IS THE DEFINING FEATURE OF THIS COSTUME AND MUST
      BE CLEARLY VISIBLE IN EVERY VIEW.
      She wears armour made of individual six-sided metal plates. Every plate is
      a hexagon with six straight sides — never round, never a coin, never a
      fish-scale shape. EVERY PLATE IS THE SAME REGULAR EQUILATERAL HEXAGON —
      one printed master, repeated, identical in size and outline across the
      whole costume. Outlines never vary plate to plate, are never hand-cut or
      wonky, and are never five- or seven-sided. EACH PLATE IS SMALL — 10 to 15 mm across, about the size of a thumbnail. These are FINE SCALE, NOT LARGE PLATES: one flank panel alone carries well over a hundred of them, and a patch reads as a dense field of many tiny pieces, not a few large ones. Each is flat and laced
      and riveted onto a flexible leather-and-fabric backing and laid so that each
      plate sits edge to edge with its neighbours, almost touching, separated only
      by a thin dark seam, and no frame or bezel around any plate. The lacing is
      fine and mostly hidden behind the plates, and the backing is hand-cut and
      irregular, never a neat manufactured panel.
      Tessellated, never overlapped and never shingled — a single flat plane. It
      must never read as carbon fibre or machined hex panelling; the worn
      salvaged finish is what keeps it off that. The flex comes from the gaps
      and the lacing.
      The individual plates are clearly visible and countable — real metal, never
      a texture and never a pattern printed on leather. Every plate carries a
      RAISED serpent standing proud of the surface — a soft worn rounded ridge,
      never engraved and never a recessed stamp. THERE ARE ONLY THREE OR FOUR
      DIFFERENT SWIRLS AND THEY REPEAT ACROSS A PANEL — the same few marks
      recurring, never a unique curl on every plate. It is a manufacturer's mark
      cast into cheap hull plate at the mill by a handful of worn dies:
      industrial and meaningless, the same stamp over and over. Never crisp,
      never ornamental. What differs between neighbouring plates is the WEAR —
      paint, chipping, how far the ridge has worn down — and never the mark
      itself. The
      plates are cut from salvaged hull plate rather than forged as armour:
      offcuts and machine panel, mismatched alloys oxidising at different rates —
      dull grey steel, blackened iron, dark bronze, pale worn pewter, rust-red
      oxidised iron. NO BRASS AND NO VERDIGRIS. The shape
      and the motif repeat; the material and the finish never do. Within any one patch
      the metal is broadly consistent, with only two or three plates obviously
      replaced later. Sections have plainly been
      replaced. Metallic but never bright: dulled, scratched, weathered to a low
      sheen, catching light in small dull glints across many facets. It appears
      ONLY in the five pieces listed in the non-negotiables — the right forearm,
      the left shoulder, the left thigh and the pair of flank panels over the
      ribs. The flank panels, the shoulder cap and the thigh patch move like heavy
      cloth rather than plate; the forearm gauntlet is the one exception, a solid
      printed shell that does not flex at all.
      DO NOT make the armour leather. DO NOT make it a printed
      pattern. DO NOT make it forged or ceremonial armour. Layered
      technical cloth, worn leather and repaired matte hardware. A worn taupe
      leather waist belt with a second belt slung diagonally below it, a knife
      sheath and a holster on her right thigh. Mid-calf grey-brown taupe boots
      with long leather straps wound criss-cross up the shaft. Muted forest
      palette throughout — dusty stone grey, grey-green, khaki and taupe — matte
      and low-noise, with nothing that would snag or rattle. The one warm thing
      in the costume is the dark bronze thigh patch.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: for freedom of movement, heat and sensory function, and because it is
      what makes her inherited scales legible.
      The costume is CLOSE-FITTING AND FOLLOWS HER FIGURE. Waist defined, cut to
      the body, feminine. She is compact, agile and quick, and the clothes must
      say so — nothing bulky, nothing loose, no oversized jacket or coat swallowing
      her silhouette. It is still a working costume built for infiltration, not
      display: everything on it does a job.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A WESTAR-35 blaster pistol on her RIGHT SIDE, hip or
      thigh, and a well-used combat knife on her LEFT HIP. Nothing polished, ornamental or factory fresh.
    # Added 2026-08-04. Assembled from decisions already recorded elsewhere —
    # Costume-Build-Method.md for the plate counts, routes and the vest change,
    # Character-Lock.md for the non-negotiables. Nothing here is new design.
    #
    # Routes follow the rules in Costume-Build-Method.md: load-bearing hardware is
    # BOUGHT because printed buckles fail at the layer lines, and the gauntlet is
    # PRINTED because that alone removes ~150 hand-laced plates.
    components:
      - item: Hex plates — the raw scale
        route: printed
        qty: ~440
        status: not-started
        build:
          size: >-
            10 to 15 mm across the flats — regular equilateral hexagons, ONE
            printed master repeated ~440 times. That is much finer than it
            sounds: a hexagon 12.5 mm across covers about 1.35 cm². IF YOU CAN
            COUNT THE PLATES AT A GLANCE THEY ARE WRONG. Each needs TWO PUNCHED
            HOLES for lacing.
          colour: Dull grey steel — the base tone, and the commonest
          hex: "#8a8d90"
          palette:
            - name: Dull grey steel
              hex: "#8a8d90"
              note: The base tone and the commonest across all four cloth pieces.
            - name: Blackened iron
              hex: "#3a3a3d"
              note: Scattered singly, never in runs. Reads as the oldest metal.
            - name: Dark bronze
              hex: "#7a5c33"
              note: >-
                THE THIGH PATCH ONLY. The one warm thing in the whole costume
                and the only place this colour appears — do not let it drift
                onto the flank panels.
            - name: Pale worn pewter
              hex: "#b6b3ab"
              note: The highlight tone. Edges and high points that have rubbed.
            - name: Rust-red oxidised iron
              hex: "#7c4530"
              note: >-
                Sparingly, and at the edges of a panel where damp sits. NO
                BRASS AND NO VERDIGRIS anywhere on this costume.
          finish: >-
            PRINTED IDENTICAL, SO ALL MISMATCH IS PAINTED ON. The five tones
            above are mismatched alloys oxidising at different rates, not a
            decorative scheme — mix them irregularly and never in a pattern.
            Each plate carries a RAISED SERPENT RIDGE, and at 12 mm the relief
            alone will not carry it: it needs a wash pulled into the ridge and
            a dry-brush off the top, or it will not read at all on camera.
          method: >-
            THREE OR FOUR RIDGE DIES REPEATING across a panel — never a unique
            curl per plate. PRINT AND FINISH A FULL PATCH BEFORE COMMITTING to
            a run of several hundred; this is not something to discover a
            problem in halfway through. DO NOT PRINT PRE-LINKED SHEETS. The
            pressure to will be enormous and it is exactly the shortcut that
            kills the flex — all four cloth pieces must move like heavy cloth.
            If assembly time is the problem, REDUCE THE PATCH AREAS rather than
            link the plates.
        images:
          - src: 03-characters/shada/source/artwork/material-scale.png
            caption: >-
              THE LOCKED PLATE REFERENCE. One repeated hexagon, a RAISED
              serpent ridge on each, tessellated edge to edge in one plane with
              a thin dark seam — never shingled. The mismatched alloys are all
              paint; every plate here came off the same master.
            scope: >-
              AUTHORITATIVE FOR THE PLATE — its size, its outline and its
              ridge. It shows an ASSEMBLED panel: do not read the linkage as
              permission to PRINT pre-linked sheets, which is forbidden on
              every cloth piece.
        note: >
          10 to 15 mm across, regular equilateral hexagons, ONE printed master
          repeated. Re-confirmed 2026-08-01 against a generation that came back
          three to four times too coarse. If you can count the plates at a glance
          they are wrong. Printed identical, so ALL mismatch is painted on —
          mismatched alloys oxidising at different rates: dull grey steel,
          blackened iron, dark bronze, pale worn pewter, rust-red oxidised iron.
          NO BRASS, NO VERDIGRIS. Each carries a RAISED serpent ridge, three or
          four dies repeating across a panel, never a unique curl per plate.
