character: Shada
ratio: "2:3"

outfits:
  - id: working
    name: Infiltration dress
    scenes: "10, 24, 24A — her only costume"
    description: >
      Light, fitted, scavenged armour protecting vital areas only, over a
      flexible scale-textured undersuit and a breathable base layer.
      CRITICAL: where a rigid armour plate would normally sit, she instead wears a
      patch of FLEXIBLE METALLIC SCALE — fine overlapping small metal scales on a
      supple backing, matte, darkened, non-reflective, scavenged and repaired with
      mismatched sections. Small areas only: the sternum, one shoulder, a flank,
      the outside of a forearm. Never full coverage, never a suit. It is flexible
      protection that moves with her, which is why she wears it instead of hard
      plate, and it reads unmistakably as serpentine — she wears her own ancestry
      as armour. NO RIGID ARMOUR PLATES ANYWHERE. This detail must be clearly
      visible and readable in every view of this turnaround. Layered
      technical cloth, worn leather and repaired matte hardware. A crossed
      harness over the chest, a working belt, a knife sheath and a concealed
      holster. Outer panels break up the silhouette. Quiet wraps at the
      forearms and lightweight boots. Muted forest palette throughout —
      charcoal, ash brown, dust brown, faded olive — matte and low-noise, with
      nothing that would snag or rattle.
      Functional exposed skin at the shoulders, upper arms and selected mobility
      zones: this exists for freedom of movement, heat and sensory function, and
      because it is what makes her inherited scales legible. It is never
      decorative and never sexualised.
      Fine scales are visible on the exposed skin of her face, neck, collarbone,
      shoulders, arms and hands. A compact blaster at the hip and a well-used
      combat knife. Nothing polished, ornamental or factory fresh.
