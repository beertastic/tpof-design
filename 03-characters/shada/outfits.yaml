        grip. Weathered and visibly used, never factory fresh.
        KNIFE: a well-used combat knife on HER LEFT HIP, in a secure sheath hanging
        from the belt, grip upward, positioned for a cross-draw with her right hand.
        Both weapons present and visible in every view. She is an assassin and a
        tracker; a costume record without her weapons is incomplete.
        Nothing is mirrored — she does not carry a matching item on both sides.
