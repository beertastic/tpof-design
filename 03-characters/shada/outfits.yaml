      - >
        BLASTER ON HER RIGHT, KNIFE ON HER LEFT HIP.
        NEVER THE OTHER WAY ROUND.
        The blaster is a WESTAR-35, NOT a generic sidearm.
        Sides are fixed and she is RIGHT-HANDED. Positions are given from
