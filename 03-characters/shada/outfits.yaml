      - pin: true
        text: >
          HER EYES ARE REPTILIAN — A VERTICAL SLIT PUPIL, CLEARLY READABLE, ON AN
          OTHERWISE HUMAN EYE.
          This is a CONTACT LENS on a human performer, not a prosthetic and not a
          creature eye: the eye keeps its human shape, its lids, its lashes and its
          expression, and only the pupil is wrong. It is the single
