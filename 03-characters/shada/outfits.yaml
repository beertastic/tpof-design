          LOAD-BEARING, SO BOUGHT HARDWARE. Printed buckles fail at the layer
          lines under exactly the loads a costume puts on them. Real load-rated
          buckles also read more correctly — the Bible calls for industrial
          salvage over fine modern hardware. Printing is for buckles that are seen
