  # 03-characters/vala/reference/props/clasp-fitting-2026-08-05.jpg.
  # THE TWO DESCRIPTIONS HAVE TO AGREE OR THE PLANT BREAKS: it is the same object
  # changing hands on camera in Sc.22, and P3 turns on Shin still wearing it
  # years later.
  - id: final
    name: The clearing
    scenes: "25 — and the first frame of the next film"
    description: >
      The forest-destroyed costume, and now her mother's blood on it: on her
      hands, forearms, the front of the tunic and one side of her face, from
      holding her mother while she died. Not stylised, not arranged — transfer,
      where a person knelt and held someone. Fresh and wet in places, drying
      darker at the edges. Everything else is exactly as it was in the previous
      state. On the tunic, a small dark metal clasp — a raised eight-pointed sun around a central ring — is now fastened where she
      has put it, the only object she owns. Her hair is still bound and still
      long. This is what she is wearing when she walks out of the clearing.
