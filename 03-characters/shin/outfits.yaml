character: Shin
ratio: "2:3"

# Shin wears ONE costume, progressively destroyed. These are states of that
# single garment set, not separate outfits — the costume department builds one
# and ages it to match.
#
# ABSOLUTE RULE, restated here because these are full-figure studio images of a
# fifteen-year-old: nothing fitted, nothing shaped, no exposed midriff or
# shoulders as design language, no artful tearing, no adult posing, no makeup.
# Damage follows the route she ran and the work she did — never a designer's hand.

do_not_retrieve_short: >
  You are thinking of the poised young woman in tailored dark Jedi dress with an
  orange lightsaber. THAT IS YEARS LATER. This Shin is FIFTEEN and has been a
  slave her whole life — filthy, exhausted, frightened. No weapon, no tailoring,
  no poise, and NOTHING may suggest she is becoming a warrior.

# THE NAME RETRIEVES, exactly as Baylan's does.
do_not_retrieve: >
  You are thinking of a poised young woman in tailored dark Jedi-style dress with
  an orange lightsaber, pale and composed and dangerous. THAT IS A DIFFERENT
  PRODUCTION AND YEARS LATER. Draw none of it.

  This Shin is FIFTEEN, and she has been a slave her entire life. She is filthy,
  exhausted, underfed and frightened in almost every scene. NO lightsaber. NO
  weapon of any kind. NO tailoring, no dark uniform, no poise, no composure, no
  danger. She is not a warrior and NOTHING may suggest she is becoming one.

  She is a child in worn-out clothes who has just seen the sky for the first time
  she can remember. If your image would look at home beside the character you are
  thinking of, it is wrong.


# ADDED 2026-08-05 TO UNBLOCK HER. turnarounds.py refuses a character with no
# `handedness:` — every weapon and armour placement resolves from it — and Shin
# had none, which is why 29 of her images could not be generated.
#
# PROVISIONAL, AND IT MATTERS LESS FOR HER THAN FOR ANYONE ELSE: she carries no
# weapon in this film and her costume has no asymmetric kit at all. It is set so
# the tooling runs, and so that the ONE asymmetric thing she does acquire — her
# mother's blood, on one side of her face — has a side to be on.
handedness: right

outfits:
  - id: early
    name: As we meet her
    scenes: "6, 8, 11 — days into the run, before the forest has finished with it"
    description: >
      Captivity clothing made for indoor domestic labour: a coarse, badly-dyed
      tunic over a plain under-top, and loose trousers. Everything unfitted and
      wrong-sized — nothing was cut for this body and nothing was chosen by her.
      Cloth is undyed or dyed so poorly the colour has gone patchy. No fastenings
      worth anything: cord and tied cloth, nothing manufactured. No useful
      pockets. Hand repairs in mismatched thread, made in poor light by her
      mother — those patches are the only care anyone has spent on it. Her
      footwear was made for floors, not forests, and is already beginning to fail.
      By this point it is dirty and damp but structurally intact. Her long red
      hair is bound back with a strip of torn cloth.

    must_show:
      # RULE 1 IN ALL THREE STATES, AND IT NEVER MOVES. These are full-figure
      # studio images of a fifteen-year-old and the file's own absolute rule
      # governs every one of them.
      - check: SHE IS FIFTEEN. Nothing fitted, nothing shaped, no adult posing.
        text: >
          SHE IS FIFTEEN YEARS OLD AND SHE IS DRESSED AS A CHILD LABOURER.
          NOTHING fitted, NOTHING shaped to the body, NO exposed midriff or
          shoulders as design language, NO artful tearing, NO adult posing, NO
          make-up and NO styling of any kind. If the image would work as a
          fashion photograph, it has failed.
      - check: NOTHING was chosen, NOTHING fits, NOTHING is decorated.
        text: >
          CAPTIVITY CLOTHING MADE FOR INDOOR DOMESTIC LABOUR, and none of it was
          hers by choice: a coarse badly-dyed tunic over a plain under-top, loose
          trousers, everything UNFITTED and WRONG-SIZED. NO ornament, NO trim, NO
          jewellery, NO personal mark. NO stripes, NO numbers, NO institutional
          uniform and NO shackles — she is labour, not an inmate.
      - check: NO fastening worth anything. Cord and tied cloth only.
        text: >
          NO FASTENING ON HER IS WORTH ANYTHING — cord, tied cloth, bone or
          scrap, nothing manufactured and nothing that could be sold or
          sharpened. NO useful pockets.
      - check: HER MOTHER'S HAND REPAIRS — mismatched thread, poor light.
        text: >
          EVERY REPAIR IS A HAND REPAIR AND HER MOTHER MADE THEM, in poor light
          with no proper tools and mismatched thread. THEY ARE THE ONLY CARE
          ANYBODY HAS SPENT ON HER, and after the finale they are all that is
          left of Jeyin — so they must be VISIBLE and they must look like
          somebody's hands did them.
      - check: FOOTWEAR MADE FOR FLOORS, and failing.
        text: >
          HER FOOTWEAR WAS MADE FOR FLOORS, NOT FORESTS — thin, soft-soled,
          already giving way. She and her mother are the worst-equipped people in
          the group and it shows first at her feet.
      - check: LONG RED HAIR, bound back with a strip of torn cloth.
        text: >
          LONG RED HAIR, BOUND BACK WITH A STRIP OF TORN CLOTH — the same strip
          in every state. Never styled, never cut, never arranged.
      - check: NO COLOUR — undyed or the dye gone patchy. Bone, dust, ash.
        text: >
          NO COLOUR: undyed, or dyed so badly the colour has gone patchy and
          uneven. Bone white, dust brown and ash. NEVER a saturated colour.
      - check: FRIGHTENED and exhausted. NOT becoming a warrior.
        text: >
          SHE IS FRIGHTENED AND EXHAUSTED AND IT READS ON HER. NO weapon, NO
          poise, NO coiled readiness, NOTHING that suggests she is becoming a
          warrior — that is years away and this film must not hint at it. She is
          a child who has just seen the sky for the first time she can remember.
      - check: INTACT — dirty and damp, but NOT yet destroyed.
        text: >
          AT THIS POINT THE COSTUME IS STILL STRUCTURALLY INTACT. Dirty and damp,
          days into the run, but NOT torn open and NOT falling apart. The forest
          has not finished with it yet — that is the LATE state, and the
          difference between the two must be obvious side by side.
  - id: late
    name: Destroyed by the forest
    scenes: "16, 17, 18, 21, 22 — after days of running, mud and the ditch"
    description: >
      The same single costume, now badly damaged by the crossing. Mud to the
      knee and ground into the weave. Soaked and dried and soaked again. Tears at
      the hem and forearms from undergrowth. The hand repairs are pulling open.
      Permanent staining. One boot has split at the sole and is failing —
      visibly, not decoratively. Everything hangs heavier and wetter than it did.
      Her hair is filthier and more matted, still bound with the same cloth strip.
      Nothing has been replaced or added; it is the same clothing, further gone.

