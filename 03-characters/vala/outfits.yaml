character: Vala
ratio: "2:3"

# REWRITTEN 2026-08-05 AGAINST A REAL COSTUME FITTING. The previous version was
# drafted the same afternoon by transcribing 04-factions/slaves-escapees/Faction.md
# and had never been tested. Twenty-three photographs of a built costume then
# arrived — see reference/fitting/README.md — and the repo rule applies: FOR
# ANYTHING PHYSICALLY BUILT, THE REFERENCE IS A PHOTOGRAPH OF THE BUILD, NOT A
# RENDER. The words move to the object.
#
# THE STRUCTURE SURVIVED THE TEST. Faction.md asks for "strapping, wraps, a belt
# or harness, reinforcement at the forearms and shins" and the build has all
# four: a laced bracer on the right forearm, wraps round both calves, a belt, a
# leather chest rig. That part was right before anyone built it.
#
# WHAT CHANGED IS EVERYTHING ELSE. The build is LAYERED and WARM — a belted
# jacket, a heavy knitted shawl-cowl, gloves — where the old draft said "the
# functional minimum an arena gives someone it expects to lose". Both can be
# true: the rig is underneath and the layers are what she has picked up since.
# That reading is now written in rather than assumed.

# PROVISIONAL still. Nothing states it, but the BUILD now settles it in
# practice: the bracer is on her RIGHT forearm, which is the side that takes the
# damage, so she leads right.
handedness: right

# PROVISIONAL. Nothing states it and the fitting gives no scale reference.
height: 172 cm (5 ft 8 in) — lean and wiry rather than heavy, built by twenty years of being made to fight

outfits:
  - id: rig
    name: The remnants of a fighting rig, layered for the forest
    scenes: "Scene 8 onward, and the fight in Scene 24. Her only costume"
    description: >
      A fighting rig with a forest crossing layered on top of it.
      UNDERNEATH, the arena: a laced brown leather bracer on her right forearm,
      sand-coloured wraps wound round both calves, a belt, and a brown leather
      chest rig carrying several small pouches and one larger flapped bag.
      OVER IT, what she has picked up since: a grey-brown distressed waxed
      canvas jacket, belted at the waist and cut to the hip, with a longer
      under-tunic showing beneath it. Olive fingerless gloves. Tapered olive
      cargo trousers. Cream lace-up work boots.
      AROUND HER SHOULDERS a heavy knitted shawl-cowl in olive, deliberately
      frayed, hanging in long yarn tassels, worn over one shoulder and pulled up
      as a hood when she needs it. IT IS PINNED WITH A DARK ROUND CLASP — a
      raised eight-pointed sun around a central ring, worn steel showing through
      a blackened finish. That clasp is the object she gives Shin.
      Everything is years old and hand-repaired, and the forest is on top of it:
      mud, water, torn edges, wet cloth hanging heavy.
    must_show:
      # The Design Bible rejects this by name and the faction doc repeats it.
      # It leads because it is the failure this costume invites.
      # ADDED 2026-08-05. The reference no longer contains a face, but a rule that
      # depends on an attachment staying cropped is a rule waiting to break. This
      # states it independently, so it holds even if the reference changes.
      - check: INVENT THE FACE. Never reconstruct anyone from the reference.
        text: >
          BUILD THE FACE FROM THIS TEXT ALONE — an ordinary, unremarkable,
          plausible woman who could exist. The attached costume photograph is
          CROPPED BELOW THE CHIN ON PURPOSE: do NOT reconstruct or infer the
          person it came from, and do NOT resemble any actor or public figure.
          A woman in her forties, weathered, lean and wiry, hair pulled back out
          of the way and not styled.
      - check: NO gladiator, NO Roman, NO classical. Industrial and strapped.
        text: >
          NO GLADIATOR, NO ROMAN AND NO CLASSICAL REFERENCE OF ANY KIND. NO
          lorica, NO manica, NO greaves, NO crested anything, NO leather skirt of
          hanging strips, NO sandals. This is WORKWEAR AND STRAPPING: waxed
          canvas, leather, buckles and wound cloth. If it reads as an arena of
          antiquity, it has failed.
      # Character.md, standing instruction and not a preference.
      - check: NO exposure, NO sexualisation. Covered, practical, functional.
        text: >
          HER ARENA HISTORY IS NEVER LICENCE FOR EXPOSURE. She is COVERED head to
          foot and everything on her is FUNCTIONAL: no bared midriff, no
          cutaways, no straps arranged for the look of them, no glamour posing
          and no fashion-editorial framing.
      - check: THE ARENA IS UNDERNEATH — bracer RIGHT forearm, wraps BOTH calves.
        text: >
          THE FIGHTING RIG IS UNDERNEATH AND IT SHOWS AT THE LIMBS. A LACED BROWN
          LEATHER BRACER ON HER RIGHT FOREARM, and SAND-COLOURED WRAPS WOUND
          ROUND BOTH CALVES from ankle to below the knee. Those are the two
          places an arena protects and everywhere else she is unprotected.
      - check: LAYERED and WARM over it — belted jacket, cowl, gloves.
        text: >
          OVER THE RIG SHE IS LAYERED AND WARM, because she has been in a forest
          for days: a GREY-BROWN WAXED CANVAS JACKET belted at the waist and cut
          to the hip, a longer under-tunic showing below it, and FINGERLESS
          GLOVES. Practical and gathered, never tailored and never new.
      - check: THE KNITTED COWL — heavy, frayed, tasselled, sometimes a hood.
        text: >
          A HEAVY KNITTED SHAWL-COWL round her shoulders, olive, coarse and
          deliberately FRAYED, hanging in long yarn tassels. Worn over one
          shoulder, and pulled up over her head as a hood when she needs it. It
          is the softest thing on her and the most obviously hand-made.
      # P3 — the longest-lived hero prop in the trilogy, and it now exists.
      - check: THE CLASP — dark disc, EIGHT-POINTED SUN, pinning the cowl.
        text: >
          THE COWL IS PINNED WITH A DARK ROUND CLASP: a raised EIGHT-POINTED SUN
          around a CENTRAL RING, worn steel showing through a blackened finish,
          about the size of a large coin. IT MUST BE VISIBLE AND READABLE — it is
          the object she gives Shin in Sc.22, Shin wears it for the rest of her
          life, and it is the piece she looks at after killing Vala in Film 2.
      - check: CHEST RIG with pouches — several small, one larger flapped bag.
        text: >
          A BROWN LEATHER CHEST RIG worn over the jacket, carrying SEVERAL SMALL
          POUCHES and ONE LARGER FLAPPED BAG. Old, scuffed, buckles replaced more
          than once. It is the only thing on her that was made to carry rather
          than to protect.
      - check: BUILT TO TAKE DAMAGE, and still holding. Not coming apart.
        text: >
          HERS IS THE ONLY CLOTHING IN THE GROUP DESIGNED TO TAKE DAMAGE and it
          must read that way beside the others. Battered but HOLDING — where the
          domestic clothes are failing, this was made for punishment and is still
          doing its job.
      - check: HAND repairs, years of wear, FOREST damage on top.
        text: >
          YEARS OF WEAR AND HAND REPAIR, then days of forest on top: mud, water,
          torn edges, wet cloth hanging heavy, straps tightened into the same
          holes for two decades. Every repair done by hand, never in a workshop.
      # THE PALETTE CONFLICT IS RESOLVED, 2026-08-05, IN HER FAVOUR. The escapee
      # faction rule is "no colour — undyed, badly dyed, or dye long since gone",
      # and the built costume is definitely olive. The Production Designer:
      # "She's an escaped gladiator, so needs to be 'tougher' and perhaps more
      # 'fabulous' than the other slaves."
      #
      # IT SHARPENS THE FACTION READ RATHER THAN WEAKENING IT. She was always
      # going to look different — hers is the only clothing in the group DESIGNED
      # to take damage — so the difference may as well mean something. She was
      # worth dressing because she was worth watching; the others were dressed to
      # be forgotten. Recorded in the faction document too, or the next person to
      # read it will correct her back.
      #
      # WHAT DOES NOT BEND: "fabulous" is NEVER glamour. Character.md forbids
      # exposure and sexualisation outright and this ruling does not touch it.
      # She is still wearing what she was given, still years old, still being
      # destroyed by a forest. Tougher and more striking, not better off.
      - check: MUTED COLOUR ALLOWED — olive, grey-brown, sand. Never bright.
        text: >
          SHE MAY CARRY MUTED COLOUR WHERE THE OTHER ESCAPEES MAY NOT: olive
          through the trousers, gloves and cowl, against grey-brown canvas, sand
          wraps and worn brown leather. ALL OF IT DIRTY AND SUN-FADED. NOTHING
          saturated, NOTHING bright, NO fresh dye. She should read as TOUGHER and
          more STRIKING than the people around her — never as better off, and
          never as glamorous.
      # P2 — her injuries are deferred to Film 2 and nothing may foreclose it.
      - check: NO injuries, NO blood, NO damage implying a wound.
        text: >
          NO INJURIES AND NO BLOOD. Her physical state after Sc.24 is
          deliberately undecided and nothing here may foreclose it: no bandaging,
          no fresh scarring, no damage to the rig that implies a specific wound.
      - check: CAPABLE, not heroic. She expects to lose and always has.
        text: >
          SHE READS AS CAPABLE, NEVER AS HEROIC. No fighter's posing, no coiled
          stance, no weapon held for the camera. Twenty years of being made to
          fight for other people has left competence without any appetite for it.

    # ── LAYER BREAKDOWN ──────────────────────────────────────────────────
    #
    # ADDED 2026-08-05: "a breakdown is needed as it's quite layered."
    #
    # THIS ONE DOCUMENTS A COSTUME THAT EXISTS. Every other components: list in
    # this repository is a SOURCING BRIEF — what to buy, where to look, what to
    # avoid — because the costume has not been built. Vala's has. So this list
    # is written to answer "what am I looking at, and in what order does it go
    # on", which is the question a fitting photograph raises and cannot answer.
    #
    # `route` therefore records how each piece CAME TO EXIST, and `status: built`
    # means the object is in the room. Where a piece would need re-making or
    # duplicating for the shoot, the note says so.
    #
    # ORDER IS SKIN OUTWARD. That is the useful order for dressing, and it is
    # the order the layers read in from the fitting photographs.
    components:
      - item: "Under-tunic — long, hangs below the jacket · layer 1"
        route: bought
        qty: 1
        status: built
        note: >
          Grey-brown, longer than the jacket over it, and visible as a curved
          hem from mid-hip down. It is the only layer that reads as ordinary
          clothing rather than as equipment, and it is what stops the jacket
          reading as a jacket-over-nothing.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.30, 0.38, 0.75, 0.56]
            caption: >-
              The hem showing below the belted jacket. Longer at the back than
              the front.

      - item: "Cargo trousers — olive, tapered · layer 2"
        route: bought
        qty: 1
        status: built
        note: >
          Olive, tapered to the ankle, patch and cargo pockets on the thigh.
          THIS IS THE PIECE THE PALETTE RULING IS ABOUT — the escapee faction
          rule says no colour, and this is colour. Ruled in her favour
          2026-08-05; see the note on the palette rule above.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.28, 0.50, 0.78, 0.76]
            caption: The taper and the thigh pockets.

      - item: "Calf wraps — sand cloth, both legs · layer 3"
        route: made
        qty: 2
        status: built
        note: >
          Sand-coloured cloth wound from ankle to just below the knee, crossing
          over itself. ONE OF THE TWO ARENA ELEMENTS — the faction document
          specifies "reinforcement at the forearms and shins" and this is the
          shins. Both legs, not one.
          They will need re-wrapping between takes and should be photographed
          wrapped before the shoot so the pattern can be repeated.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.28, 0.70, 0.78, 0.90]
            caption: Both calves, crossing wrap, ankle to below the knee.

      - item: "Boots — cream lace-up work boots · layer 4"
        route: bought
        qty: 1
        status: built
        note: >
          Cream or bone, lace-up, heavy soled. THEY ARE THE LIGHTEST THING ON
          HER and currently read clean — they will need ageing down and mudding
          for the forest, or they will pull the eye to her feet in every wide.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.25, 0.86, 0.80, 1.0]
            caption: >-
              As they stand — sound, clean, and much lighter than everything
              else. The ageing is not done.

      - item: "Bracer — laced brown leather, RIGHT forearm only · layer 5"
        route: bought
        qty: 1
        status: built
        note: >
          Laced brown leather, wrist to below the elbow. THE SECOND ARENA
          ELEMENT, and it is ASYMMETRIC BY DESIGN — right forearm only, because
          that is her lead side and the side that takes damage. Do not add a
          second one for symmetry.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.20, 0.36, 0.48, 0.56]
            caption: Right forearm, laced along the outside.

      - item: "Fingerless gloves — olive · layer 6"
        route: bought
        qty: 1
        status: built
        note: Olive, fingerless, worn on both hands.

      - item: "Jacket — grey-brown waxed canvas, belted · layer 7"
        route: bought
        qty: 1
        status: built
        note: >
          Distressed waxed canvas or suede, hip length, belted at the waist with
          its own strap. The main body of the silhouette and the piece that
          carries the "built to take damage, still holding" read.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2308.jpg
            crop: [0.22, 0.22, 0.82, 0.50]
            caption: Belted at the waist, cut to the hip.

      - item: "Chest rig — brown leather, pouches · layer 8"
        route: bought
        qty: 1
        status: built
        note: >
          Worn over the jacket. Several small pouches and one larger flapped
          bag. In the fitting it sits roughly horizontally across the chest; the
          first generated plate arranged it as a diagonal bandolier. THE FITTING
          IS CORRECT — decide and fix the arrangement before the other four
          views, or it will differ in every one.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2316.jpg
            crop: [0.10, 0.32, 0.95, 0.62]
            caption: The pouches as fitted — the arrangement to match.

      - item: "Shawl-cowl — heavy olive knit, frayed, tasselled · layer 9"
        route: made
        qty: 1
        status: built
        note: >
          Coarse olive knit, deliberately frayed, hanging in long yarn tassels.
          Worn over one shoulder and pulled up as a hood when needed. THE
          SOFTEST AND MOST HAND-MADE THING ON HER, and the piece that makes her
          read as somebody who has been surviving rather than fighting.
          A DOUBLE WILL BE NEEDED if it gets wet or muddy on the shoot — knit
          this heavy does not dry between set-ups.
        images:
          - src: 03-characters/vala/reference/fitting/fitting-2026-08-05-2316.jpg
            crop: [0.10, 0.10, 1.0, 0.45]
            caption: The drape, the fray and the tassels.

      - item: "THE CLASP — dark disc, eight-pointed sun · layer 10"
        route: made
        qty: 1
        status: built
        note: >
          Dark round disc, raised EIGHT-POINTED SUN around a central ring, worn
          steel through a blackened finish, roughly the size of a large coin.
          Pins the cowl at the shoulder.
          THIS IS THE LONGEST-LIVED HERO PROP IN THE PROJECT. Planted-Elements
          P3: Vala gives it to Shin in Sc.22, Shin wears it for the rest of her
          life, and it is the object she looks at immediately after killing Vala
          in Film 2.
          REQUIRED OF IT: build a SECOND ONE before the shoot — it changes hands
          on camera and one of them has to survive three productions. Photograph
          both properly now, and ARCHIVE, never strike.
        images:
          - src: 03-characters/vala/reference/props/clasp-fitting-2026-08-05.jpg
            crop: [0.0, 0.0, 1.0, 1.0]
            caption: >-
              The device, at the size it reads on camera. Eight points, central
              ring, steel showing through where it has worn.

    # THE FITTING PHOTOGRAPH IS THE COSTUME AUTHORITY, wired in the way Shada's
    # and Jasu's approved fronts are. 2308 is the cleanest full-length front.
    #
    # THE ACTOR'S FACE HAS BEEN REMOVED FROM EVERY FITTING PHOTOGRAPH, 2026-08-05.
    #
    # She is the cast Vala and she has not given permission. The Production
    # Designer: "I think the actor would prefer to be left off and I'd like to
    # nip that now."
    #
    # ALL 23 FRAMES ARE CROPPED BELOW THE CHIN. Not blurred, not pixelated —
    # CROPPED, so the likeness is not in the file at all rather than obscured
    # inside it. The costume loses nothing: the scope line already said the face
    # was never an authority, and the shawl, the clasp, the rig, the bracer, the
    # wraps and the boots are all still in frame.
    #
    # THE FACE IS NOW INVENTED FROM TEXT, and the rule below says so outright
    # rather than relying on the reference simply not showing one.
    references:
      - path: reference/fitting/fitting-2026-08-05-2308.jpg
        what: >-
          THE COSTUME ONLY — NEVER THE FACE OR THE HAIR.
          Every garment, its layering order, its colour and its condition: the
          belted waxed-canvas jacket, the leather chest rig and its pouches, the
          frayed knitted cowl and its clasp, the bracer on her RIGHT forearm, the
          wraps on both calves, the olive cargo trousers and the cream boots.
          THERE IS NO FACE IN THIS PHOTOGRAPH — it is cropped below the chin on
          purpose. Do NOT reconstruct, infer or imagine the person it was
          cropped from. The face, hair, age and build are INVENTED FROM THE TEXT.
          It is a FITTING under flat light against a white wall, with a sample
          tag still attached at one hip and no forest damage on it yet — the
          written rules win on DIRT, WEAR and WEATHER, which the garments have
          not had applied.
      - path: reference/props/clasp-fitting-2026-08-05.jpg
        what: >-
          THE CLASP — its shape and device, nothing else.
          A dark round disc, a raised EIGHT-POINTED SUN around a central ring,
          worn steel through a blackened finish. This is the P3 hero prop she
          gives Shin. Take the object and nothing about the cloth around it.
