character: Yaslo Bis
ratio: "2:3"

# DRAFTED 2026-08-05 from 04-factions/mercenaries/Faction.md and Character.md.
#
# HIS DESIGN HAS ONE DECIDED FEATURE AND IT IS MARKED PROVISIONAL IN HIS OWN
# FILE: "Species: human, with cybernetics over the face and possibly the arms.
# Decided 2026-08-04. PROVISIONAL — check at his design pass, before any prompt
# is written. The extent is deliberately unfixed: FACE is the decision, ARMS is
# a maybe."
#
# THIS DRAFT TAKES THE NARROW READING — face only, one side, arms left alone —
# and the reason is his own constraint, quoted from Character.md:
#
#   "He is the warm one — he deals, he takes the mickey out of Nyx, and the
#   group laughs WITH him. Then he is the one who says 'looks like we get to do
#   this the fun way' with blasters pointed at a fifteen-year-old. THE SABACC
#   SCENE HAS TO BE GENUINELY WARM, so the facework cannot cost him expression
#   or make him read as a thug."
#
# Every square centimetre of prosthetic is expression the actor cannot use. The
# narrow reading buys the "visibly other" the cybernetics were chosen for while
# leaving the eyes, the mouth and one whole side of the face free to do the
# work the scene needs. THE EXTENT IS THE DECISION TO RULE ON.

# PROVISIONAL. Nothing states it. He deals the cards in Sc.10.
handedness: right

# PROVISIONAL. Nothing states it.
height: 183 cm (6 ft 0 in) — loose-limbed and easy, a man who sprawls in a chair

# ── OWNERSHIP CHANGED 2026-08-05: THIS COSTUME IS A 3D PRINT BUILD ──────────
#
# The Production Designer: Reya and Yaslo Bis "are both going to be fully 3D
# printed, so while some docs will be cool for reference, we don't need to prep
# a design doc in a hurry as that's the 3D team."
#
# WHAT THAT CHANGES: this file is now REFERENCE, not a build specification. The
# 3D team owns the object. Do not spend generations refining the written rules
# the way Baylan's were refined — the words no longer decide what gets made.
#
# WHAT IT DOES NOT CHANGE: the images are still wanted, and are now MORE useful
# rather than less. A generated front is a visual target the 3D team can work
# toward, and every character front is also poster source — see
# 09-prompt-library/Key-Art-Poster-Prompt.md.
#
# SO THE ORDER OF WORK INVERTS. Normally the spec is refined until the plate is
# right and the plate then guides the build. Here the plate is the deliverable
# and the spec only has to be good enough to produce one. Generate it, look at
# it, hand it over.
#
# ANY OPEN DECISION IN THIS FILE IS NOW A CONVERSATION WITH THE 3D TEAM rather
# than a ruling to be recorded here.

# THE CONCEPT IS ATTACHED TO EVERY VIEW. It arrived after the written rules
# and overturned two of them, so it outranks them — see reference/concept/.
outfits:
  - id: working
    name: Working kit
    scenes: "Sabacc in Sc.10, the pincer group in Sc.23, the finale in Sc.25. His only costume"
    description: >
      Chosen, fitted and maintained, like everyone else in this crew, and
      matching none of them. HEAVY PLATE: layered shoulder pauldrons, a segmented
      chest and torso plate, articulated arm plating down to gauntleted fists,
      and a device mounted on his right forearm. Small triangular marks on both
      pauldrons.
      BALD, with a FULL LONG BEARD reaching his chest — the beard carries most of
      the warmth this character needs.
      A METAL PLATE OVER THE LEFT SIDE OF HIS FACE, covering brow, eye socket and
      cheekbone and wrapping to the temple, with cables looping back around the
      ear. THE LEFT EYE IS A RED LENS AND IT IS LIT. The right side of his face
      is untouched human skin.
      Everything is well kept. Repairs done properly, hardware working, cloth
      brushed. He is not fastidious; he simply has money and takes care of his
      things.
      A personal mark somewhere small and unheroic — a kept object, a good buckle,
      something bought rather than won.
    references:
      - path: reference/concept/yaslo-concept-2026-08-05.jpg
        what: >-
          THE HEAD AND THE PLATE — not the drawing style.
          Bald, full long beard to the chest, a metal plate over the LEFT side of
          the face covering brow, eye socket and cheekbone with cables looping
          back around the ear, and a LIT RED LENS where the left eye was. The
          right side is untouched human skin. Heavy layered pauldrons and a
          segmented chest plate.
          IT IS A CONCEPT SKETCH — part line drawing, part composited photograph.
          Take the DESIGN and nothing about the rendering: this is a PHOTOGRAPH
          of a real man in a real costume, not artwork.
    must_show:
      # The constraint the whole design has to survive.
      - check: THE FACEWORK MUST NOT COST HIM EXPRESSION. He is the warm one.
        text: >
          THE CYBERNETICS COVER ONE SIDE OF HIS FACE AND NO MORE. The EYES, the
          MOUTH and the whole opposite side are UNTOUCHED HUMAN SKIN and fully
          expressive. He is the warm one in this crew — he deals, he takes the
          mickey, the group laughs WITH him — and if the facework costs him a
          smile the design has failed.
      - check: NOT A THUG. Open, sociable, enjoying himself.
        text: >
          HE MUST NOT READ AS A THUG OR AS A HEAVY. Open, sociable, relaxed,
          somebody you would want at your table. The finale gains nothing unless
          the Sabacc scene was genuinely warm first.
      # OVERTURNED 2026-08-05 BY THE PRODUCTION DESIGNER'S OWN CONCEPT — see
      # reference/concept/. This said "NOTHING LIT, NOTHING glowing". The concept
      # lights the eye red, deliberately, so the rule changes and not the concept.
      # What the rule was protecting still has to survive: the lit eye is on ONE
      # SIDE and the other eye plays the scene.
      - check: LEFT eye a LIT RED LENS. The plate itself old, matte, worn.
        text: >
          HIS LEFT EYE IS A RED LENS AND IT IS LIT — a steady dull red, never
          bright enough to throw light onto his face and NEVER the subject of the
          frame. THE PLATE AROUND IT IS OLD: matte, dulled, worn smooth at the
          edges where he touches it without thinking. Nothing else on him is lit,
          nothing whirs, nothing reads as new.
      # ALSO OVERTURNED. This said "SOFT, not armoured — the least plated man in
      # the crew", invented from the faction grammar with nothing to work from.
      # The concept is the opposite, and hard plate is what a 3D print build is
      # FOR. The replacement rule carries the job the old one was doing: keeping
      # him and Reya Fenn — also armoured, also printed — from becoming a pair.
      - check: HEAVILY PLATED, and NOT a matched pair with Reya Fenn.
        text: >
          HEAVY PLATE: layered shoulder pauldrons, a segmented chest and torso,
          articulated arms to gauntleted fists. HE MUST NOT MATCH REYA FENN, who
          is also armoured — HERS IS SEALED, ANONYMOUS AND CLOSED; HIS IS
          OPEN-FACED, PERSONAL AND MARKED. Two members dressed by the same person
          is the one thing this faction refuses.
      - check: EVERY PIECE WAS CHOSEN. Nothing issued, nothing matching.
        text: >
          EVERY PIECE ON HIM WAS CHOSEN AND PAID FOR BY HIM. NOTHING issued,
          NOTHING matching another crew member, NO uniform, NO insignia and NO
          faction colour. If he looks dressed by the same person as anyone else,
          it is wrong.
      - check: MAINTAINED and GOOD — repaired properly, quality reads at distance.
        text: >
          HIS KIT IS MAINTAINED AND IT IS GOOD. Repairs done properly with tools
          and materials, hardware working, cloth brushed, boots sound. The quality
          reads at a distance. Worn, never ruined.
      - check: NO military read. Not a soldier and never was.
        text: >
          NO MILITARY UNIT READ — no rank, no regulation webbing, no modern
          tactical or SWAT language. He is a self-employed professional who is
          good at an ugly job.
      # He is explicitly NOT one of the four kit builds.
      - check: NOT a Mercenary Kit build — his own costume, his own silhouette.
        text: >
          HE IS NOT A BACKGROUND KIT BUILD. He has a speaking part in two scenes
          in good light and his silhouette must be his own — distinct from Merc 1
          to Merc 4 and from every other named crew member.
